name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build-ipa:
    runs-on: macos-14 # 使用 Apple Silicon (M系列) 节点

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 全局写入 Python 环境变量
      - name: Add Python to Global PATH
        run: |
          echo "$(dirname $(which python3))" >> $GITHUB_PATH

      # 优先恢复 Kivy-iOS 编译缓存
      - name: Restore Kivy-iOS Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.kivy-ios
          key: ${{ runner.os }}-kivy-ios-v1

      - name: Install dependencies & kivy-ios
        run: |
          brew install autoconf automake libtool pkg-config
          pip install kivy-ios cython

      # 隔离 App 源码目录
      - name: Prepare App Source & Build Kivy iOS Toolchain
        run: |
          mkdir -p app_src
          cp main.py app_src/
          cp *.py app_src/ 2>/dev/null || true
          [ -d assets ] && cp -r assets app_src/ || true
          
          toolchain build python3 kivy 2>&1 | grep -v -E "Listing '|compiling '" || true
          toolchain create cloudflarescan app_src

      # 保存环境缓存
      - name: Save Kivy-iOS Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.kivy-ios
          key: ${{ runner.os }}-kivy-ios-v1

      - name: Compile Xcode & Package IPA
        run: |
          cd cloudflarescan-ios
          
          # 强行修补 project.pbxproj 脚本，忽略 rsync 的非致命警告
          python3 -c "
          path = 'cloudflarescan.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              data = f.read()
          data = data.replace('shellScript = \"', 'shellScript = \"set +e; ')
          with open(path, 'w') as f:
              f.write(data)
          "
          
          # 明确指定 CONFIGURATION_BUILD_DIR，确保生成产物路径固定
          xcodebuild -project cloudflarescan.xcodeproj \
                     -scheme cloudflarescan \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     CONFIGURATION_BUILD_DIR=build/Release-iphoneos \
                     ARCHS="arm64" \
                     ONLY_ACTIVE_ARCH=NO \
                     IPHONEOS_DEPLOYMENT_TARGET=13.0 \
                     ENABLE_USER_SCRIPT_SANDBOXING=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build
          
          # 直接精确拷贝打包
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r CloudFlareScan.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: cloudflarescan-ios/CloudFlareScan.ipa
