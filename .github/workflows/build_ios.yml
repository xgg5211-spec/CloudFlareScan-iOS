name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install macOS System Dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config cmake ldid

      - name: Install Kivy-iOS and Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0.0"
          pip install kivy-ios

      # 升级缓存 Key (v7) 彻底清理旧的过期缓存文件
      - name: Restore Kivy-iOS Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kivy-ios
            build
            dist
          key: ${{ runner.os }}-kivy-ios-v7-${{ hashFiles('**/main.py') }}
          restore-keys: |
            ${{ runner.os }}-kivy-ios-v7-

      - name: Build Kivy-iOS Recipes
        run: |
          toolchain build python3 kivy openssl

      - name: Clean Python Cache & Create Xcode Project
        run: |
          # 关键修复：强行清理缓存与 pycache，防止 rsync 触发 code 24 导致 PhaseScriptExecution 失败
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          toolchain create "cloudflarescan" .

      - name: Build Xcode Project
        run: |
          cd cloudflarescan-ios
          # 关键修复：将 IPHONEOS_DEPLOYMENT_TARGET 提升至 13.0，适配 Xcode 15
          xcodebuild -project cloudflarescan.xcodeproj \
            -scheme cloudflarescan \
            -configuration Release \
            -sdk iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -R cloudflarescan-ios/build/Release-iphoneos/*.app Payload/
          APP_NAME=$(ls Payload/)
          ldid -S "Payload/$APP_NAME/cloudflarescan" || ldid -S "Payload/$APP_NAME/${APP_NAME%.app}"
          zip -r CloudflareScan-iOS-TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-iOS-TrollStore
          path: CloudflareScan-iOS-TrollStore.ipa
          retention-days: 7
