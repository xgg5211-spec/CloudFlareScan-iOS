name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install macOS System Dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config cmake ldid

      - name: Install Kivy-iOS and Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0.0"
          pip install kivy-ios

      - name: Restore Kivy-iOS Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kivy-ios
            build
            dist
          key: ${{ runner.os }}-kivy-ios-v4-${{ hashFiles('**/requirements.txt', '**/main.py') }}
          restore-keys: |
            ${{ runner.os }}-kivy-ios-v4-

      - name: Build Kivy-iOS Recipes
        run: |
          toolchain build python3 kivy openssl

      - name: Install Python Package Dependencies
        run: |
          toolchain pip install certifi aiohttp multidict yarl frozenlist aiosignal async-timeout

      - name: Create Xcode Project
        run: |
          toolchain create "cloudflarescan" .

      - name: Build Xcode Project
        run: |
          cd cloudflarescan-ios
          # 修正：将 -scheme 统一修改为全小写 cloudflarescan
          xcodebuild -project cloudflarescan.xcodeproj \
            -scheme cloudflarescan \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          # 修正：使用通配符匹配 .app 路径与可执行文件，防止大小写不一致导致的找不到文件问题
          cp -R cloudflarescan-ios/build/Release-iphoneos/*.app Payload/
          APP_NAME=$(ls Payload/)
          ldid -S "Payload/$APP_NAME/cloudflarescan" || ldid -S "Payload/$APP_NAME/${APP_NAME%.app}"
          zip -r CloudflareScan-iOS-TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-iOS-TrollStore
          path: CloudflareScan-iOS-TrollStore.ipa
          retention-days: 7
