name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Create Web App
        run: |
          mkdir -p CloudFlareScan

          cat > CloudFlareScan/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>优选IP扫描</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { background: #0a0e1a; color: #fff; font-family: -apple-system, sans-serif; padding: 16px; min-height: 100vh; }
                  .card { background: #141b2e; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #1a2a4a; }
                  h2 { font-size: 18px; margin-bottom: 12px; color: #4fc3f7; }
                  textarea { width: 100%; height: 100px; background: #0a0e1a; color: #fff; border: 1px solid #1a2a4a; border-radius: 8px; padding: 10px; font-size: 14px; font-family: monospace; resize: vertical; }
                  .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin: 4px; }
                  .btn-primary { background: #1976d2; color: #fff; }
                  .btn-success { background: #2e7d32; color: #fff; }
                  .btn-danger { background: #c62828; color: #fff; }
                  .btn-secondary { background: #455a64; color: #fff; }
                  .ip-item { display: flex; justify-content: space-between; padding: 8px 12px; background: #0a0e1a; border-radius: 6px; margin: 4px 0; font-size: 13px; }
                  .stats { display: flex; gap: 16px; font-size: 13px; color: #90a4ae; }
                  .stats span { color: #4fc3f7; font-weight: bold; }
                  #output { height: 80px; }
                  .btn-group { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h2>🚀 优选IP筛选</h2>
                  <div class="stats">
                      <div>总数: <span id="total">0</span></div>
                      <div>可用: <span id="available">0</span></div>
                      <div>最佳: <span id="best">--</span></div>
                  </div>
              </div>

              <div class="card">
                  <h2>📂 导入IP (每行一个)</h2>
                  <textarea id="input">1.1.1.1
          8.8.8.8
          9.9.9.9
          104.16.0.0</textarea>
                  <div class="btn-group">
                      <button class="btn btn-primary" onclick="importIPs()">📥 导入</button>
                      <button class="btn btn-success" onclick="startScan()">▶ 开始</button>
                      <button class="btn btn-danger" onclick="stopScan()">⏹ 停止</button>
                      <button class="btn btn-secondary" onclick="copyResults()">📋 复制</button>
                  </div>
              </div>

              <div class="card">
                  <h2>📋 可用IP</h2>
                  <div id="ipList"><div style="color:#666;text-align:center;padding:20px;">暂无数据</div></div>
              </div>

              <div class="card">
                  <h2>📝 输出</h2>
                  <textarea id="output" readonly></textarea>
                  <button class="btn btn-secondary" onclick="copyOutput()">📋 复制输出</button>
              </div>

              <script>
                  let ipList = [];
                  let results = [];
                  let isScanning = false;
                  let scanTimer = null;

                  function importIPs() {
                      const text = document.getElementById('input').value;
                      const lines = text.split('\n').filter(l => l.trim());
                      ipList = lines.map(l => {
                          const parts = l.trim().split(':');
                          return { ip: parts[0], port: parseInt(parts[1]) || 443 };
                      });
                      document.getElementById('total').textContent = ipList.length;
                      document.getElementById('available').textContent = '0';
                      document.getElementById('best').textContent = '--';
                      results = [];
                      renderIPs();
                      showStatus('已导入 ' + ipList.length + ' 个IP');
                  }

                  async function startScan() {
                      if (ipList.length === 0) {
                          showStatus('请先导入IP');
                          return;
                      }
                      isScanning = true;
                      results = [];
                      showStatus('扫描中...');

                      const port = 443;
                      let found = 0;
                      const allResults = [];

                      for (const ip of ipList) {
                          if (!isScanning) break;
                          const result = await checkIP(ip.ip, port);
                          if (result) {
                              allResults.push(result);
                              found++;
                              results = allResults;
                              renderIPs();
                              document.getElementById('available').textContent = found;
                              const delays = allResults.map(r => r.delay);
                              if (delays.length > 0) {
                                  document.getElementById('best').textContent = Math.min(...delays).toFixed(0) + 'ms';
                              }
                              showStatus('扫描中... ' + found + ' 个可用');
                          }
                      }

                      isScanning = false;
                      results = allResults;
                      renderIPs();
                      showStatus('✅ 完成！共 ' + results.length + ' 个可用IP');
                      updateOutput();
                  }

                  function checkIP(ip, port) {
                      return new Promise((resolve) => {
                          const url = 'https://' + ip + ':' + port + '/cdn-cgi/trace';
                          const start = Date.now();
                          fetch(url, { mode: 'cors' })
                              .then(res => {
                                  if (res.ok) {
                                      const delay = Date.now() - start;
                                      res.text().then(text => {
                                          let colo = '';
                                          text.split('\n').forEach(line => {
                                              if (line.startsWith('colo=')) colo = line.substring(5);
                                          });
                                          fetch('http://ip-api.com/json/' + ip + '?fields=country')
                                              .then(r => r.json())
                                              .then(data => {
                                                  resolve({
                                                      ip: ip,
                                                      port: port,
                                                      delay: delay,
                                                      country: data.country || '',
                                                      colo: colo
                                                  });
                                              })
                                              .catch(() => resolve(null));
                                      });
                                  } else {
                                      resolve(null);
                                  }
                              })
                              .catch(() => resolve(null));
                      });
                  }

                  function stopScan() {
                      isScanning = false;
                      showStatus('已停止');
                  }

                  function renderIPs() {
                      const container = document.getElementById('ipList');
                      if (results.length === 0) {
                          container.innerHTML = '<div style="color:#666;text-align:center;padding:20px;">暂无数据</div>';
                          return;
                      }
                      container.innerHTML = results.map(r =>
                          '<div class="ip-item">' +
                          '<span>' + r.ip + ':' + r.port + '</span>' +
                          '<span style="color:' + (r.delay < 50 ? '#4caf50' : r.delay < 100 ? '#ff9800' : '#f44336') + '">' + r.delay.toFixed(0) + 'ms</span>' +
                          '<span style="color:#90a4ae;">' + (r.country || '') + ' ' + (r.colo || '') + '</span>' +
                          '</div>'
                      ).join('');
                  }

                  function updateOutput() {
                      const text = results.map(r => r.ip + ':' + r.port + '  [' + r.delay.toFixed(0) + 'ms]  ' + r.country + '  ' + r.colo).join('\n');
                      document.getElementById('output').value = text;
                  }

                  function copyResults() {
                      const text = results.map(r => r.ip + ':' + r.port).join('\n');
                      if (text) {
                          navigator.clipboard.writeText(text).then(() => showStatus('✅ 已复制'));
                      }
                  }

                  function copyOutput() {
                      const text = document.getElementById('output').value;
                      if (text) {
                          navigator.clipboard.writeText(text).then(() => showStatus('✅ 已复制输出'));
                      }
                  }

                  function showStatus(msg) {
                      document.querySelector('.stats').innerHTML = msg;
                  }

                  // 自动导入示例
                  window.onload = function() {
                      importIPs();
                  };
              </script>
          </body>
          </html>
          EOF

      - name: Package as Web App
        run: |
          mkdir -p Payload/CloudFlareScan.app
          cp CloudFlareScan/index.html Payload/CloudFlareScan.app/

          cat > Payload/CloudFlareScan.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>index.html</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
          retention-days: 30
