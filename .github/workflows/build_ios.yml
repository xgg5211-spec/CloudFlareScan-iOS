name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create Swift Package
        run: |
          mkdir -p MyApp/Sources/MyApp
          cd MyApp

          cat > Package.swift << 'EOF'
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "MyApp",
              platforms: [
                  .iOS(.v15)
              ],
              products: [
                  .executable(name: "MyApp", targets: ["MyApp"])
              ],
              targets: [
                  .executableTarget(
                      name: "MyApp",
                      path: "Sources/MyApp"
                  )
              ]
          )
          EOF

          cd ..

      - name: Create Source Files
        run: |
          cd MyApp/Sources/MyApp

          cat > main.swift << 'EOF'
          import SwiftUI
          import UIKit

          // ===== 数据模型 =====
          struct IPItem: Identifiable {
              let id = UUID()
              var ip: String
              var port: Int
              var delay: Double
              var country: String
              var colo: String
              var isp: String
          }

          // ===== 扫描管理器 =====
          class ScanManager: ObservableObject {
              @Published var results: [IPItem] = []
              @Published var isScanning = false
              @Published var statusText = "就绪"
              @Published var availableCount = 0
              @Published var bestDelay: Double = 0
              @Published var avgDelay: Double = 0
              @Published var detectedISP: String = "检测中..."
              @Published var inputText: String = ""
              @Published var filterText: String = ""
              @Published var filterPort: String = ""

              func detectISP() {
                  guard let url = URL(string: "http://ip-api.com/json/?fields=isp") else { return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data else { return }
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         let isp = json["isp"] as? String {
                          DispatchQueue.main.async {
                              self.detectedISP = isp
                          }
                      }
                  }.resume()
              }

              func startScan() {
                  let lines = inputText.split(separator: "\n").map { String($0).trimmingCharacters(in: .whitespaces) }
                  var ips: [IPItem] = []
                  for line in lines {
                      if line.isEmpty { continue }
                      let parts = line.split(separator: ":")
                      let ip = String(parts[0])
                      let port = parts.count > 1 ? Int(parts[1]) ?? 443 : 443
                      if ip.contains(".") || ip.contains(":") {
                          ips.append(IPItem(ip: ip, port: port, delay: 0, country: "", colo: "", isp: ""))
                      }
                  }

                  if ips.isEmpty {
                      statusText = "请导入有效IP"
                      return
                  }

                  isScanning = true
                  statusText = "扫描中..."
                  results = []
                  availableCount = 0
                  bestDelay = 0
                  avgDelay = 0

                  var allResults: [IPItem] = []
                  let lock = NSLock()
                  let group = DispatchGroup()
                  let semaphore = DispatchSemaphore(value: 100)

                  for ip in ips {
                      group.enter()
                      semaphore.wait()
                      DispatchQueue.global().async {
                          self.checkIP(ip: ip) { result in
                              lock.lock()
                              if let r = result { allResults.append(r) }
                              lock.unlock()
                              semaphore.signal()
                              group.leave()

                              DispatchQueue.main.async {
                                  let available = allResults.filter { $0.delay > 0 }
                                  self.results = available
                                  self.availableCount = available.count
                                  let delays = available.map { $0.delay }
                                  if !delays.isEmpty {
                                      self.bestDelay = delays.min() ?? 0
                                      self.avgDelay = delays.reduce(0, +) / Double(delays.count)
                                  }
                                  self.statusText = "扫描中... \(available.count) 个可用"
                              }
                          }
                      }
                  }

                  group.notify(queue: .main) {
                      self.isScanning = false
                      let available = allResults.filter { $0.delay > 0 }
                      self.results = available
                      self.availableCount = available.count
                      self.statusText = "✅ 扫描完成！共 \(available.count) 个可用IP"
                  }
              }

              func checkIP(ip: IPItem, completion: @escaping (IPItem?) -> Void) {
                  let port = ip.port > 0 ? ip.port : 443
                  let urlStr = "https://\(ip.ip):\(port)/cdn-cgi/trace"
                  guard let url = URL(string: urlStr) else { completion(nil); return }

                  let start = Date()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = 3
                  let session = URLSession(configuration: config)

                  session.dataTask(with: url) { data, response, _ in
                      guard let data = data, let http = response as? HTTPURLResponse, http.statusCode == 200 else {
                          completion(nil)
                          return
                      }

                      let delay = Date().timeIntervalSince(start) * 1000
                      let text = String(data: data, encoding: .utf8) ?? ""
                      var colo = ""
                      for line in text.split(separator: "\n") {
                          if line.hasPrefix("colo=") {
                              colo = String(line.dropFirst(5))
                              break
                          }
                      }

                      var result = ip
                      result.port = port
                      result.delay = delay
                      result.colo = colo

                      let locUrl = URL(string: "http://ip-api.com/json/\(ip.ip)?fields=country,isp")!
                      URLSession.shared.dataTask(with: locUrl) { d, _, _ in
                          if let d = d,
                             let json = try? JSONSerialization.jsonObject(with: d) as? [String: Any] {
                              result.country = json["country"] as? String ?? ""
                              result.isp = json["isp"] as? String ?? ""
                          }
                          completion(result)
                      }.resume()
                  }.resume()
              }

              func stopScan() {
                  isScanning = false
                  statusText = "已停止"
              }

              var filteredResults: [IPItem] {
                  var list = results
                  if !filterText.isEmpty {
                      list = list.filter {
                          $0.country.localizedCaseInsensitiveContains(filterText) ||
                          $0.colo.localizedCaseInsensitiveContains(filterText)
                      }
                  }
                  if !filterPort.isEmpty, let port = Int(filterPort) {
                      list = list.filter { $0.port == port }
                  }
                  return list
              }

              func copyIPs() {
                  let text = filteredResults.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
                  statusText = "✅ 已复制"
              }

              func copyDetails() {
                  let text = filteredResults.map { "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
                  statusText = "✅ 已复制详情"
              }

              func copyReport() {
                  var text = "# 优选IP报告\n"
                  text += "# 运营商: \(detectedISP)\n"
                  text += "# 可用IP: \(availableCount)\n"
                  text += "# 最佳: \(String(format: "%.0f", bestDelay))ms\n"
                  text += "# 平均: \(String(format: "%.0f", avgDelay))ms\n\n"
                  text += filteredResults.map { "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
                  statusText = "✅ 已复制报告"
              }

              func exportIPs() {
                  let text = filteredResults.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
                  statusText = "✅ 已导出 \(filteredResults.count) 个IP"
              }

              var outputText: String {
                  filteredResults.map { "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)" }.joined(separator: "\n")
              }
          }

          // ===== 主视图 =====
          struct ContentView: View {
              @StateObject private var manager = ScanManager()
              @State private var alertMsg = ""

              var body: some View {
                  ZStack {
                      Color(red: 0.06, green: 0.08, blue: 0.15).ignoresSafeArea()

                      VStack(spacing: 0) {
                          HStack {
                              Text("🚀 优选IP筛选")
                                  .font(.title2)
                                  .fontWeight(.bold)
                                  .foregroundColor(.white)
                              Spacer()
                              Text("📍 \(manager.detectedISP)")
                                  .font(.caption)
                                  .foregroundColor(.blue)
                          }
                          .padding(.horizontal)
                          .padding(.top, 12)

                          HStack(spacing: 12) {
                              VStack { Text("可用").font(.caption2).foregroundColor(.gray); Text("\(manager.availableCount)").foregroundColor(.green) }
                              VStack { Text("最佳").font(.caption2).foregroundColor(.gray); Text(manager.bestDelay > 0 ? String(format: "%.0fms", manager.bestDelay) : "--").foregroundColor(.orange) }
                              VStack { Text("平均").font(.caption2).foregroundColor(.gray); Text(manager.avgDelay > 0 ? String(format: "%.0fms", manager.avgDelay) : "--").foregroundColor(.blue) }
                              Spacer()
                              Text(manager.statusText).font(.caption2).foregroundColor(.gray)
                          }
                          .padding(.horizontal)
                          .padding(.vertical, 8)
                          .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                          .cornerRadius(8)
                          .padding(.horizontal)

                          VStack(alignment: .leading, spacing: 4) {
                              Text("📂 导入IP (每行一个)").font(.caption).foregroundColor(.gray)
                              TextEditor(text: $manager.inputText)
                                  .font(.system(.caption, design: .monospaced))
                                  .foregroundColor(.white)
                                  .frame(height: 70)
                                  .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                  .cornerRadius(6)
                          }
                          .padding(.horizontal)
                          .padding(.top, 8)

                          HStack(spacing: 8) {
                              Button("▶ 开始") { manager.startScan() }
                                  .buttonStyle(.borderedProminent)
                                  .font(.caption)
                                  .disabled(manager.isScanning)

                              Button("⏹ 停止") { manager.stopScan() }
                                  .buttonStyle(.bordered)
                                  .font(.caption)
                                  .disabled(!manager.isScanning)

                              Menu {
                                  Button("复制IP") { manager.copyIPs(); alertMsg = "已复制" }
                                  Button("复制详情") { manager.copyDetails(); alertMsg = "已复制详情" }
                                  Button("复制报告") { manager.copyReport(); alertMsg = "已复制报告" }
                                  Button("导出IP") { manager.exportIPs(); alertMsg = "已导出" }
                              } label: {
                                  Label("📋", systemImage: "doc.on.doc")
                                      .font(.caption)
                                      .padding(.horizontal, 8)
                                      .padding(.vertical, 6)
                                      .background(Color.blue.opacity(0.2))
                                      .cornerRadius(6)
                                      .foregroundColor(.blue)
                              }
                              .disabled(manager.results.isEmpty)

                              Button("🗑 清空") {
                                  manager.results = []
                                  manager.availableCount = 0
                                  manager.bestDelay = 0
                                  manager.avgDelay = 0
                                  alertMsg = "已清空"
                              }
                              .buttonStyle(.bordered)
                              .font(.caption)
                              .disabled(manager.results.isEmpty)
                          }
                          .padding(.horizontal)
                          .padding(.vertical, 6)

                          HStack {
                              Text("🔍 地区:").font(.caption2).foregroundColor(.gray)
                              TextField("过滤地区", text: $manager.filterText)
                                  .textFieldStyle(.roundedBorder)
                                  .font(.caption)
                                  .frame(width: 100)
                              Text("端口:").font(.caption2).foregroundColor(.gray).padding(.leading, 8)
                              TextField("过滤端口", text: $manager.filterPort)
                                  .textFieldStyle(.roundedBorder)
                                  .font(.caption)
                                  .frame(width: 60)
                              Spacer()
                              Text("显示 \(manager.filteredResults.count) 个")
                                  .font(.caption2)
                                  .foregroundColor(.blue)
                          }
                          .padding(.horizontal)
                          .padding(.vertical, 4)

                          List(manager.filteredResults) { ip in
                              HStack {
                                  Text(ip.ip).font(.system(.caption, design: .monospaced)).foregroundColor(.white)
                                  Text(":\(ip.port)").font(.caption2).foregroundColor(.gray)
                                  Spacer()
                                  Text("\(String(format: "%.0f", ip.delay))ms")
                                      .font(.caption).fontWeight(.bold)
                                      .foregroundColor(ip.delay < 50 ? .green : ip.delay < 100 ? .orange : .red)
                                  if !ip.colo.isEmpty { Text("🏢\(ip.colo)").font(.caption2).foregroundColor(.blue) }
                                  Text("📍\(ip.country)").font(.caption2).foregroundColor(.gray)
                              }
                              .padding(.vertical, 2)
                          }
                          .listStyle(.plain)
                          .scrollContentBackground(.hidden)

                          VStack(alignment: .leading, spacing: 4) {
                              Text("📝 输出").font(.caption).foregroundColor(.gray)
                              TextEditor(text: .constant(manager.outputText))
                                  .font(.system(.caption, design: .monospaced))
                                  .foregroundColor(.white)
                                  .frame(height: 60)
                                  .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                  .cornerRadius(6)
                          }
                          .padding(.horizontal)
                          .padding(.bottom, 8)
                      }
                  }
                  .alert(alertMsg, isPresented: .constant(!alertMsg.isEmpty)) {
                      Button("确定") { alertMsg = "" }
                  }
                  .onAppear {
                      manager.detectISP()
                      manager.inputText = "1.1.1.1\n8.8.8.8\n9.9.9.9\n104.16.0.0"
                  }
              }
          }

          // ===== App 入口 =====
          @main
          struct MyApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cd ../../..

      - name: Build with SwiftPM
        run: |
          cd MyApp
          swift build -c release --arch arm64 --static-swift-stdlib

      - name: Package as IPA
        run: |
          cd MyApp
          mkdir -p Payload/MyApp.app
          cp .build/arm64-apple-ios/release/MyApp Payload/MyApp.app/
          cp Sources/MyApp/Info.plist Payload/MyApp.app/ 2>/dev/null || echo "无Info.plist"
          
          cat > Payload/MyApp.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>MyApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.myapp.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP筛选</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          zip -r ../CloudFlareScan.ipa Payload
          cp ../CloudFlareScan.ipa ../CloudFlareScan.tipa
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
          retention-days: 30
