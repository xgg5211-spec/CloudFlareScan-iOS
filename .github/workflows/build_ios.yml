name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create Xcode Project using xcodebuild
        run: |
          # 用 xcodebuild 创建空项目
          mkdir -p CloudFlareScan
          cd CloudFlareScan

          # 创建 Info.plist
          cat > Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>CloudFlareScan</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP筛选</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          cd ..

      - name: Create Source Code
        run: |
          cd CloudFlareScan

          # main.m - 最简单入口
          cat > main.m << 'EOF'
          #import <UIKit/UIKit.h>

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              self.window.rootViewController = [[UIViewController alloc] init];
              self.window.rootViewController.view.backgroundColor = [UIColor colorWithRed:0.06 green:0.08 blue:0.15 alpha:1];
              self.window.rootViewController.title = @"🚀 优选IP";

              UILabel *label = [[UILabel alloc] init];
              label.text = @"CloudFlare 优选IP扫描工具\n\n点击扫描按钮开始";
              label.numberOfLines = 0;
              label.textAlignment = NSTextAlignmentCenter;
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont systemFontOfSize:18];
              label.frame = CGRectMake(0, 0, 300, 100);
              label.center = self.window.rootViewController.view.center;
              [self.window.rootViewController.view addSubview:label];

              [self.window makeKeyAndVisible];
              return YES;
          }

          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, @"AppDelegate");
              }
          }
          EOF

          cd ..

      - name: Create Xcode Project with xcodegen
        run: |
          # 安装 xcodegen
          brew install xcodegen

          # 创建 project.yml
          cat > project.yml << 'EOF'
          name: CloudFlareScan
          targets:
            CloudFlareScan:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources: 
                - CloudFlareScan/main.m
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.cloudflarescan.ios
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
                  DEVELOPMENT_TEAM: ""
                  INFOPLIST_FILE: CloudFlareScan/Info.plist
                  GENERATE_INFOPLIST_FILE: NO
          EOF

          # 生成项目
          xcodegen generate

          # 验证
          ls -la CloudFlareScan.xcodeproj/

      - name: Build App
        run: |
          xcodebuild -project CloudFlareScan.xcodeproj \
            -scheme CloudFlareScan \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到 .app 文件"
            find . -name "*.app" -type d 2>/dev/null
            exit 1
          fi

          echo "✅ 找到: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa
          ls -la *.ipa *.tipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
          retention-days: 30
