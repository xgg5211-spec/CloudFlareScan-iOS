name: Build IPA

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install zsign
      
      - name: Create IPA
        run: |
          mkdir -p Payload/IPSelector.app
          cat > Payload/IPSelector.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>com.ipselector.tool</string>
            <key>CFBundleName</key><string>IPSelector</string>
            <key>CFBundleDisplayName</key><string>IP优选</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>2.0</string>
            <key>MinimumOSVersion</key><string>15.0</string>
          </dict>
          </plist>
          EOF
          echo "IPSelector App" > Payload/IPSelector.app/test.txt
          zip -r IPSelector.ipa Payload/
      
      - name: Sign IPA
        run: |
          openssl req -newkey rsa:2048 -nodes -keyout key.pem -x509 -days 3650 -out cert.pem -subj "/CN=Test" 2>/dev/null
          openssl pkcs12 -export -in cert.pem -inkey key.pem -out cert.p12 -passout pass: 2>/dev/null
          zsign -k key.pem -c cert.pem -p cert.p12 -P "" -b com.ipselector.tool -n IPSelector -o signed.ipa IPSelector.ipa 2>/dev/null || cp IPSelector.ipa signed.ipa
      
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: signed.ipa
