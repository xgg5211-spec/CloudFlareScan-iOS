      - name: Build Archive
        run: |
          xcodebuild -project CloudFlareScan.xcodeproj \
            -scheme CloudFlareScan \
            -configuration Release \
            -derivedDataPath build \
            clean archive \
            -archivePath build/CloudFlareScan.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Find and Package IPA
        run: |
          # 查找 .app 文件
          echo "查找 .app 文件..."
          find . -name "*.app" -type d 2>/dev/null
          
          # 从 Archive 中提取 .app
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          echo "找到 APP: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到 .app 文件"
            exit 1
          fi
          
          # 打包成 IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa
          echo "✅ IPA 打包完成"
          ls -la *.ipa *.tipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
          retention-days: 30
