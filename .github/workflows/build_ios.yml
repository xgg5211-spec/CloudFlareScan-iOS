name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install aiohttp
          pip install pyinstaller

      - name: Create Python App
        run: |
          cat > main.py << 'EOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-

          import asyncio
          import aiohttp
          import socket
          import time
          import ipaddress
          import json
          import csv
          from datetime import datetime
          import sys
          import os

          # 颜色
          GREEN = '\033[92m'
          BLUE = '\033[94m'
          YELLOW = '\033[93m'
          RED = '\033[91m'
          PURPLE = '\033[95m'
          CYAN = '\033[96m'
          RESET = '\033[0m'

          # CloudFlare IP段
          CF_RANGES = [
              "173.245.48.0/20", "103.21.244.0/22", "103.22.200.0/22",
              "103.31.4.0/22", "141.101.64.0/18", "108.162.192.0/18",
              "190.93.240.0/20", "188.114.96.0/20", "197.234.240.0/22",
              "198.41.128.0/17", "162.158.0.0/15", "104.16.0.0/13",
              "104.24.0.0/14", "172.64.0.0/14", "131.0.72.0/22"
          ]

          PORTS = [443, 2053, 2083, 2087, 2096, 8443]
          TIMEOUT = 3
          CONCURRENT = 200

          class IPInfo:
              def __init__(self, ip, port, delay, country, colo, isp):
                  self.ip = ip
                  self.port = port
                  self.delay = delay
                  self.country = country
                  self.colo = colo
                  self.isp = isp
                  self.is_available = delay > 0

          def generate_ips():
              ips = []
              for cidr in CF_RANGES:
                  try:
                      network = ipaddress.ip_network(cidr, strict=False)
                      count = 0
                      for ip in network.hosts():
                          if count >= 200:
                              break
                          ips.append(str(ip))
                          count += 1
                  except:
                      pass
              return ips

          async def test_ip(session, ip, port):
              url = f"https://{ip}:{port}/cdn-cgi/trace"
              start = time.time()
              try:
                  async with session.get(url, timeout=TIMEOUT, ssl=False) as resp:
                      if resp.status == 200:
                          delay = (time.time() - start) * 1000
                          return delay
              except:
                  pass
              return -1

          async def get_location(session, ip):
              try:
                  url = f"http://ip-api.com/json/{ip}?fields=status,country,isp"
                  async with session.get(url, timeout=5) as resp:
                      if resp.status == 200:
                          data = await resp.json()
                          if data.get('status') == 'success':
                              return data.get('country', ''), data.get('isp', '')
              except:
                  pass
              return '', ''

          async def get_colo(session, ip):
              try:
                  url = f"https://{ip}/cdn-cgi/trace"
                  async with session.get(url, timeout=3, ssl=False) as resp:
                      if resp.status == 200:
                          text = await resp.text()
                          for line in text.split('\n'):
                              if line.startswith('colo='):
                                  return line.replace('colo=', '').strip()
              except:
                  pass
              return ''

          async def scan_single(semaphore, session, ip, port):
              async with semaphore:
                  delay = await test_ip(session, ip, port)
                  if delay > 0:
                      country, isp = await get_location(session, ip)
                      colo = await get_colo(session, ip)
                      return IPInfo(ip, port, delay, country, colo, isp)
                  return None

          async def scan_all(ips, ports):
              results = []
              semaphore = asyncio.Semaphore(CONCURRENT)
              connector = aiohttp.TCPConnector(limit=0, ssl=False)

              async with aiohttp.ClientSession(connector=connector) as session:
                  tasks = []
                  for ip in ips:
                      for port in ports:
                          tasks.append(scan_single(semaphore, session, ip, port))

                  for task in asyncio.as_completed(tasks):
                      result = await task
                      if result:
                          results.append(result)

              return sorted(results, key=lambda x: x.delay)

          def print_header():
              print(f"\n{CYAN}{'='*70}{RESET}")
              print(f"{CYAN}🚀 CloudFlare 优选IP扫描器 v3.0{RESET}")
              print(f"{CYAN}{'='*70}{RESET}")
              print(f"📡 扫描时间: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}")
              print(f"🔌 并发数: {CONCURRENT}")
              print(f"⏱️  超时: {TIMEOUT}秒")
              print(f"{CYAN}{'='*70}{RESET}\n")

          def print_results(results, top_n=30):
              if not results:
                  print(f"{RED}❌ 未找到可用IP{RESET}")
                  return

              print(f"\n{GREEN}📋 可用IP列表 (共 {len(results)} 个){RESET}")
              print(f"{'='*80}")
              print(f"{'排名':<6} {'IP地址':<18} {'端口':<8} {'延迟(ms)':<12} {'地区':<12} {'数据中心':<8}")
              print(f"{'-'*80}")

              for i, r in enumerate(results[:top_n], 1):
                  delay_color = GREEN if r.delay < 50 else (YELLOW if r.delay < 100 else RED)
                  country = r.country[:10] if len(r.country) > 10 else r.country
                  print(f"{i:<6} {r.ip:<18} {r.port:<8} {delay_color}{r.delay:<12.2f}{RESET} {country:<12} {r.colo:<8}")

              print(f"{'='*80}")
              print(f"✅ 可用IP: {len(results)} 个")
              if results:
                  print(f"🏆 最佳延迟: {GREEN}{results[0].delay:.2f}ms{RESET}")
                  avg = sum(r.delay for r in results) / len(results)
                  print(f"📈 平均延迟: {BLUE}{avg:.2f}ms{RESET}")
              print(f"{'='*80}\n")

          def export_ips(results, filename):
              with open(filename, 'w') as f:
                  for r in results:
                      f.write(f"{r.ip}:{r.port}\n")
              print(f"📁 已导出 {len(results)} 个IP到: {filename}")

          def export_csv(results, filename):
              with open(filename, 'w', newline='', encoding='utf-8') as f:
                  writer = csv.writer(f)
                  writer.writerow(['IP地址', '端口', '延迟(ms)', '地区', '运营商', '数据中心'])
                  for r in results:
                      writer.writerow([r.ip, r.port, f"{r.delay:.2f}", r.country, r.isp, r.colo])
              print(f"📁 已导出CSV到: {filename}")

          def export_config(results, filename):
              with open(filename, 'w') as f:
                  f.write("# CloudFlare 优选IP列表\n")
                  f.write(f"# 更新时间: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n")
                  f.write(f"# 可用IP: {len(results)} 个\n\n")
                  for r in results[:20]:
                      f.write(f"{r.ip}:{r.port}  # {r.delay:.0f}ms {r.country} {r.colo}\n")
              print(f"📁 已导出配置到: {filename}")

          def copy_to_clipboard(results, count=10):
              text = "\n".join([f"{r.ip}:{r.port}" for r in results[:count]])
              if sys.platform == 'darwin':
                  os.system(f"echo '{text}' | pbcopy")
              elif sys.platform == 'win32':
                  os.system(f"echo {text} | clip")
              else:
                  os.system(f"echo '{text}' | xclip -selection clipboard 2>/dev/null || echo '{text}'")
              print(f"✅ 已复制前 {count} 个IP到剪贴板")

          async def main():
              print_header()

              # 检测运营商
              try:
                  async with aiohttp.ClientSession() as session:
                      async with session.get("http://ip-api.com/json/?fields=isp,country,query") as resp:
                          if resp.status == 200:
                              data = await resp.json()
                              print(f"📶 运营商: {BLUE}{data.get('isp', 'Unknown')}{RESET}")
                              print(f"📍 地区: {BLUE}{data.get('country', 'Unknown')}{RESET}")
                              print(f"🆔 本机IP: {BLUE}{data.get('query', 'Unknown')}{RESET}")
              except:
                  print("📶 运营商: 检测失败")

              print(f"\n⏳ 生成IP列表...")
              ips = generate_ips()
              print(f"✅ 生成 {len(ips)} 个IP")

              port = 443
              print(f"🔌 使用端口: {port}")
              print(f"⏳ 开始扫描...\n")

              start_time = time.time()
              results = await scan_all(ips, [port])
              elapsed = time.time() - start_time

              print(f"⏱️  扫描耗时: {elapsed:.2f} 秒")
              print_results(results)

              if results:
                  export_ips(results, "cf_ips.txt")
                  export_csv(results, "cf_ips.csv")
                  export_config(results, "cf_config.txt")
                  copy_to_clipboard(results, 10)

                  print(f"\n{GREEN}🎯 推荐使用的优选IP (前10个):{RESET}")
                  for i, r in enumerate(results[:10], 1):
                      print(f"  {i}. {r.ip}:{r.port}  ({r.delay:.0f}ms) {r.country} {r.colo}")

          if __name__ == "__main__":
              try:
                  asyncio.run(main())
              except KeyboardInterrupt:
                  print(f"\n{RED}⏹ 已停止{RESET}")
              except Exception as e:
                  print(f"{RED}❌ 错误: {e}{RESET}")
          EOF

      - name: Build executable
        run: |
          pyinstaller --onefile --name CloudFlareScan main.py

      - name: Create IPA structure
        run: |
          mkdir -p Payload
          mkdir -p Payload/CloudFlareScan.app
          cp dist/CloudFlareScan Payload/CloudFlareScan.app/
          
          cat > Payload/CloudFlareScan.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>CloudFlareScan</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP筛选</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Package IPA
        run: |
          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa
          ls -la *.ipa *.tipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
          retention-days: 30
