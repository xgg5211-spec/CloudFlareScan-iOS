name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create Project
        run: |
          mkdir -p CloudFlareScan
          mkdir -p CloudFlareScan.xcodeproj
          mkdir -p CloudFlareScan/Assets.xcassets/AppIcon.appiconset

          cat > CloudFlareScan/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP筛选</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          cat > CloudFlareScan/AppDelegate.swift << 'EOF'
          import UIKit
          import SwiftUI

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = UIHostingController(rootView: ContentView())
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          cat > CloudFlareScan/ContentView.swift << 'EOF'
          import SwiftUI

          struct IPInfo: Identifiable {
              let id = UUID()
              var ip: String = ""
              var port: Int = 443
              var delay: Double = -1
              var country: String = ""
              var isp: String = ""
              var colo: String = ""
              var isAvailable: Bool = false
          }

          class ScanManager: ObservableObject {
              @Published var ipList: [IPInfo] = []
              @Published var results: [IPInfo] = []
              @Published var isScanning = false
              @Published var log: String = "就绪"
              @Published var availableCount = 0
              @Published var bestDelay: Double = 0

              private var task: Task<Void, Never>?
              private let semaphore = DispatchSemaphore(value: 100)

              func importIPs(_ text: String) {
                  var list: [IPInfo] = []
                  for line in text.split(separator: "\n") {
                      let s = String(line).trimmingCharacters(in: .whitespaces)
                      if s.isEmpty { continue }
                      let parts = s.split(separator: ":")
                      let ip = String(parts[0])
                      let port = parts.count > 1 ? Int(parts[1]) ?? 443 : 443
                      if ip.contains(".") || ip.contains(":") {
                          list.append(IPInfo(ip: ip, port: port))
                      }
                  }
                  self.ipList = list
                  self.results = []
                  self.log = "已导入 \(list.count) 个IP"
              }

              func startScan(ports: [Int], timeout: Int) {
                  guard !ipList.isEmpty else { return }
                  isScanning = true
                  results = []
                  availableCount = 0
                  bestDelay = 0
                  log = "扫描中..."

                  let ips = ipList
                  var allResults: [IPInfo] = []
                  let lock = NSLock()

                  task = Task.detached {
                      let semaphore = self.semaphore

                      await withTaskGroup(of: [IPInfo].self) { group in
                          for ip in ips {
                              for port in ports {
                                  group.addTask {
                                      semaphore.wait()
                                      defer { semaphore.signal() }
                                      return await self.checkIP(ip: ip, port: port, timeout: timeout)
                                  }
                              }
                          }

                          for await batch in group {
                              lock.lock()
                              allResults.append(contentsOf: batch)
                              lock.unlock()

                              await MainActor.run {
                                  let available = allResults.filter { $0.isAvailable }
                                  self.results = available
                                  self.availableCount = available.count
                                  let delays = available.map { $0.delay }.filter { $0 > 0 }
                                  if !delays.isEmpty {
                                      self.bestDelay = delays.min() ?? 0
                                  }
                                  self.log = "已找到 \(self.availableCount) 个可用IP"
                              }
                          }
                      }

                      await MainActor.run {
                          self.isScanning = false
                          self.log = "扫描完成！共 \(self.availableCount) 个可用IP"
                      }
                  }
              }

              func stopScan() {
                  task?.cancel()
                  isScanning = false
                  log = "已停止"
              }

              private func checkIP(ip: IPInfo, port: Int, timeout: Int) async -> [IPInfo] {
                  let url = URL(string: "https://\(ip.ip):\(port)/cdn-cgi/trace")!
                  let start = Date()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = TimeInterval(timeout)
                  config.timeoutIntervalForResource = TimeInterval(timeout)

                  do {
                      let (data, response) = try await URLSession(configuration: config).data(from: url)
                      if let http = response as? HTTPURLResponse, http.statusCode == 200 {
                          let delay = Date().timeIntervalSince(start) * 1000
                          let text = String(data: data, encoding: .utf8) ?? ""
                          var colo = ""
                          for line in text.split(separator: "\n") {
                              if line.hasPrefix("colo=") {
                                  colo = String(line.dropFirst(5))
                                  break
                              }
                          }
                          var info = ip
                          info.port = port
                          info.delay = delay
                          info.colo = colo
                          info.isAvailable = true

                          // 获取地区
                          if let loc = await getLocation(ip: ip.ip) {
                              info.country = loc.country
                              info.isp = loc.isp
                          }
                          return [info]
                      }
                  } catch {}
                  return []
              }

              private func getLocation(ip: String) async -> (country: String, isp: String)? {
                  let url = URL(string: "http://ip-api.com/json/\(ip)?fields=status,country,isp")!
                  do {
                      let (data, _) = try await URLSession.shared.data(from: url)
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         json["status"] as? String == "success" {
                          return (json["country"] as? String ?? "", json["isp"] as? String ?? "")
                      }
                  } catch {}
                  return nil
              }

              func copyResult() {
                  let text = results.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }

              func copyDetail() {
                  let text = results.map { "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms] \($0.country) \($0.colo)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }
          }

          struct ContentView: View {
              @StateObject private var manager = ScanManager()
              @State private var inputText: String = ""
              @State private var portText: String = "443,2053,8443"
              @State private var timeoutText: String = "3"
              @State private var showPaste = false
              @State private var alertMsg = ""

              var body: some View {
                  ZStack {
                      Color(red: 0.06, green: 0.08, blue: 0.15).ignoresSafeArea()

                      VStack(spacing: 0) {
                          // 标题
                          HStack {
                              Text("🚀 优选IP筛选")
                                  .font(.title2)
                                  .fontWeight(.bold)
                                  .foregroundColor(.white)
                              Spacer()
                              if manager.isScanning {
                                  ProgressView().scaleEffect(0.7)
                              }
                              Text("\(manager.availableCount)")
                                  .font(.title3)
                                  .foregroundColor(.green)
                          }
                          .padding(.horizontal)
                          .padding(.top, 12)

                          // 状态栏
                          HStack(spacing: 16) {
                              VStack { Text("总数").font(.caption2).foregroundColor(.gray); Text("\(manager.ipList.count)").foregroundColor(.white) }
                              VStack { Text("可用").font(.caption2).foregroundColor(.gray); Text("\(manager.availableCount)").foregroundColor(.green) }
                              VStack { Text("最佳").font(.caption2).foregroundColor(.gray); Text(manager.bestDelay > 0 ? String(format: "%.0fms", manager.bestDelay) : "--").foregroundColor(.orange) }
                              Spacer()
                              Text(manager.log).font(.caption).foregroundColor(.gray)
                          }
                          .padding(.horizontal)
                          .padding(.vertical, 8)
                          .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                          .cornerRadius(8)
                          .padding(.horizontal)

                          // 输入区
                          ScrollView {
                              VStack(spacing: 12) {
                                  // 导入
                                  VStack(alignment: .leading) {
                                      Text("📂 导入IP").font(.headline).foregroundColor(.white)
                                      HStack {
                                          Button {
                                              showPaste = true
                                          } label: {
                                              Label("粘贴导入", systemImage: "doc.on.clipboard")
                                                  .font(.caption)
                                                  .padding(.horizontal, 12)
                                                  .padding(.vertical, 6)
                                                  .background(Color.blue.opacity(0.2))
                                                  .foregroundColor(.blue)
                                                  .cornerRadius(6)
                                          }
                                          .sheet(isPresented: $showPaste) {
                                              PasteView(manager: manager)
                                          }

                                          if !manager.ipList.isEmpty {
                                              Text("已导入 \(manager.ipList.count) 个")
                                                  .font(.caption)
                                                  .foregroundColor(.green)
                                          }
                                          Spacer()
                                      }
                                  }
                                  .padding(12)
                                  .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                                  .cornerRadius(10)
                                  .padding(.horizontal)

                                  // 设置
                                  VStack(alignment: .leading, spacing: 8) {
                                      Text("⚙️ 设置").font(.headline).foregroundColor(.white)
                                      HStack {
                                          Text("端口").font(.caption).foregroundColor(.gray)
                                          TextField("443,2053,8443", text: $portText)
                                              .textFieldStyle(PlainTextFieldStyle())
                                              .font(.caption)
                                              .foregroundColor(.white)
                                              .frame(width: 120)
                                              .padding(.horizontal, 6)
                                              .padding(.vertical, 3)
                                              .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                              .cornerRadius(4)

                                          Spacer()

                                          Text("超时").font(.caption).foregroundColor(.gray)
                                          TextField("3", text: $timeoutText)
                                              .textFieldStyle(PlainTextFieldStyle())
                                              .font(.caption)
                                              .foregroundColor(.white)
                                              .frame(width: 40)
                                              .padding(.horizontal, 6)
                                              .padding(.vertical, 3)
                                              .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                              .cornerRadius(4)
                                          Text("秒").font(.caption).foregroundColor(.gray)
                                      }
                                  }
                                  .padding(12)
                                  .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                                  .cornerRadius(10)
                                  .padding(.horizontal)

                                  // 操作按钮
                                  HStack(spacing: 12) {
                                      Button {
                                          let ports = portText.split(separator: ",").compactMap { Int($0.trimmingCharacters(in: .whitespaces)) }
                                          let timeout = Int(timeoutText) ?? 3
                                          manager.startScan(ports: ports, timeout: timeout)
                                      } label: {
                                          Label(manager.isScanning ? "扫描中" : "开始扫描", systemImage: "play.fill")
                                              .frame(maxWidth: .infinity)
                                              .padding(.vertical, 8)
                                              .background(Color.blue)
                                              .foregroundColor(.white)
                                              .cornerRadius(8)
                                      }
                                      .disabled(manager.isScanning || manager.ipList.isEmpty)

                                      Button {
                                          manager.stopScan()
                                      } label: {
                                          Label("停止", systemImage: "stop.fill")
                                              .frame(maxWidth: .infinity)
                                              .padding(.vertical, 8)
                                              .background(Color.red)
                                              .foregroundColor(.white)
                                              .cornerRadius(8)
                                      }
                                      .disabled(!manager.isScanning)
                                  }
                                  .padding(.horizontal)

                                  // 结果列表
                                  VStack(alignment: .leading) {
                                      HStack {
                                          Text("📋 可用IP (\(manager.results.count))").font(.headline).foregroundColor(.white)
                                          Spacer()
                                          if !manager.results.isEmpty {
                                              Button("复制") {
                                                  manager.copyResult()
                                                  alertMsg = "已复制"
                                              }
                                              .font(.caption)
                                              .foregroundColor(.blue)
                                              .padding(.horizontal, 8)
                                              .padding(.vertical, 2)
                                              .background(Color.blue.opacity(0.15))
                                              .cornerRadius(4)

                                              Button("详情") {
                                                  manager.copyDetail()
                                                  alertMsg = "已复制详情"
                                              }
                                              .font(.caption)
                                              .foregroundColor(.green)
                                              .padding(.horizontal, 8)
                                              .padding(.vertical, 2)
                                              .background(Color.green.opacity(0.15))
                                              .cornerRadius(4)
                                          }
                                      }

                                      if manager.results.isEmpty {
                                          Text("暂无数据，请导入IP并开始扫描")
                                              .font(.caption)
                                              .foregroundColor(.gray)
                                              .frame(maxWidth: .infinity, alignment: .center)
                                              .padding(.vertical, 20)
                                      } else {
                                          ScrollView {
                                              LazyVStack(alignment: .leading, spacing: 2) {
                                                  ForEach(manager.results) { ip in
                                                      HStack {
                                                          Text(ip.ip).font(.system(.caption, design: .monospaced)).foregroundColor(.white)
                                                          Text(":\(ip.port)").font(.caption2).foregroundColor(.gray)
                                                          Spacer()
                                                          Text("\(String(format: "%.0f", ip.delay))ms").font(.caption).foregroundColor(ip.delay < 50 ? .green : ip.delay < 100 ? .orange : .red)
                                                          if !ip.colo.isEmpty { Text(ip.colo).font(.caption2).foregroundColor(.blue) }
                                                          if !ip.country.isEmpty { Text(ip.country).font(.caption2).foregroundColor(.gray) }
                                                      }
                                                      .padding(.vertical, 2)
                                                      .padding(.horizontal, 6)
                                                      .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                                      .cornerRadius(4)
                                                  }
                                              }
                                          }
                                          .frame(maxHeight: 200)
                                      }
                                  }
                                  .padding(12)
                                  .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                                  .cornerRadius(10)
                                  .padding(.horizontal)

                                  Spacer(minLength: 20)
                              }
                          }
                      }
                  }
                  .alert(alertMsg, isPresented: .constant(!alertMsg.isEmpty)) {
                      Button("确定") { alertMsg = "" }
                  }
              }
          }

          struct PasteView: View {
              @ObservedObject var manager: ScanManager
              @Environment(\.dismiss) var dismiss
              @State private var text: String = ""

              var body: some View {
                  ZStack {
                      Color(red: 0.06, green: 0.08, blue: 0.15).ignoresSafeArea()
                      VStack {
                          Text("📋 粘贴IP列表").font(.headline).foregroundColor(.white).padding(.top)
                          Text("每行一个IP，支持 1.1.1.1 或 1.1.1.1:443").font(.caption).foregroundColor(.gray)
                          TextEditor(text: $text)
                              .font(.system(.body, design: .monospaced))
                              .foregroundColor(.white)
                              .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                              .cornerRadius(8)
                              .padding()
                              .frame(maxHeight: .infinity)

                          HStack(spacing: 16) {
                              Button("取消") { dismiss() }.buttonStyle(.bordered)
                              Button("导入") {
                                  manager.importIPs(text)
                                  dismiss()
                              }.buttonStyle(.borderedProminent).disabled(text.isEmpty)
                          }
                          .padding(.bottom)
                      }
                      .padding()
                  }
                  .presentationDetents([.large])
              }
          }
          EOF

          cat > CloudFlareScan/Assets.xcassets/Contents.json << 'EOF'
          {"info":{"author":"xcode","version":1}}
          EOF
          cat > CloudFlareScan/Assets.xcassets/AppIcon.appiconset/Contents.json << 'EOF'
          {"images":[{"idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          EOF

          cat > CloudFlareScan.xcodeproj/project.pbxproj << 'EOF'
          // !$*UTF8*$!
          {
              archiveVersion = 1;
              classes = {};
              objectVersion = 56;
              objects = {
                  D100000001 /* AppDelegate.swift in Sources */ = {isa = PBXBuildFile; fileRef = D100000002 /* AppDelegate.swift */; };
                  D100000003 /* ContentView.swift in Sources */ = {isa = PBXBuildFile; fileRef = D100000004 /* ContentView.swift */; };
                  D100000005 /* Assets.xcassets in Resources */ = {isa = PBXBuildFile; fileRef = D100000006 /* Assets.xcassets */; };
                  D100000002 /* AppDelegate.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = AppDelegate.swift; sourceTree = "<group>"; };
                  D100000004 /* ContentView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ContentView.swift; sourceTree = "<group>"; };
                  D100000006 /* Assets.xcassets */ = {isa = PBXFileReference; lastKnownFileType = folder.assetcatalog; path = Assets.xcassets; sourceTree = "<group>"; };
                  D100000007 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
                  D100000008 /* CloudFlareScan.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = CloudFlareScan.app; sourceTree = BUILT_PRODUCTS_DIR; };
                  D100000009 = {isa = PBXGroup; children = (D100000010, D100000011,); sourceTree = "<group>"; };
                  D100000010 /* CloudFlareScan */ = {isa = PBXGroup; children = (D100000002, D100000004, D100000006, D100000007,); path = CloudFlareScan; sourceTree = "<group>"; };
                  D100000011 /* Products */ = {isa = PBXGroup; children = (D100000008,); name = Products; sourceTree = "<group>"; };
                  D100000012 /* CloudFlareScan */ = {isa = PBXNativeTarget; buildConfigurationList = D100000013; buildPhases = (D100000014, D100000015,); buildRules = (); dependencies = (); name = CloudFlareScan; productName = CloudFlareScan; productReference = D100000008; productType = "com.apple.product-type.application"; };
                  D100000016 /* Project object */ = {isa = PBXProject; attributes = {LastSwiftUpdateCheck = 1500; LastUpgradeCheck = 1500; TargetAttributes = {D100000012 = {CreatedOnToolsVersion = 15.0;};};}; buildConfigurationList = D100000017; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base,); mainGroup = D100000009; productRefGroup = D100000011; projectDirPath = ""; projectRoot = ""; targets = (D100000012,); };
                  D100000015 /* Resources */ = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (D100000005,); runOnlyForDeploymentPostprocessing = 0; };
                  D100000014 /* Sources */ = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (D100000001, D100000003,); runOnlyForDeploymentPostprocessing = 0; };
                  D100000018 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 15.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Debug; };
                  D100000019 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 15.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Release; };
                  D100000020 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGN_STYLE = Manual; CURRENT_PROJECT_VERSION = 1; DEVELOPMENT_TEAM = ""; INFOPLIST_FILE = CloudFlareScan/Info.plist; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.cloudflarescan.ios; PRODUCT_NAME = CloudFlareScan; SWIFT_VERSION = 5.0; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Debug; };
                  D100000021 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGN_STYLE = Manual; CURRENT_PROJECT_VERSION = 1; DEVELOPMENT_TEAM = ""; INFOPLIST_FILE = CloudFlareScan/Info.plist; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.cloudflarescan.ios; PRODUCT_NAME = CloudFlareScan; SWIFT_VERSION = 5.0; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Release; };
                  D100000013 = {isa = XCConfigurationList; buildConfigurations = (D100000020, D100000021,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
                  D100000017 = {isa = XCConfigurationList; buildConfigurations = (D100000018, D100000019,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
              };
              rootObject = D100000016;
          }
          EOF

      - name: Build
        run: |
          xcodebuild -project CloudFlareScan.xcodeproj \
            -scheme CloudFlareScan \
            -configuration Release \
            -derivedDataPath build \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -1)
          fi
          echo "找到: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
          retention-days: 30
