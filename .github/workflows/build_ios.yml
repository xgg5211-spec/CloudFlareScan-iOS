    @Published var searchText = ""
    @Published var filterLocation = ""
    @Published var filterColo = ""
    @Published var minDelayFilter: Double = 0
    @Published var maxDelayFilter: Double = 1000
    
    private var scanTask: Task<Void, Never>?
    private var allResults: [IPDetailInfo] = []
    private let resultQueue = DispatchQueue(label: "com.cfscan.result", qos: .userInitiated)
    private var startTime: Date?
    private var processedCount = 0
    
    // 并发控制 - 优化后支持更高并发
    private let semaphore = DispatchSemaphore(value: 500)
    private let batchSize = 200
    
    // 缓存
    private var locationCache: [String: LocationInfo] = [:]
    private let cacheLock = NSLock()
    
    private let cfRanges = [
        "173.245.48.0/20", "103.21.244.0/22", "103.22.200.0/22",
        "103.31.4.0/22", "141.101.64.0/18", "108.162.192.0/18",
        "190.93.240.0/20", "188.114.96.0/20", "197.234.240.0/22",
        "198.41.128.0/17", "162.158.0.0/15", "104.16.0.0/13",
        "104.24.0.0/14", "172.64.0.0/14", "131.0.72.0/22"
    ]
    
    private let testPorts = [443, 2053, 2083, 2087, 2096, 8443]
