name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install macOS System Dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config cmake ldid

      - name: Install Kivy-iOS and Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0.0"
          pip install kivy-ios

      - name: Restore Kivy-iOS Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kivy-ios
            build
            dist
          key: ${{ runner.os }}-kivy-ios-v9-${{ hashFiles('**/main.py') }}
          restore-keys: |
            ${{ runner.os }}-kivy-ios-v9-

      - name: Build Kivy-iOS Recipes
        run: |
          toolchain build python3 kivy openssl

      - name: Purge Demo Files & Create Xcode Project
        run: |
          # 关键修复：直接删除 Kivy 默认打包入内的数万个示例、测试和文档文件，防止复制超时
          rm -rf dist/root/python3/share/kivy-examples
          rm -rf dist/root/python3/share/doc
          find dist/root/python3 -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find dist/root/python3 -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true

          # 清理历史 Xcode 工程并重新生成
          rm -rf cloudflarescan-ios
          toolchain create "cloudflarescan" .

      - name: Build Xcode Project
        run: |
          cd cloudflarescan-ios
          xcodebuild -project cloudflarescan.xcodeproj \
            -scheme cloudflarescan \
            -configuration Release \
            -sdk iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -R cloudflarescan-ios/build/Release-iphoneos/*.app Payload/
          APP_NAME=$(ls Payload/)
          ldid -S "Payload/$APP_NAME/cloudflarescan" || ldid -S "Payload/$APP_NAME/${APP_NAME%.app}"
          zip -r CloudflareScan-iOS-TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-iOS-TrollStore
          path: CloudflareScan-iOS-TrollStore.ipa
          retention-days: 7
