name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
    inputs:
      custom_ips:
        description: '自定义IP列表（每行一个，留空则自动生成）'
        required: false
        default: ''
        type: string
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create Complete Xcode Project
        run: |
          # 创建目录
          mkdir -p CloudFlareScan
          mkdir -p CloudFlareScan.xcodeproj
          mkdir -p CloudFlareScan/Assets.xcassets/AppIcon.appiconset
          mkdir -p CloudFlareScan/Assets.xcassets/AccentColor.colorset

          # ========== Info.plist ==========
          cat > CloudFlareScan/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>$(DEVELOPMENT_LANGUAGE)</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          # ========== AppDelegate.swift ==========
          cat > CloudFlareScan/AppDelegate.swift << 'EOF'
          import UIKit
          import SwiftUI

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = UIHostingController(rootView: ContentView())
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # ========== ContentView.swift（完整功能版） ==========
          cat > CloudFlareScan/ContentView.swift << 'EOF'
          import SwiftUI
          import Network

          // MARK: - 延迟类型
          enum DelayType: String, CaseIterable {
              case tcp = "TCP连接"
              case tls = "TLS握手"
              case http = "HTTP响应"
              case full = "完整链路"
          }

          // MARK: - IP信息模型
          struct IPInfo: Identifiable {
              let id = UUID()
              var ip: String
              var port: Int
              var delay: Double = -1
              var location: String = ""
              var country: String = ""
              var city: String = ""
              var isp: String = ""
              var colo: String = ""
              var asn: String = ""
              var ipVersion: String = "IPv4"
              var isAvailable: Bool = false

              var quality: String {
                  let d = delay
                  switch d {
                  case ..<30: return "🏆极速"
                  case ..<60: return "⭐优秀"
                  case ..<100: return "👍良好"
                  case ..<200: return "📶一般"
                  default: return "🐢较慢"
                  }
              }

              var qualityColor: Color {
                  let d = delay
                  switch d {
                  case ..<30: return .purple
                  case ..<60: return .green
                  case ..<100: return .blue
                  case ..<200: return .orange
                  default: return .red
                  }
              }
          }

          // MARK: - 网络管理器
          class NetworkManager: ObservableObject {
              @Published var ipList: [IPInfo] = []
              @Published var isScanning = false
              @Published var progress = 0.0
              @Published var scanLog = ""
              @Published var totalIPs = 0
              @Published var availableCount = 0
              @Published var avgDelay: Double = 0
              @Published var minDelay: Double = 0
              @Published var currentISP: String = "检测中..."
              @Published var currentIP: String = "检测中..."
              @Published var currentCountry: String = "检测中..."
              @Published var searchText: String = ""

              private var scanTask: Task<Void, Never>?

              private let cfRanges = [
                  "173.245.48.0/20", "103.21.244.0/22", "103.22.200.0/22",
                  "103.31.4.0/22", "141.101.64.0/18", "108.162.192.0/18",
                  "190.93.240.0/20", "188.114.96.0/20", "197.234.240.0/22",
                  "198.41.128.0/17", "162.158.0.0/15", "104.16.0.0/13",
                  "104.24.0.0/14", "172.64.0.0/14", "131.0.72.0/22"
              ]

              // MARK: - 检测运营商
              func detectISP() {
                  guard let url = URL(string: "http://ip-api.com/json/?fields=isp,country,query") else { return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data else { return }
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                          DispatchQueue.main.async {
                              self.currentISP = json["isp"] as? String ?? "Unknown"
                              self.currentIP = json["query"] as? String ?? "Unknown"
                              self.currentCountry = json["country"] as? String ?? "Unknown"
                          }
                      }
                  }.resume()
              }

              // MARK: - 生成IP列表
              private func generateIPs() -> [String] {
                  var ips: [String] = []
                  for cidr in cfRanges {
                      let parts = cidr.split(separator: "/")
                      guard parts.count == 2, let prefix = Int(parts[1]) else { continue }
                      let ipParts = parts[0].split(separator: ".")
                      guard ipParts.count == 4 else { continue }
                      let base = (UInt32(ipParts[0])! << 24) | (UInt32(ipParts[1])! << 16) | (UInt32(ipParts[2])! << 8) | UInt32(ipParts[3])!
                      let count = 1 << (32 - prefix)
                      for i in 1...min(count, 200) {
                          let addr = base + UInt32(i)
                          let ip = "\((addr >> 24) & 255).\((addr >> 16) & 255).\((addr >> 8) & 255).\(addr & 255)"
                          ips.append(ip)
                      }
                  }
                  return ips
              }

              // MARK: - 开始扫描
              func startScan(customIPs: [String] = [], port: Int = 443) {
                  isScanning = true
                  ipList = []
                  scanLog = ""
                  availableCount = 0
                  avgDelay = 0
                  minDelay = 0

                  let ips = customIPs.isEmpty ? generateIPs() : customIPs
                  totalIPs = ips.count

                  scanLog += "🌐 CF优选扫描器 v3.0\n"
                  scanLog += "📡 待测IP: \(ips.count) 个\n"
                  scanLog += "🔌 端口: \(port)\n"
                  scanLog += "📶 运营商: \(currentISP)\n"
                  scanLog += "📍 国家: \(currentCountry)\n"
                  scanLog += "⏳ 开始扫描...\n\n"

                  scanTask = Task.detached(priority: .high) { [weak self] in
                      guard let self = self else { return }

                      var results: [IPInfo] = []
                      let lock = NSLock()
                      var processed = 0
                      let total = ips.count

                      let semaphore = DispatchSemaphore(value: 50)

                      for ip in ips {
                          if Task.isCancelled { break }

                          semaphore.wait()

                          Task {
                              let result = await self.testIP(ip, port: port)

                              lock.lock()
                              if let r = result, r.isAvailable {
                                  results.append(r)
                              }
                              processed += 1
                              lock.unlock()

                              semaphore.signal()

                              await MainActor.run {
                                  let available = results.filter { $0.isAvailable }
                                  self.ipList = results.sorted { $0.delay < $1.delay }
                                  self.availableCount = available.count
                                  self.progress = Double(processed) / Double(total)

                                  let delays = available.map { $0.delay }.filter { $0 > 0 }
                                  if !delays.isEmpty {
                                      self.avgDelay = delays.reduce(0, +) / Double(delays.count)
                                      self.minDelay = delays.min() ?? 0
                                  }

                                  if processed % 10 == 0 || processed == total {
                                      self.scanLog += "✅ 已扫描: \(processed)/\(total)  可用: \(self.availableCount)\n"
                                  }
                              }
                          }
                      }

                      // 等待所有任务完成
                      while processed < total {
                          try? await Task.sleep(nanoseconds: 100_000_000)
                      }

                      await MainActor.run {
                          self.ipList = results.sorted { $0.delay < $1.delay }
                          self.isScanning = false
                          self.progress = 1.0
                          self.scanLog += "\n🎯 扫描完成！\n"
                          self.scanLog += "📊 可用IP: \(self.availableCount) 个\n"
                          self.scanLog += "🏆 最佳延迟: \(String(format: "%.0f", self.minDelay))ms\n"
                          self.scanLog += "📈 平均延迟: \(String(format: "%.0f", self.avgDelay))ms\n"
                      }
                  }
              }

              func stopScan() {
                  scanTask?.cancel()
                  isScanning = false
                  scanLog += "\n⏹️ 已停止扫描\n"
              }

              // MARK: - 测试单个IP
              private func testIP(_ ip: String, port: Int) async -> IPInfo? {
                  var info = IPInfo(ip: ip, port: port)

                  let result = await testHTTP(ip, port: port)
                  info.delay = result.delay
                  info.colo = result.colo ?? ""
                  info.isAvailable = result.delay > 0

                  if info.isAvailable {
                      let loc = await getLocation(ip)
                      info.country = loc.country
                      info.city = loc.city
                      info.isp = loc.isp
                      info.asn = loc.asn
                      info.location = "\(loc.country) \(loc.city)".trimmingCharacters(in: .whitespaces)
                  }

                  return info.isAvailable ? info : nil
              }

              // MARK: - HTTP测试
              private func testHTTP(_ ip: String, port: Int) async -> (delay: Double, colo: String?) {
                  let urlString = "https://\(ip):\(port)/cdn-cgi/trace"
                  guard let url = URL(string: urlString) else { return (-1, nil) }

                  let start = Date()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = 3
                  config.timeoutIntervalForResource = 3
                  let session = URLSession(configuration: config)

                  do {
                      let (data, response) = try await session.data(from: url)
                      if let httpResponse = response as? HTTPURLResponse, httpResponse.statusCode == 200 {
                          let delay = Date().timeIntervalSince(start) * 1000
                          let text = String(data: data, encoding: .utf8) ?? ""
                          var colo: String?
                          for line in text.split(separator: "\n") {
                              if line.hasPrefix("colo=") {
                                  colo = String(line.dropFirst(5))
                                  break
                              }
                          }
                          return (delay, colo)
                      }
                  } catch {
                      return (-1, nil)
                  }
                  return (-1, nil)
              }

              // MARK: - 获取位置信息
              private func getLocation(_ ip: String) async -> (country: String, city: String, isp: String, asn: String) {
                  let urlString = "http://ip-api.com/json/\(ip)?fields=status,country,city,isp,as"
                  guard let url = URL(string: urlString) else { return ("", "", "", "") }

                  do {
                      let (data, _) = try await URLSession.shared.data(from: url)
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         json["status"] as? String == "success" {
                          return (
                              json["country"] as? String ?? "",
                              json["city"] as? String ?? "",
                              json["isp"] as? String ?? "",
                              json["as"] as? String ?? ""
                          )
                      }
                  } catch {
                      return ("", "", "", "")
                  }
                  return ("", "", "", "")
              }

              // MARK: - 复制功能
              func copyBestIPs(_ count: Int = 10) {
                  let best = ipList.filter { $0.isAvailable }.prefix(count)
                  let text = best.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }

              func copyWithDetails() {
                  let best = ipList.filter { $0.isAvailable }.prefix(30)
                  var text = "# CloudFlare 优选IP列表\n"
                  text += "# 运营商: \(currentISP)\n"
                  text += "# 国家: \(currentCountry)\n\n"
                  for ip in best {
                      text += "\(ip.ip):\(ip.port)  [\(String(format: "%.0f", ip.delay))ms] \(ip.quality) \(ip.colo) \(ip.country)\n"
                  }
                  UIPasteboard.general.string = text
              }

              func copyAll() {
                  let text = ipList.filter { $0.isAvailable }.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }

              func copyCSV() {
                  var csv = "IP,端口,延迟(ms),质量,国家,城市,运营商,数据中心,ASN\n"
                  for ip in ipList.filter({ $0.isAvailable }) {
                      csv += "\(ip.ip),\(ip.port),\(String(format: "%.0f", ip.delay)),\(ip.quality),\(ip.country),\(ip.city),\(ip.isp),\(ip.colo),\(ip.asn)\n"
                  }
                  UIPasteboard.general.string = csv
              }
          }

          // MARK: - 主界面
          struct ContentView: View {
              @StateObject private var networkManager = NetworkManager()
              @State private var selectedPort = 443
              @State private var customIPInput = ""
              @State private var showingAlert = false
              @State private var alertMessage = ""

              let ports = [443, 2053, 2083, 2087, 2096, 8443]

              var body: some View {
                  NavigationView {
                      VStack(spacing: 0) {
                          // 运营商信息
                          HStack {
                              Image(systemName: "antenna.radiowaves.left.and.right")
                                  .foregroundColor(.blue)
                              Text("📶 \(networkManager.currentISP)")
                                  .font(.caption)
                                  .fontWeight(.medium)
                              Text("📍 \(networkManager.currentCountry)")
                                  .font(.caption)
                                  .foregroundColor(.secondary)
                              Spacer()
                              Text("🆔 \(networkManager.currentIP)")
                                  .font(.caption)
                                  .foregroundColor(.secondary)
                          }
                          .padding(.horizontal, 10)
                          .padding(.vertical, 4)
                          .background(Color(.systemGray6))

                          // 状态栏
                          HStack(spacing: 8) {
                              Circle()
                                  .fill(networkManager.isScanning ? Color.green : Color.gray)
                                  .frame(width: 8, height: 8)
                              Text(networkManager.isScanning ? "扫描中" : "就绪")
                                  .font(.caption2)
                              if networkManager.isScanning {
                                  ProgressView(value: networkManager.progress)
                                      .frame(width: 60)
                                      .scaleEffect(0.8)
                              }
                              Spacer()
                              if networkManager.avgDelay > 0 {
                                  Text("均\(String(format: "%.0f", networkManager.avgDelay))ms")
                                      .font(.caption2)
                                      .foregroundColor(.blue)
                              }
                              if networkManager.minDelay > 0 {
                                  Text("🏆\(String(format: "%.0f", networkManager.minDelay))ms")
                                      .font(.caption2)
                                      .foregroundColor(.green)
                              }
                              Text("\(networkManager.ipList.count)个")
                                  .font(.caption2)
                              if networkManager.availableCount > 0 {
                                  Text("✅\(networkManager.availableCount)")
                                      .font(.caption2)
                                      .foregroundColor(.green)
                              }
                          }
                          .padding(.horizontal, 10)
                          .padding(.vertical, 3)
                          .background(Color(.systemBackground))

                          // 控制区
                          VStack(spacing: 6) {
                              HStack(spacing: 6) {
                                  Picker("端口", selection: $selectedPort) {
                                      ForEach(ports, id: \.self) { port in
                                          Text("\(port)").tag(port)
                                      }
                                  }
                                  .pickerStyle(MenuPickerStyle())
                                  .frame(width: 80)
                                  .disabled(networkManager.isScanning)

                                  if networkManager.isScanning {
                                      Button("停止") {
                                          networkManager.stopScan()
                                      }
                                      .buttonStyle(.borderedProminent)
                                      .tint(.red)
                                  } else {
                                      Button("开始扫描") {
                                          let customIPs = customIPInput.split(separator: "\n").map { String($0).trimmingCharacters(in: .whitespaces) }.filter { !$0.isEmpty }
                                          networkManager.startScan(customIPs: customIPs, port: selectedPort)
                                      }
                                      .buttonStyle(.borderedProminent)
                                      .tint(.blue)
                                  }

                                  Menu {
                                      Button("复制前10个") {
                                          networkManager.copyBestIPs()
                                          alertMessage = "✅ 已复制"
                                          showingAlert = true
                                      }
                                      Button("复制详细信息") {
                                          networkManager.copyWithDetails()
                                          alertMessage = "✅ 已复制"
                                          showingAlert = true
                                      }
                                      Button("复制全部") {
                                          networkManager.copyAll()
                                          alertMessage = "✅ 已复制全部IP"
                                          showingAlert = true
                                      }
                                      Button("复制CSV") {
                                          networkManager.copyCSV()
                                          alertMessage = "✅ CSV已复制"
                                          showingAlert = true
                                      }
                                  } label: {
                                      Image(systemName: "doc.on.doc")
                                          .font(.title2)
                                  }
                                  .disabled(networkManager.isScanning)
                              }

                              // 自定义IP
                              VStack(alignment: .leading, spacing: 2) {
                                  HStack {
                                      Image(systemName: "plus.circle")
                                          .font(.caption)
                                          .foregroundColor(.blue)
                                      Text("自定义IP（每行一个）")
                                          .font(.caption2)
                                          .foregroundColor(.secondary)
                                      Spacer()
                                      let count = customIPInput.split(separator: "\n").count
                                      if count > 0 {
                                          Text("\(count)个")
                                              .font(.caption2)
                                              .foregroundColor(.blue)
                                      }
                                      if !customIPInput.isEmpty {
                                          Button("清空") { customIPInput = "" }
                                              .font(.caption2)
                                              .foregroundColor(.red)
                                      }
                                  }
                                  TextEditor(text: $customIPInput)
                                      .frame(minHeight: 30, maxHeight: 50)
                                      .font(.system(.caption2, design: .monospaced))
                                      .background(Color(.systemGray6))
                                      .cornerRadius(4)
                                      .disabled(networkManager.isScanning)
                              }
                              .padding(.horizontal, 2)
                          }
                          .padding(.horizontal, 8)
                          .padding(.vertical, 6)
                          .background(Color(.systemBackground))

                          // 搜索
                          HStack {
                              Image(systemName: "magnifyingglass")
                                  .font(.caption)
                                  .foregroundColor(.secondary)
                              TextField("搜索IP/国家/数据中心...", text: $networkManager.searchText)
                                  .textFieldStyle(PlainTextFieldStyle())
                                  .font(.caption)
                              if !networkManager.searchText.isEmpty {
                                  Button("清除") {
                                      networkManager.searchText = ""
                                      networkManager.objectWillChange.send()
                                  }
                                  .font(.caption)
                                  .foregroundColor(.red)
                              }
                          }
                          .padding(.horizontal, 10)
                          .padding(.vertical, 4)
                          .background(Color(.systemGray6))
                          .cornerRadius(6)
                          .padding(.horizontal, 8)
                          .padding(.vertical, 4)

                          // 结果列表
                          List(networkManager.ipList.filter { $0.isAvailable }) { ip in
                              VStack(alignment: .leading, spacing: 2) {
                                  HStack {
                                      Text(ip.ip)
                                          .font(.system(.subheadline, design: .monospaced))
                                          .fontWeight(.medium)
                                      Text(":\(ip.port)")
                                          .font(.caption)
                                          .foregroundColor(.secondary)
                                      Spacer()
                                      Text(ip.quality)
                                          .font(.caption2)
                                          .foregroundColor(ip.qualityColor)
                                  }
                                  HStack(spacing: 6) {
                                      Text("📍 \(ip.country)")
                                          .font(.caption2)
                                          .foregroundColor(.secondary)
                                      if !ip.colo.isEmpty {
                                          Text("🏢 \(ip.colo)")
                                              .font(.caption2)
                                              .foregroundColor(.blue)
                                      }
                                      if !ip.isp.isEmpty {
                                          Text("📶 \(ip.isp)")
                                              .font(.caption2)
                                              .foregroundColor(.secondary)
                                      }
                                      Spacer()
                                      Text("\(String(format: "%.0f", ip.delay))ms")
                                          .font(.caption)
                                          .fontWeight(.bold)
                                          .foregroundColor(ip.qualityColor)
                                  }
                              }
                              .padding(.vertical, 2)
                          }
                          .listStyle(.inset)

                          // 日志
                          ScrollView {
                              Text(networkManager.scanLog)
                                  .font(.system(.caption2, design: .monospaced))
                                  .foregroundColor(.gray)
                                  .frame(maxWidth: .infinity, alignment: .leading)
                                  .padding(.horizontal, 8)
                                  .padding(.vertical, 4)
                          }
                          .frame(height: 70)
                          .background(Color(.systemGray6))
                      }
                      .navigationTitle("🌐 CF优选扫描")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  networkManager.scanLog = ""
                              } label: {
                                  Image(systemName: "trash")
                              }
                              .disabled(networkManager.scanLog.isEmpty)
                          }
                      }
                      .alert("提示", isPresented: $showingAlert) {
                          Button("确定") {}
                      } message: {
                          Text(alertMessage)
                      }
                      .onAppear {
                          networkManager.detectISP()
                      }
                  }
              }
          }
          EOF

          # ========== Assets ==========
          cat > CloudFlareScan/Assets.xcassets/Contents.json << 'EOF'
          {"info":{"author":"xcode","version":1}}
          EOF
          cat > CloudFlareScan/Assets.xcassets/AppIcon.appiconset/Contents.json << 'EOF'
          {"images":[{"idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          EOF
          cat > CloudFlareScan/Assets.xcassets/AccentColor.colorset/Contents.json << 'EOF'
          {"colors":[{"idiom":"universal"}],"info":{"author":"xcode","version":1}}
          EOF

          # ========== Xcode Project ==========
          cat > CloudFlareScan.xcodeproj/project.pbxproj << 'EOF'
          // !$*UTF8*$!
          {
              archiveVersion = 1;
              classes = {};
              objectVersion = 56;
              objects = {
                  /* Begin PBXBuildFile section */
                  A10000000001 /* AppDelegate.swift in Sources */ = {isa = PBXBuildFile; fileRef = A10000000002 /* AppDelegate.swift */; };
                  A10000000003 /* ContentView.swift in Sources */ = {isa = PBXBuildFile; fileRef = A10000000004 /* ContentView.swift */; };
                  A10000000005 /* Assets.xcassets in Resources */ = {isa = PBXBuildFile; fileRef = A10000000006 /* Assets.xcassets */; };
                  /* End PBXBuildFile section */

                  /* Begin PBXFileReference section */
                  A10000000002 /* AppDelegate.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = AppDelegate.swift; sourceTree = "<group>"; };
                  A10000000004 /* ContentView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ContentView.swift; sourceTree = "<group>"; };
                  A10000000006 /* Assets.xcassets */ = {isa = PBXFileReference; lastKnownFileType = folder.assetcatalog; path = Assets.xcassets; sourceTree = "<group>"; };
                  A10000000007 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
                  A10000000008 /* CloudFlareScan.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = CloudFlareScan.app; sourceTree = BUILT_PRODUCTS_DIR; };
                  /* End PBXFileReference section */

