name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create Project Files
        run: |
          mkdir -p CloudFlareScan
          mkdir -p CloudFlareScan.xcodeproj
          mkdir -p CloudFlareScan/Assets.xcassets/AppIcon.appiconset

          # Info.plist
          cat > CloudFlareScan/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP筛选</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          # AppDelegate.swift
          cat > CloudFlareScan/AppDelegate.swift << 'EOF'
          import UIKit
          import SwiftUI

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = UIHostingController(rootView: ContentView())
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # ContentView.swift
          cat > CloudFlareScan/ContentView.swift << 'EOF'
          import SwiftUI

          // MARK: - 数据模型
          struct IPInfo: Identifiable {
              let id = UUID()
              var ip: String
              var port: Int
              var delay: Double
              var country: String
              var isp: String
              var colo: String
              var isAvailable: Bool
          }

          // MARK: - 扫描管理器
          class ScanManager: ObservableObject {
              @Published var ipList: [IPInfo] = []
              @Published var results: [IPInfo] = []
              @Published var isScanning = false
              @Published var statusText = "就绪"
              @Published var availableCount = 0
              @Published var bestDelay: Double = 0
              @Published var avgDelay: Double = 0
              @Published var detectedISP: String = "检测中..."

              private var scanTask: Task<Void, Never>?
              private let semaphore = DispatchSemaphore(value: 150)

              // MARK: - 自动识别运营商
              func detectISP() {
                  guard let url = URL(string: "http://ip-api.com/json/?fields=isp") else { return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data else { return }
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         let isp = json["isp"] as? String {
                          DispatchQueue.main.async {
                              self.detectedISP = isp
                          }
                      }
                  }.resume()
              }

              // MARK: - 导入IP
              func importIPs(_ text: String) {
                  var list: [IPInfo] = []
                  let lines = text.split(separator: "\n").map { String($0).trimmingCharacters(in: .whitespaces) }
                  for line in lines {
                      if line.isEmpty { continue }
                      let parts = line.split(separator: ":")
                      let ip = String(parts[0])
                      let port = parts.count > 1 ? Int(parts[1]) ?? 443 : 443
                      if ip.contains(".") || ip.contains(":") {
                          list.append(IPInfo(ip: ip, port: port, delay: 0, country: "", isp: "", colo: "", isAvailable: false))
                      }
                  }
                  self.ipList = list
                  self.results = []
                  self.statusText = "已导入 \(list.count) 个IP"
              }

              // MARK: - 开始扫描
              func startScan(ports: [Int], timeout: Int) {
                  guard !ipList.isEmpty else {
                      self.statusText = "请先导入IP列表"
                      return
                  }

                  self.isScanning = true
                  self.results = []
                  self.availableCount = 0
                  self.bestDelay = 0
                  self.avgDelay = 0
                  self.statusText = "扫描中..."

                  let ips = self.ipList
                  var allResults: [IPInfo] = []
                  let lock = NSLock()
                  var processed = 0
                  let total = ips.count * ports.count

                  self.scanTask = Task.detached(priority: .high) {
                      let semaphore = self.semaphore

                      await withTaskGroup(of: [IPInfo].self) { group in
                          for ip in ips {
                              if Task.isCancelled { break }
                              for port in ports {
                                  if Task.isCancelled { break }
                                  group.addTask {
                                      semaphore.wait()
                                      defer { semaphore.signal() }
                                      return await self.checkIP(ip: ip, port: port, timeout: timeout)
                                  }
                              }
                          }

                          for await batch in group {
                              lock.lock()
                              allResults.append(contentsOf: batch)
                              processed += 1
                              lock.unlock()

                              await MainActor.run {
                                  let available = allResults.filter { $0.isAvailable }
                                  self.results = available
                                  self.availableCount = available.count
                                  let delays = available.map { $0.delay }.filter { $0 > 0 }
                                  if !delays.isEmpty {
                                      self.bestDelay = delays.min() ?? 0
                                      self.avgDelay = delays.reduce(0, +) / Double(delays.count)
                                  }
                                  self.statusText = "扫描中... 已找到 \(self.availableCount) 个"
                              }
                          }
                      }

                      await MainActor.run {
                          self.isScanning = false
                          let available = allResults.filter { $0.isAvailable }
                          self.results = available
                          self.availableCount = available.count
                          self.statusText = "✅ 扫描完成！共 \(self.availableCount) 个可用IP"
                      }
                  }
              }

              // MARK: - 停止扫描
              func stopScan() {
                  self.scanTask?.cancel()
                  self.isScanning = false
                  self.statusText = "⏹ 已停止"
              }

              // MARK: - 测试单个IP
              private func checkIP(ip: IPInfo, port: Int, timeout: Int) async -> [IPInfo] {
                  let urlString = "https://\(ip.ip):\(port)/cdn-cgi/trace"
                  guard let url = URL(string: urlString) else { return [] }

                  let start = Date()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = TimeInterval(timeout)
                  config.timeoutIntervalForResource = TimeInterval(timeout)
                  let session = URLSession(configuration: config)

                  do {
                      let (data, response) = try await session.data(from: url)
                      if let http = response as? HTTPURLResponse, http.statusCode == 200 {
                          let delay = Date().timeIntervalSince(start) * 1000
                          let text = String(data: data, encoding: .utf8) ?? ""

                          var colo = ""
                          for line in text.split(separator: "\n") {
                              if line.hasPrefix("colo=") {
                                  colo = String(line.dropFirst(5))
                                  break
                              }
                          }

                          var info = ip
                          info.port = port
                          info.delay = delay
                          info.colo = colo
                          info.isAvailable = true

                          // 获取位置信息
                          if let loc = await self.getLocation(ip: ip.ip) {
                              info.country = loc.country
                              info.isp = loc.isp
                          }

                          return [info]
                      }
                  } catch {
                      return []
                  }
                  return []
              }

              // MARK: - 获取位置
              private func getLocation(ip: String) async -> (country: String, isp: String)? {
                  let urlString = "http://ip-api.com/json/\(ip)?fields=status,country,isp"
                  guard let url = URL(string: urlString) else { return nil }

                  do {
                      let (data, _) = try await URLSession.shared.data(from: url)
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         json["status"] as? String == "success" {
                          let country = json["country"] as? String ?? ""
                          let isp = json["isp"] as? String ?? ""
                          return (country, isp)
                      }
                  } catch {
                      return nil
                  }
                  return nil
              }

              // MARK: - 复制功能
              func copyIPs() {
                  let text = self.results.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }

              func copyDetails() {
                  let text = self.results.map {
                      "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)"
                  }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }

              func copyAll() {
                  var text = "# 优选IP列表\n"
                  text += "# 运营商: \(self.detectedISP)\n"
                  text += "# 可用IP: \(self.availableCount)\n"
                  text += "# 最佳延迟: \(String(format: "%.0f", self.bestDelay))ms\n\n"
                  text += self.results.map {
                      "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)"
                  }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }

              // MARK: - 筛选
              func filterByCountry(_ keyword: String) -> [IPInfo] {
                  if keyword.isEmpty { return self.results }
                  return self.results.filter {
                      $0.country.localizedCaseInsensitiveContains(keyword)
                  }
              }

              func filterByPort(_ port: String) -> [IPInfo] {
                  if port.isEmpty { return self.results }
                  guard let p = Int(port) else { return self.results }
                  return self.results.filter { $0.port == p }
              }
          }

          // MARK: - 主视图
          struct ContentView: View {
              @StateObject private var manager = ScanManager()
              @State private var portText = "443,2053,8443"
              @State private var timeoutText = "3"
              @State private var showPasteSheet = false
              @State private var filterCountry = ""
              @State private var filterPort = ""
              @State private var alertMsg = ""

              var filteredResults: [IPInfo] {
                  var list = manager.results
                  if !filterCountry.isEmpty {
                      list = list.filter { $0.country.localizedCaseInsensitiveContains(filterCountry) }
                  }
                  if !filterPort.isEmpty, let p = Int(filterPort) {
                      list = list.filter { $0.port == p }
                  }
                  return list
              }

              var body: some View {
                  ZStack {
                      Color(red: 0.06, green: 0.08, blue: 0.15).ignoresSafeArea()

                      VStack(spacing: 0) {
                          // 标题栏
                          HStack {
                              Text("🚀 优选IP筛选工具")
                                  .font(.title2)
                                  .fontWeight(.bold)
                                  .foregroundColor(.white)
                              Spacer()
                              if manager.isScanning {
                                  ProgressView().scaleEffect(0.8)
                              }
                              Text("📍 \(manager.detectedISP)")
                                  .font(.caption)
                                  .foregroundColor(.blue)
                          }
                          .padding(.horizontal)
                          .padding(.top, 10)

                          // 统计栏
                          HStack(spacing: 12) {
                              StatView(label: "总数", value: "\(manager.ipList.count)", color: .gray)
                              StatView(label: "可用", value: "\(manager.availableCount)", color: .green)
                              StatView(label: "最佳", value: manager.bestDelay > 0 ? String(format: "%.0fms", manager.bestDelay) : "--", color: .orange)
                              StatView(label: "平均", value: manager.avgDelay > 0 ? String(format: "%.0fms", manager.avgDelay) : "--", color: .blue)
                              Spacer()
                              Text(manager.statusText)
                                  .font(.caption2)
                                  .foregroundColor(.gray)
                          }
                          .padding(.horizontal)
                          .padding(.vertical, 8)
                          .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                          .cornerRadius(8)
                          .padding(.horizontal)

                          ScrollView {
                              VStack(spacing: 12) {
                                  // 1. 导入
                                  VStack(alignment: .leading, spacing: 8) {
                                      Text("📂 导入IP").font(.headline).foregroundColor(.white)
                                      HStack {
                                          Button {
                                              showPasteSheet = true
                                          } label: {
                                              Label("粘贴导入", systemImage: "doc.on.clipboard")
                                                  .font(.caption)
                                                  .padding(.horizontal, 14)
                                                  .padding(.vertical, 8)
                                                  .background(Color.blue.opacity(0.2))
                                                  .foregroundColor(.blue)
                                                  .cornerRadius(6)
                                          }
                                          .sheet(isPresented: $showPasteSheet) {
                                              PasteSheet(manager: manager)
                                          }

                                          if !manager.ipList.isEmpty {
                                              Text("✅ 已导入 \(manager.ipList.count) 个")
                                                  .font(.caption)
                                                  .foregroundColor(.green)
                                          }
                                          Spacer()
                                      }
                                  }
                                  .padding(12)
                                  .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                                  .cornerRadius(10)
                                  .padding(.horizontal)

                                  // 2. 设置
                                  VStack(alignment: .leading, spacing: 8) {
                                      Text("⚙️ 扫描设置").font(.headline).foregroundColor(.white)
                                      HStack {
                                          Text("端口").font(.caption).foregroundColor(.gray)
                                          TextField("443,2053,8443", text: $portText)
                                              .textFieldStyle(PlainTextFieldStyle())
                                              .font(.caption)
                                              .foregroundColor(.white)
                                              .frame(width: 120)
                                              .padding(.horizontal, 8)
                                              .padding(.vertical, 4)
                                              .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                              .cornerRadius(4)

                                          Spacer()

                                          Text("超时").font(.caption).foregroundColor(.gray)
                                          TextField("3", text: $timeoutText)
                                              .textFieldStyle(PlainTextFieldStyle())
                                              .font(.caption)
                                              .foregroundColor(.white)
                                              .frame(width: 40)
                                              .padding(.horizontal, 8)
                                              .padding(.vertical, 4)
                                              .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                              .cornerRadius(4)
                                          Text("秒").font(.caption).foregroundColor(.gray)

                                          Spacer()

                                          Text("运营商: \(manager.detectedISP)")
                                              .font(.caption)
                                              .foregroundColor(.green)
                                      }
                                  }
                                  .padding(12)
                                  .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                                  .cornerRadius(10)
                                  .padding(.horizontal)

                                  // 3. 操作按钮
                                  HStack(spacing: 10) {
                                      Button {
                                          let ports = portText.split(separator: ",").compactMap { Int($0.trimmingCharacters(in: .whitespaces)) }
                                          let timeout = Int(timeoutText) ?? 3
                                          manager.startScan(ports: ports, timeout: timeout)
                                      } label: {
                                          Label(manager.isScanning ? "扫描中..." : "开始扫描", systemImage: "play.fill")
                                              .frame(maxWidth: .infinity)
                                              .padding(.vertical, 10)
                                              .background(manager.isScanning ? Color.gray : Color.blue)
                                              .foregroundColor(.white)
                                              .cornerRadius(8)
                                      }
                                      .disabled(manager.isScanning || manager.ipList.isEmpty)

                                      Button {
                                          manager.stopScan()
                                      } label: {
                                          Label("停止", systemImage: "stop.fill")
                                              .frame(maxWidth: .infinity)
                                              .padding(.vertical, 10)
                                              .background(Color.red)
                                              .foregroundColor(.white)
                                              .cornerRadius(8)
                                      }
                                      .disabled(!manager.isScanning)

                                      Menu {
                                          Button("复制IP") { manager.copyIPs(); alertMsg = "✅ 已复制IP" }
                                          Button("复制详情") { manager.copyDetails(); alertMsg = "✅ 已复制详情" }
                                          Button("复制完整报告") { manager.copyAll(); alertMsg = "✅ 已复制报告" }
                                      } label: {
                                          Label("复制", systemImage: "doc.on.doc")
                                              .frame(width: 60)
                                              .padding(.vertical, 10)
                                              .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                                              .foregroundColor(.blue)
                                              .cornerRadius(8)
                                      }
                                      .disabled(manager.results.isEmpty)
                                  }
                                  .padding(.horizontal)

                                  // 4. 筛选
                                  VStack(alignment: .leading, spacing: 6) {
                                      Text("🔍 筛选").font(.headline).foregroundColor(.white)
                                      HStack {
                                          Text("地区").font(.caption).foregroundColor(.gray)
                                          TextField("输入地区", text: $filterCountry)
                                              .textFieldStyle(PlainTextFieldStyle())
                                              .font(.caption)
                                              .foregroundColor(.white)
                                              .frame(width: 100)
                                              .padding(.horizontal, 8)
                                              .padding(.vertical, 4)
                                              .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                              .cornerRadius(4)

                                          Spacer()

                                          Text("端口").font(.caption).foregroundColor(.gray)
                                          TextField("输入端口", text: $filterPort)
                                              .textFieldStyle(PlainTextFieldStyle())
                                              .font(.caption)
                                              .foregroundColor(.white)
                                              .frame(width: 60)
                                              .padding(.horizontal, 8)
                                              .padding(.vertical, 4)
                                              .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                              .cornerRadius(4)

                                          Spacer()

                                          Text("显示 \(filteredResults.count) 个")
                                              .font(.caption)
                                              .foregroundColor(.blue)
                                      }
                                  }
                                  .padding(12)
                                  .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                                  .cornerRadius(10)
                                  .padding(.horizontal)

                                  // 5. 结果列表
                                  VStack(alignment: .leading, spacing: 6) {
                                      HStack {
                                          Text("📋 可用IP").font(.headline).foregroundColor(.white)
                                          Spacer()
                                          Text("共 \(filteredResults.count) 个")
                                              .font(.caption)
                                              .foregroundColor(.blue)
                                      }

                                      if filteredResults.isEmpty {
                                          Text(manager.isScanning ? "⏳ 扫描中，请稍候..." : "暂无数据，请导入IP并开始扫描")
                                              .font(.caption)
                                              .foregroundColor(.gray)
                                              .frame(maxWidth: .infinity, alignment: .center)
                                              .padding(.vertical, 30)
                                      } else {
                                          ScrollView {
                                              LazyVStack(alignment: .leading, spacing: 3) {
                                                  ForEach(filteredResults) { ip in
                                                      HStack {
                                                          Text(ip.ip)
                                                              .font(.system(.caption, design: .monospaced))
                                                              .foregroundColor(.white)
                                                          Text(":\(ip.port)")
                                                              .font(.caption2)
                                                              .foregroundColor(.gray)
                                                          Spacer()
                                                          Text("\(String(format: "%.0f", ip.delay))ms")
                                                              .font(.caption)
                                                              .fontWeight(.bold)
                                                              .foregroundColor(ip.delay < 50 ? .green : ip.delay < 100 ? .orange : .red)
                                                          if !ip.colo.isEmpty {
                                                              Text("🏢\(ip.colo)")
                                                                  .font(.caption2)
                                                                  .foregroundColor(.blue)
                                                          }
                                                          if !ip.country.isEmpty {
                                                              Text("📍\(ip.country)")
                                                                  .font(.caption2)
                                                                  .foregroundColor(.gray)
                                                          }
                                                      }
                                                      .padding(.vertical, 3)
                                                      .padding(.horizontal, 8)
                                                      .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                                      .cornerRadius(4)
                                                  }
                                              }
                                          }
                                          .frame(maxHeight: 200)
                                      }
                                  }
                                  .padding(12)
                                  .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                                  .cornerRadius(10)
                                  .padding(.horizontal)

                                  // 6. 输出
                                  VStack(alignment: .leading, spacing: 6) {
                                      Text("📝 输出文本").font(.headline).foregroundColor(.white)

                                      let outputText = filteredResults.map {
                                          "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)"
                                      }.joined(separator: "\n")

                                      TextEditor(text: .constant(outputText))
                                          .font(.system(.caption, design: .monospaced))
                                          .foregroundColor(.white)
                                          .frame(height: 80)
                                          .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                          .cornerRadius(6)

                                      HStack {
                                          Button {
                                              UIPasteboard.general.string = outputText
                                              alertMsg = "✅ 已复制"
                                          } label: {
                                              Label("复制", systemImage: "doc.on.doc")
                                                  .font(.caption)
                                                  .padding(.horizontal, 14)
                                                  .padding(.vertical, 6)
                                                  .background(Color.blue.opacity(0.2))
                                                  .foregroundColor(.blue)
                                                  .cornerRadius(6)
                                          }
                                          .disabled(filteredResults.isEmpty)

                                          Spacer()

                                          if !filteredResults.isEmpty {
                                              Text("\(filteredResults.count) 行")
                                                  .font(.caption2)
                                                  .foregroundColor(.gray)
                                          }
                                      }
                                  }
                                  .padding(12)
                                  .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                                  .cornerRadius(10)
                                  .padding(.horizontal)

                                  Spacer(minLength: 30)
                              }
                              .padding(.bottom, 20)
                          }
                      }
                  }
                  .alert(alertMsg, isPresented: .constant(!alertMsg.isEmpty)) {
                      Button("确定") { alertMsg = "" }
                  }
                  .onAppear {
                      manager.detectISP()
                  }
              }
          }

          // MARK: - 统计组件
          struct StatView: View {
              let label: String
              let value: String
              let color: Color

              var body: some View {
                  VStack(spacing: 1) {
                      Text(label)
                          .font(.caption2)
                          .foregroundColor(.gray)
                      Text(value)
                          .font(.subheadline)
                          .fontWeight(.semibold)
                          .foregroundColor(color)
                  }
                  .frame(minWidth: 50)
              }
          }

          // MARK: - 粘贴导入
          struct PasteSheet: View {
              @ObservedObject var manager: ScanManager
              @Environment(\.dismiss) var dismiss
              @State private var text: String = ""

              var body: some View {
                  ZStack {
                      Color(red: 0.06, green: 0.08, blue: 0.15).ignoresSafeArea()

                      VStack {
                          Text("📋 粘贴导入")
                              .font(.headline)
                              .foregroundColor(.white)
                              .padding(.top, 16)

                          Text("每行一个IP，支持 1.1.1.1 或 1.1.1.1:443")
                              .font(.caption)
                              .foregroundColor(.gray)

                          TextEditor(text: $text)
                              .font(.system(.body, design: .monospaced))
                              .foregroundColor(.white)
                              .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                              .cornerRadius(8)
                              .padding()
                              .frame(maxHeight: .infinity)

                          HStack(spacing: 16) {
                              Button("取消") { dismiss() }
                                  .buttonStyle(.bordered)

                              Button("导入") {
                                  manager.importIPs(text)
                                  dismiss()
                              }
                              .buttonStyle(.borderedProminent)
                              .disabled(text.isEmpty)
                          }
                          .padding(.bottom, 20)
                      }
                      .padding()
                  }
                  .presentationDetents([.large])
              }
          }
          EOF

          # Assets
          cat > CloudFlareScan/Assets.xcassets/Contents.json << 'EOF'
          {"info":{"author":"xcode","version":1}}
          EOF
