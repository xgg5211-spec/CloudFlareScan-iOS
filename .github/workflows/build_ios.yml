struct DelayBadge: View {
    let label: String
    let delay: Double
    var isBest: Bool = false
    
    var color: Color {
        if isBest { return .green }
        switch delay {
        case ..<50: return .green
        case ..<100: return .blue
        case ..<200: return .orange
        default: return .red
        }
    }
    
    var body: some View {
        Text("\(label) \(String(format: "%.0f", delay))ms")
            .font(.caption2)
            .foregroundColor(color)
            .padding(.horizontal, 3)
            .padding(.vertical, 1)
            .background(color.opacity(0.1))
            .cornerRadius(2)
    }
}

