        let start = Date()
        let host = NWEndpoint.Host(ip)
        let port = NWEndpoint.Port(rawValue: UInt16(port))!
        let tlsOptions = NWProtocolTLS.Options()
        let params = NWParameters(tls: tlsOptions)
        let connection = NWConnection(host: host, port: port, using: params)
        
        return await withCheckedContinuation { continuation in
            var timeout: DispatchWorkItem?
            var isCompleted = false
            
            timeout = DispatchWorkItem {
                if !isCompleted {
                    connection.cancel()
                    isCompleted = true
                    continuation.resume(returning: -1)
                }
            }
            
            connection.stateUpdateHandler = { state in
                if isCompleted { return }
                switch state {
                case .ready:
                    timeout?.cancel()
                    let delay = Date().timeIntervalSince(start) * 1000
                    isCompleted = true
                    connection.cancel()
                    continuation.resume(returning: delay)
                case .failed, .cancelled:
                    if !isCompleted {
                        timeout?.cancel()
                        isCompleted = true
                        continuation.resume(returning: -1)
                    }
                default:
                    break
                }
            }
            
            connection.start(queue: .global())
            DispatchQueue.global().asyncAfter(deadline: .now() + 5) {
                timeout?.perform()
            }
        }
    }
    
    // MARK: - HTTP请求延迟测试
    private func testHTTPRequest(_ ip: String, port: Int) async -> (delay: Double, colo: String?) {
        let urlString = "https://\(ip):\(port)/cdn-cgi/trace"
        guard let url = URL(string: urlString) else { return (-1, nil) }
        
        let start = Date()
        let config = URLSessionConfiguration.default
        config.timeoutIntervalForRequest = 5
        config.timeoutIntervalForResource = 5
        let session = URLSession(configuration: config)
        
        do {
            let (data, response) = try await session.data(from: url)
            if let httpResponse = response as? HTTPURLResponse,
               httpResponse.statusCode == 200 {
                let delay = Date().timeIntervalSince(start) * 1000
                let text = String(data: data, encoding: .utf8) ?? ""
                var colo: String?
                for line in text.split(separator: "\n") {
                    if line.hasPrefix("colo=") {
                        colo = String(line.dropFirst(5))
                        break
                    }
                }
                return (delay, colo)
            }
        } catch {
            return (-1, nil)
        }
        return (-1, nil)
    }
    
    // MARK: - 完整请求延迟（包含所有阶段）
    private func testFullRequest(_ ip: String, port: Int) async -> Double {
        let start = Date()
        let urlString = "https://\(ip):\(port)/cdn-cgi/trace"
        guard let url = URL(string: urlString) else { return -1 }
        
        let config = URLSessionConfiguration.default
        config.timeoutIntervalForRequest = 5
        config.timeoutIntervalForResource = 5
        config.waitsForConnectivity = false
        let session = URLSession(configuration: config)
        
        do {
            let (_, response) = try await session.data(from: url)
            if let httpResponse = response as? HTTPURLResponse,
               httpResponse.statusCode == 200 {
                return Date().timeIntervalSince(start) * 1000
            }
        } catch {
            return -1
        }
        return -1
    }
    
    // MARK: - 获取完整位置信息
    private func getFullLocation(_ ip: String) async -> LocationInfo {
        // 检查缓存
        cacheLock.lock()
        if let cached = locationCache[ip] {
            cacheLock.unlock()
            return cached
        }
        cacheLock.unlock()
        
        do {
            let url = URL(string: "http://ip-api.com/json/\(ip)?fields=status,country,city,regionName,timezone,isp,org,as")!
            let (data, _) = try await URLSession.shared.data(from: url)
            if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
               json["status"] as? String == "success" {
                let country = json["country"] as? String ?? ""
                let city = json["city"] as? String ?? ""
                let region = json["regionName"] as? String ?? ""
                let timezone = json["timezone"] as? String ?? ""
                let org = json["org"] as? String ?? ""
                let isp = json["isp"] as? String ?? ""
                let asn = json["as"] as? String ?? ""
                let location = "\(country) \(region) \(city)".trimmingCharacters(in: .whitespaces)
                
                let info = LocationInfo(
                    location: location,
                    city: city,
                    country: country,
                    region: region,
                    timezone: timezone,
                    org: org,
                    asn: asn,
                    isp: isp
                )
                
                cacheLock.lock()
                locationCache[ip] = info
                cacheLock.unlock()
                return info
            }
        } catch {
            // 返回默认值
        }
        return LocationInfo(location: "Unknown", city: "", country: "", region: "", timezone: "", org: "", asn: "", isp: "")
    }
    
    // MARK: - 获取运营商
    private func getISP() async -> String {
        do {
            let url = URL(string: "http://ip-api.com/json/?fields=isp")!
            let (data, _) = try await URLSession.shared.data(from: url)
            if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                return json["isp"] as? String ?? "Unknown"
            }
        } catch {
            return "Unknown"
        }
        return "Unknown"
    }
    
    func stopScan() {
        scanTask?.cancel()
        isScanning = false
        scanLog += "\n⏹️ 已停止扫描\n"
    }
    
    // MARK: - 分页加载
    func loadMore() {
        let start = (currentPage + 1) * pageSize
        let end = min(start + pageSize, filteredIPs.count)
        if start < filteredIPs.count {
            currentPage += 1
        }
    }
    
    func getPageItems() -> [IPDetailInfo] {
        let start = currentPage * pageSize
        let end = min(start + pageSize, filteredIPs.count)
        if start < filteredIPs.count {
            return Array(filteredIPs[start..<end])
        }
        return []
    }
    
    // MARK: - 搜索过滤
    func filterIPs(searchText: String = "", location: String = "", colo: String = "", minDelay: Double = 0, maxDelay: Double = 1000) {
        var filtered = ipList
        
        if !searchText.isEmpty {
            filtered = filtered.filter {
                $0.ip.contains(searchText) ||
                $0.location.localizedCaseInsensitiveContains(searchText) ||
                $0.colo.localizedCaseInsensitiveContains(searchText) ||
                $0.city.localizedCaseInsensitiveContains(searchText) ||
                $0.country.localizedCaseInsensitiveContains(searchText)
            }
        }
        
        if !location.isEmpty {
            filtered = filtered.filter { $0.location.localizedCaseInsensitiveContains(location) }
        }
        
        if !colo.isEmpty {
            filtered = filtered.filter { $0.colo.localizedCaseInsensitiveContains(colo) }
        }
        
        filtered = filtered.filter {
            let delay = $0.bestDelay
            return (delay >= minDelay || delay <= 0) && (delay <= maxDelay || delay <= 0)
        }
        
        filteredIPs = filtered
        currentPage = 0
    }
    
    func resetFilters() {
        searchText = ""
        filterLocation = ""
        filterColo = ""
        minDelayFilter = 0
        maxDelayFilter = 1000
        filteredIPs = ipList
        currentPage = 0
    }
    
    // MARK: - 导出功能
    func exportCSV() -> String {
        var csv = "IP,端口,国家,城市,地区,运营商,ASN,数据中心,ICMP延迟,TCP延迟,TLS延迟,HTTP延迟,完整延迟,最优延迟,质量\n"
        for ip in ipList {
            csv += "\(ip.ip),\(ip.port),\(ip.country),\(ip.city),\(ip.region),\(ip.isp),\(ip.asn),\(ip.colo),"
            csv += "\(String(format: "%.1f", ip.icmpDelay)),\(String(format: "%.1f", ip.tcpDelay)),"
            csv += "\(String(format: "%.1f", ip.tlsDelay)),\(String(format: "%.1f", ip.httpDelay)),"
            csv += "\(String(format: "%.1f", ip.fullDelay)),\(String(format: "%.1f", ip.bestDelay)),\(ip.quality)\n"
        }
        return csv
    }
    
    // MARK: - 一键复制
    func copyBestIPs(_ count: Int = 10) {
        let bestIPs = ipList.filter { $0.isAvailable }.prefix(count)
        let text = bestIPs.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
        UIPasteboard.general.string = text
    }
    
    func copyWithDelay() {
        let bestIPs = ipList.filter { $0.isAvailable }.prefix(20)
        var text = ""
        for ip in bestIPs {
            text += "\(ip.ip):\(ip.port)  \(String(format: "%.1f", ip.bestDelay))ms \(ip.delayType.rawValue) \(ip.colo)\n"
        }
        UIPasteboard.general.string = text
    }
    
    func copyAsConfig() {
        let bestIPs = ipList.filter { $0.isAvailable }.prefix(10)
        var config = "# CloudFlare 优选IP列表\n"
        config += "# 更新时间: \(Date())\n"
        config += "# 运营商: \(bestIPs.first?.isp ?? "Unknown")\n"
        config += "# 可用IP: \(availableCount)\n"
        config += "# 平均延迟: \(String(format: "%.1f", avgDelay))ms\n\n"
        for (index, ip) in bestIPs.enumerated() {
            config += "\(index + 1). \(ip.ip):\(ip.port)  [\(String(format: "%.1f", ip.bestDelay))ms] \(ip.delayType.rawValue) \(ip.location)\n"
        }
        UIPasteboard.general.string = config
    }
    
    func copyCSV() {
        UIPasteboard.general.string = exportCSV()
    }
    
    func copyAll() {
        let text = ipList.filter { $0.isAvailable }.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
        UIPasteboard.general.string = text
    }
}

// MARK: - IPNetwork 工具类
class IPNetwork {
    let network: String
    let prefix: Int
    
    init?(_ cidr: String) {
        let parts = cidr.split(separator: "/")
        guard parts.count == 2,
              let prefix = Int(parts[1]) else { return nil }
        self.network = String(parts[0])
        self.prefix = prefix
    }
    
    var hosts: [String] {
        guard let ipv4 = IPv4Address(network) else { return [] }
        let start = ipv4.rawValue
        let hostBits = 32 - prefix
        let count = Int(pow(2.0, Double(hostBits))) - 2
        var result: [String] = []
        let maxCount = min(count, 200)
        for i in 1...maxCount {
            let addr = start + UInt32(i)
            if let ip = IPv4Address(rawValue: addr) {
                result.append(ip.description)
            }
        }
        return result
    }
}

struct IPv4Address {
    let rawValue: UInt32
    
    init?(_ string: String) {
        let parts = string.split(separator: ".")
        guard parts.count == 4 else { return nil }
        var value: UInt32 = 0
        for part in parts {
            guard let num = UInt32(part), num < 256 else { return nil }
            value = (value << 8) + num
        }
        self.rawValue = value
    }
    
    var description: String {
        return [
            (rawValue >> 24) & 0xFF,
            (rawValue >> 16) & 0xFF,
            (rawValue >> 8) & 0xFF,
            rawValue & 0xFF
        ].map { String($0) }.joined(separator: ".")
    }
}

// MARK: - 主界面
struct ContentView: View {
    @StateObject private var networkManager = NetworkManager()
    @State private var selectedPort = 443
    @State private var selectedDelayType: DelayType = .full
    @State private var customIPInput = ""
    @State private var showingAlert = false
    @State private var alertMessage = ""
    @State private var searchText = ""
    @State private var showFilters = false
    @State private var filterLocation = ""
    @State private var filterColo = ""
    @State private var minDelayFilter = 0.0
    @State private var maxDelayFilter = 1000.0
    @State private var showExportMenu = false
    @State private var selectedSort: SortOption = .delay
    
    enum SortOption: String, CaseIterable {
        case delay = "延迟"
        case location = "地区"
        case colo = "数据中心"
        case port = "端口"
    }
    
    let ports = [443, 2053, 2083, 2087, 2096, 8443]
    
    var body: some View {
        NavigationView {
            VStack(spacing: 0) {
                // 状态栏
                StatusBarView(
                    isScanning: networkManager.isScanning,
                    progress: networkManager.progress,
                    ipCount: networkManager.ipList.count,
                    availableCount: networkManager.availableCount,
                    avgDelay: networkManager.avgDelay,
                    minDelay: networkManager.minDelay,
                    scanSpeed: networkManager.scanSpeed
                )
                
                // 搜索和过滤
                SearchFilterView(
                    searchText: $searchText,
                    showFilters: $showFilters,
                    filterLocation: $filterLocation,
                    filterColo: $filterColo,
                    minDelayFilter: $minDelayFilter,
                    maxDelayFilter: $maxDelayFilter,
                    onSearch: {
                        networkManager.filterIPs(
                            searchText: searchText,
                            location: filterLocation,
                            colo: filterColo,
                            minDelay: minDelayFilter,
                            maxDelay: maxDelayFilter
                        )
                    },
                    onReset: {
                        searchText = ""
                        filterLocation = ""
                        filterColo = ""
                        minDelayFilter = 0
                        maxDelayFilter = 1000
                        networkManager.resetFilters()
                    }
                )
                
                // 控制区
                ControlView(
                    isScanning: networkManager.isScanning,
                    selectedPort: $selectedPort,
                    selectedDelayType: $selectedDelayType,
                    ports: ports,
                    onStart: {
                        let customIPs = customIPInput
                            .split(separator: "\n")
                            .map { String($0).trimmingCharacters(in: .whitespaces) }
                            .filter { !$0.isEmpty }
                        networkManager.startScan(
                            customIPs: customIPs,
                            port: selectedPort,
                            delayType: selectedDelayType
                        )
                    },
                    onStop: { networkManager.stopScan() },
                    onCopy: {
                        if networkManager.ipList.isEmpty {
                            alertMessage = "请先扫描IP"
                            showingAlert = true
                            return
                        }
                        networkManager.copyBestIPs()
                        alertMessage = "✅ 已复制前10个IP到剪贴板"
                        showingAlert = true
                    },
                    onCopyDelay: {
                        if networkManager.ipList.isEmpty {
                            alertMessage = "请先扫描IP"
                            showingAlert = true
                            return
                        }
                        networkManager.copyWithDelay()
                        alertMessage = "✅ 已复制带延迟的IP列表"
                        showingAlert = true
                    },
                    onCopyConfig: {
                        if networkManager.ipList.isEmpty {
                            alertMessage = "请先扫描IP"
                            showingAlert = true
                            return
                        }
                        networkManager.copyAsConfig()
                        alertMessage = "✅ 已复制配置信息"
                        showingAlert = true
                    },
                    onCopyAll: {
                        if networkManager.ipList.isEmpty {
                            alertMessage = "请先扫描IP"
                            showingAlert = true
                            return
                        }
                        networkManager.copyAll()
                        alertMessage = "✅ 已复制全部可用IP"
                        showingAlert = true
                    },
                    onExportCSV: {
                        if networkManager.ipList.isEmpty {
                            alertMessage = "请先扫描IP"
                            showingAlert = true
                            return
                        }
                        networkManager.copyCSV()
                        alertMessage = "✅ CSV数据已复制到剪贴板"
                        showingAlert = true
                    },
                    customIPInput: $customIPInput,
                    totalIPs: networkManager.totalIPs
                )
                
                // 统计信息
                StatsView(
                    totalIPs: networkManager.totalIPs,
                    availableCount: networkManager.availableCount,
                    avgDelay: networkManager.avgDelay,
                    minDelay: networkManager.minDelay,
                    maxDelay: networkManager.maxDelay,
                    scanSpeed: networkManager.scanSpeed
                )
                
                // 结果列表
                ResultListView(
                    ipList: networkManager.getPageItems(),
                    totalCount: networkManager.filteredIPs.count,
                    currentPage: networkManager.currentPage,
                    pageSize: networkManager.pageSize,
                    onLoadMore: { networkManager.loadMore() },
                    onRefresh: {
                        networkManager.filterIPs(
                            searchText: searchText,
                            location: filterLocation,
                            colo: filterColo,
                            minDelay: minDelayFilter,
                            maxDelay: maxDelayFilter
                        )
                    }
                )
                
                // 日志
                LogView(scanLog: networkManager.scanLog)
            }
            .navigationTitle("🌐 CF优选扫描")
            .navigationBarTitleDisplayMode(.inline)
            .toolbar {
                ToolbarItem(placement: .navigationBarTrailing) {
                    Button {
                        networkManager.scanLog = ""
                    } label: {
                        Image(systemName: "trash")
                    }
                    .disabled(networkManager.scanLog.isEmpty)
                }
            }
            .alert("提示", isPresented: $showingAlert) {
                Button("确定") {}
            } message: {
                Text(alertMessage)
            }
        }
    }
}

// MARK: - 状态栏
struct StatusBarView: View {
    let isScanning: Bool
    let progress: Double
    let ipCount: Int
    let availableCount: Int
    let avgDelay: Double
    let minDelay: Double
    let scanSpeed: Double
    
    var body: some View {
        HStack(spacing: 8) {
            Circle()
                .fill(isScanning ? Color.green : Color.gray)
                .frame(width: 8, height: 8)
            
            Text(isScanning ? "扫描中..." : "就绪")
                .font(.caption2)
            
            if isScanning {
                ProgressView(value: progress)
                    .frame(width: 60)
            }
            
            Spacer()
            
            if avgDelay > 0 {
                Text("均\(String(format: "%.0f", avgDelay))ms")
                    .font(.caption2)
                    .foregroundColor(.secondary)
            }
            if minDelay > 0 {
                Text("最佳\(String(format: "%.0f", minDelay))ms")
                    .font(.caption2)
                    .foregroundColor(.green)
            }
            if scanSpeed > 0 {
                Text("\(String(format: "%.0f", scanSpeed))/s")
                    .font(.caption2)
                    .foregroundColor(.blue)
            }
            Text("\(ipCount)个")
                .font(.caption2)
                .fontWeight(.medium)
            if availableCount > 0 {
                Text("✅\(availableCount)")
                    .font(.caption2)
                    .foregroundColor(.green)
            }
        }
        .padding(.horizontal, 8)
        .padding(.vertical, 4)
        .background(Color(.systemBackground))
    }
}

