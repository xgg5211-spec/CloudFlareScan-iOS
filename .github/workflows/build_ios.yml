    // MARK: - 生成IP列表
    private func generateIPs(customIPs: [String]) -> [String] {
        if !customIPs.isEmpty {
            return customIPs
        }
        
        var ips: [String] = []
        let targetCount = 10000
        
        for cidr in cfRanges {
            guard let network = IPNetwork(cidr) else { continue }
            for ip in network.hosts {
                if ips.count >= targetCount { break }
                ips.append(ip)
            }
            if ips.count >= targetCount { break }
        }
        return ips
    }
    
    // MARK: - 开始扫描
    func startScan(customIPs: [String] = [], port: Int = 443, delayType: DelayType = .full) {
        isScanning = true
        ipList = []
        allResults = []
        filteredIPs = []
        progress = 0
        scanLog = ""
        availableCount = 0
        currentPage = 0
        processedCount = 0
        startTime = Date()
        selectedDelayType = delayType
        
        let ips = generateIPs(customIPs: customIPs)
        totalIPs = ips.count
        
        scanLog += "📡 待测IP: \(totalIPs) 个\n"
        scanLog += "🔌 端口: \(port)\n"
        scanLog += "📊 延迟类型: \(delayType.description)\n"
        
        scanTask = Task.detached(priority: .high) { [weak self] in
            guard let self = self else { return }
            
            // 获取运营商信息
            let isp = await self.getISP()
            
            await MainActor.run {
                self.scanLog += "📶 运营商: \(isp)\n"
                self.scanLog += "⏳ 开始扫描...\n"
            }
            
            // 分批处理
            let batches = stride(from: 0, to: ips.count, by: self.batchSize).map {
                Array(ips[$0..<min($0 + self.batchSize, ips.count)])
            }
            
            var results: [IPDetailInfo] = []
            let resultLock = NSLock()
            var completedBatches = 0
            
            await withTaskGroup(of: [IPDetailInfo].self) { group in
                for batch in batches {
                    if Task.isCancelled { break }
                    
                    group.addTask {
                        return await self.scanBatch(batch, port: port, delayType: delayType)
                    }
                }
                
                for await batchResults in group {
                    resultLock.lock()
                    results.append(contentsOf: batchResults)
                    processedCount += batchResults.count
                    completedBatches += 1
                    
                    // 更新统计
                    let available = results.filter { $0.isAvailable }
                    let delays = available.map { $0.bestDelay }.filter { $0 > 0 }
                    
                    resultLock.unlock()
                    
                    await MainActor.run {
                        self.ipList = results.sorted { $0.bestDelay < $1.bestDelay }
                        self.filteredIPs = self.ipList
                        self.availableCount = available.count
                        self.progress = Double(processedCount) / Double(self.totalIPs)
                        
                        // 更新统计
                        if !delays.isEmpty {
                            self.avgDelay = delays.reduce(0, +) / Double(delays.count)
                            self.minDelay = delays.min() ?? 0
                            self.maxDelay = delays.max() ?? 0
                        }
                        
                        // 计算速度
                        if let start = self.startTime {
                            let elapsed = Date().timeIntervalSince(start)
                            if elapsed > 0 {
                                self.scanSpeed = Double(processedCount) / elapsed
                            }
                        }
                        
                        self.scanLog += "✅ 已扫描: \(processedCount)/\(self.totalIPs)  可用: \(self.availableCount)  "
                        self.scanLog += "均延: \(String(format: "%.1f", self.avgDelay))ms\n"
                    }
                }
            }
            
            await MainActor.run {
                self.ipList = results.sorted { $0.bestDelay < $1.bestDelay }
                self.filteredIPs = self.ipList
                self.isScanning = false
                self.progress = 1.0
                
                let elapsed = self.startTime.map { Date().timeIntervalSince($0) } ?? 0
                self.scanLog += "\n🎯 扫描完成！\n"
                self.scanLog += "📊 可用IP: \(self.availableCount) 个\n"
                self.scanLog += "⏱️ 总耗时: \(String(format: "%.1f", elapsed)) 秒\n"
                self.scanLog += "🚀 平均速度: \(String(format: "%.0f", self.scanSpeed)) IP/秒\n"
                if self.availableCount > 0 {
                    self.scanLog += "🏆 最优延迟: \(String(format: "%.1f", self.minDelay))ms\n"
                }
            }
        }
    }
    
    // MARK: - 批量扫描（全延迟检测）
    private func scanBatch(_ ips: [String], port: Int, delayType: DelayType) async -> [IPDetailInfo] {
        var results: [IPDetailInfo] = []
        
        await withTaskGroup(of: IPDetailInfo?.self) { group in
            for ip in ips {
                group.addTask {
                    let semaphore = await self.semaphore
                    semaphore.wait()
                    defer { semaphore.signal() }
                    
                    return await self.testIPFull(ip, port: port)
                }
            }
            
            for await result in group {
                if let result = result {
                    results.append(result)
                }
            }
        }
        
        return results
    }
    
    // MARK: - 完整IP测试（所有延迟类型）
    private func testIPFull(_ ip: String, port: Int) async -> IPDetailInfo? {
        var info = IPDetailInfo(
            ip: ip,
            port: port,
            location: "",
            isp: "",
            colo: "",
            city: "",
            country: "",
            region: "",
            timezone: "",
            org: "",
            asn: ""
        )
        
        // 1. ICMP Ping (使用NWConnection模拟)
        info.icmpDelay = await testICMP(ip)
        
        // 2. TCP连接延迟
        info.tcpDelay = await testTCPConnection(ip, port: port)
        
        // 3. TLS握手延迟
        if info.tcpDelay > 0 {
            info.tlsDelay = await testTLSHandshake(ip, port: port)
        }
        
        // 4. HTTP请求延迟
        if info.tlsDelay > 0 || info.tcpDelay > 0 {
            let httpResult = await testHTTPRequest(ip, port: port)
            info.httpDelay = httpResult.delay
            if let colo = httpResult.colo {
                info.colo = colo
            }
        }
        
        // 5. 完整请求延迟（包含DNS解析 + TCP + TLS + HTTP）
        info.fullDelay = await testFullRequest(ip, port: port)
        
        // 如果至少有一种延迟可用，获取位置信息
        if info.isAvailable {
            let locationInfo = await getFullLocation(ip)
            info.location = locationInfo.location
            info.city = locationInfo.city
            info.country = locationInfo.country
            info.region = locationInfo.region
            info.timezone = locationInfo.timezone
            info.org = locationInfo.org
            info.asn = locationInfo.asn
            info.isp = locationInfo.isp
        }
        
        return info
    }
    
    // MARK: - ICMP Ping 测试（使用NWConnection模拟）
    private func testICMP(_ ip: String) async -> Double {
        // iOS不支持原生ICMP，使用TCP连接模拟
        let start = Date()
        let host = NWEndpoint.Host(ip)
        let port = NWEndpoint.Port(rawValue: 53)! // 使用DNS端口
        let connection = NWConnection(host: host, port: port, using: .udp)
        
        return await withCheckedContinuation { continuation in
            var timeout: DispatchWorkItem?
            var isCompleted = false
            
            timeout = DispatchWorkItem {
                if !isCompleted {
                    connection.cancel()
                    isCompleted = true
                    continuation.resume(returning: -1)
                }
            }
            
            connection.stateUpdateHandler = { state in
                if isCompleted { return }
                switch state {
                case .ready:
                    timeout?.cancel()
                    let delay = Date().timeIntervalSince(start) * 1000
                    isCompleted = true
                    connection.cancel()
                    continuation.resume(returning: delay)
                case .failed, .cancelled:
                    if !isCompleted {
                        timeout?.cancel()
                        isCompleted = true
                        continuation.resume(returning: -1)
                    }
                default:
                    break
                }
            }
            
            connection.start(queue: .global())
            DispatchQueue.global().asyncAfter(deadline: .now() + 3) {
                timeout?.perform()
            }
        }
    }
    
