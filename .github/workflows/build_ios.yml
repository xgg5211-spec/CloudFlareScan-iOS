name: 构建IP优选工具

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 克隆代码
        uses: actions/checkout@v4

      - name: 安装工具
        run: brew install zsign

      - name: 生成Swift应用
        run: |
          mkdir -p IPSelector
          cat > IPSelector/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>com.ipselector.tool</string>
            <key>CFBundleName</key><string>IPSelector</string>
            <key>CFBundleDisplayName</key><string>IP优选</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>2.0</string>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>NSAppTransportSecurity</key><dict><key>NSAllowsArbitraryLoads</key><true/></dict>
          </dict>
          </plist>
          EOF
          cat > IPSelector/App.swift << 'EOF'
          import SwiftUI
          @main struct App: App { var body: some Scene { WindowGroup { ContentView() } } }
          EOF
          cat > IPSelector/ContentView.swift << 'EOF'
          import SwiftUI
          import Foundation
          
          struct ContentView: View {
              @StateObject var vm = ProxyVM()
              var body: some View {
                  NavigationStack {
                      List(vm.nodes) { node in
                          HStack {
                              VStack(alignment: .leading) {
                                  Text(node.name).foregroundStyle(.white)
                                  Text("\(node.ip):\(node.port)").font(.caption).foregroundStyle(.gray)
                              }
                              Spacer()
                              Text("\(node.latency)ms").foregroundStyle(node.latency < 200 ? .green : .orange)
                              Button(action: { UIPasteboard.general.string = "\(node.ip):\(node.port)" }) {
                                  Image(systemName: "square.on.square").foregroundStyle(.cyan)
                              }
                          }
                      }
                      .navigationTitle("IP优选")
                  }
              }
          }
          EOF

      - name: 创建Xcode项目
        run: |
          xcodebuild create-xcodeproj \
            -project IPSelector.xcodeproj \
            -scheme IPSelector \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: 编译应用
        run: |
          xcodebuild build \
            -project IPSelector.xcodeproj \
            -scheme IPSelector \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/IPSelector.app Payload/
          zip -r IPSelector.ipa Payload

      - name: 签名IPA
        run: |
          openssl req -newkey rsa:2048 -nodes -keyout key.pem -x509 -days 3650 -out cert.pem \
            -subj "/CN=IPSelector"
          openssl pkcs12 -export -in cert.pem -inkey key.pem -out cert.p12 -passout pass:
          zsign -k key.pem -c cert.pem -p cert.p12 -P "" -b com.ipselector.tool \
            -n IPSelector -o IPSelector-signed.ipa IPSelector.ipa

      - name: 上传Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "IP优选 v2.0"
          files: IPSelector-signed.ipa
          prerelease: true
