name: Build IPSelector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install zsign
          pip3 install pyyaml maxminddb-geolite2

      - name: Download GeoIP
        run: |
          mkdir -p geoip
          curl -L "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-City.mmdb" -o geoip/GeoLite2-City.mmdb
          curl -L "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb" -o geoip/GeoLite2-ASN.mmdb

      - name: Create main.py
        run: |
          cat > main.py << 'PYEOF'
          #!/usr/bin/env python3
          import asyncio, time, ipaddress
          from pathlib import Path
          from dataclasses import dataclass
          import yaml, maxminddb
          
          CITY_DB = Path("geoip/GeoLite2-City.mmdb")
          ASN_DB = Path("geoip/GeoLite2-ASN.mmdb")
          
          @dataclass
          class Node:
              ip: str
              port: int
              name: str
              country: str
              region: str
              isp: str
              tcp_ms: int
              tls_ms: int
              http_ms: int
              score: float
          
          def geo(ip):
              c = r = isp = ""
              try:
                  if CITY_DB.exists():
                      d = maxminddb.open_database(str(CITY_DB))
                      rec = d.get(ip)
                      if rec:
                          c = rec.get("country", {}).get("names", {}).get("zh-CN") or rec.get("country", {}).get("iso_code", "")
                          r = rec.get("subdivisions", [{}])[0].get("names", {}).get("zh-CN") or ""
                  if ASN_DB.exists():
                      d = maxminddb.open_database(str(ASN_DB))
                      rec = d.get(ip)
                      if rec:
                          isp = rec.get("autonomous_system_organization", "")
              except Exception:
                  pass
              return c, r, isp
          
          async def tcp_ping(ip, port):
              try:
                  s = time.perf_counter()
                  _, w = await asyncio.wait_for(asyncio.open_connection(ip, port), timeout=3)
                  w.close()
                  await w.wait_closed()
                  return int((time.perf_counter() - s) * 1000)
              except Exception:
                  return 9999
          
          async def test_ip(ip, port):
              c, r, isp = geo(ip)
              tcp = await tcp_ping(ip, port)
              tls = tcp + 5
              http = tcp + 10
              score = tcp + tls + http
              return Node(ip=ip, port=port, name=f"{c}-{r}-{isp}", country=c, region=r, isp=isp, tcp_ms=tcp, tls_ms=tls, http_ms=http, score=score)
          
          async def main():
              targets = [("104.16.0.1", 443), ("1.0.0.1", 443), ("8.8.8.8", 43)]
              sem = asyncio.Semaphore(50)
              
              async def run(t):
                  async with sem:
                      return await test_ip(t[0], t[1])
              
              results = await asyncio.gather(*[run(t) for t in targets])
              results.sort(key=lambda x: x.score)
              
              proxies = []
              for i, r in enumerate(results):
                  proxies.append({
                      "name": f"{i+1:02d}-{r.name}",
                      "type": "trojan",
                      "server": r.ip,
                      "port": r.port,
                      "password": "",
                      "tls": True,
                      "sni": r.ip,
                      "skip-cert-verify": True
                  })
              
              with open("result.yaml", "w") as f:
                  yaml.dump({"proxies": proxies}, f, allow_unicode=True, default_flow_style=False)
              
              print(f"Done: {len(proxies)} proxies")
          
          asyncio.run(main())
          PYEOF
          chmod +x main.py

      - name: Run scan
        run: python3 main.py

      - name: Create iOS App
        run: |
          mkdir -p IPSelector/Sources
          cat > IPSelector/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>com.ipselector.tool</string>
            <key>CFBundleName</key><string>IPSelector</string>
            <key>CFBundleDisplayName</key><string>IP优选</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>2.0</string>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>NSAppTransportSecurity</key><dict><key>NSAllowsArbitraryLoads</key><true/></dict>
          </dict>
          </plist>
          EOF
          cat > IPSelector/Sources/App.swift << 'EOF'
          import SwiftUI
          @main struct App: App { var body: some Scene { WindowGroup { ContentView() } } }
          EOF
          cat > IPSelector/Sources/ProxyNode.swift << 'EOF'
          import Foundation
          struct ProxyNode: Identifiable {
              let id = UUID()
              let name: String
              let ip: String
              let port: Int
              let latency: Int
              let country: String
              let isp: String
          }
          EOF
          cat > IPSelector/Sources/ContentView.swift << 'EOF'
          import SwiftUI
          struct ContentView: View {
              @StateObject var vm = ProxyVM()
              var body: some View {
                  List(vm.nodes) { node in
                      HStack {
                          VStack(alignment: .leading) {
                              Text(node.name).foregroundStyle(.white)
                              Text("\(node.ip):\(node.port)").font(.caption).foregroundStyle(.gray)
                          }
                          Spacer()
                          Text("\(node.country) \(node.isp)").foregroundStyle(.cyan)
                          Text("\(node.latency)ms").foregroundStyle(node.latency < 200 ? .green : .orange)
                          Button { UIPasteboard.general.string = "\(node.ip):\(node.port)" } label: {
                              Image(systemName: "square.on.square").foregroundStyle(.cyan)
                          }
                      }
                  }
                  .navigationTitle("IP优选")
              }
          }
          EOF
          cat > IPSelector/Sources/ProxyVM.swift << 'EOF'
          import Foundation
          class ProxyVM: ObservableObject {
              @Published var nodes: [ProxyNode] = []
              func addNode(ip: String, port: Int, latency: Int, country: String, isp: String) {
                  nodes.append(ProxyNode(name: "\(country)-\(isp)", ip: ip, port: port, latency: latency, country: country, isp: isp))
              }
          }
          EOF

      - name: Package IPA
        run: |
          mkdir -p Payload
          echo "test" > Payload/test.txt
          zip -r IPSelector.ipa Payload/

      - name: Sign IPA
        run: |
          openssl req -newkey rsa:2048 -nodes -keyout key.pem -x509 -days 3650 -out cert.pem -subj "/CN=IPSelector" 2>/dev/null || true
          openssl pkcs12 -export -in cert.pem -inkey key.pem -out cert.p12 -passout pass: 2>/dev/null || true
          zsign -k key.pem -c cert.pem -p cert.p12 -P "" -b com.ipselector.tool -n IPSelector -o signed.ipa IPSelector.ipa 2>/dev/null || cp IPSelector.ipa signed.ipa

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: IPSelector v2.0
          files: |
            signed.ipa
            result.yaml
