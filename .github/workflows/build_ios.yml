name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & kivy-ios
        run: |
          brew install autoconf automake libtool pkg-config
          pip install kivy-ios cython

      - name: Build Kivy iOS Toolchain
        run: |
          toolchain build python3 kivy
          toolchain create CloudFlareScan .

      - name: Compile Xcode project
        run: |
          cd cloudflarescan-ios
          xcodebuild -project CloudFlareScan.xcodeproj \
                     -scheme CloudFlareScan \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -R cloudflarescan-ios/build/Release-iphoneos/CloudFlareScan.app Payload/
          zip -r CloudFlareScan_TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan_TrollStore_IPA
          path: CloudFlareScan_TrollStore.ipa
