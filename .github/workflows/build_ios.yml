name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build-ipa:
    runs-on: macos-14 # 使用 Apple Silicon M1/M2 高速 Mac 构建节点

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install macOS System Dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config cmake ldid

      - name: Install Kivy-iOS and Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0.0" # 保持兼容 iOS toolchain 的 Cython 版本
          pip install kivy-ios

      # 1. 恢复 Kivy-iOS 编译缓存 (大大缩短后续 Actions 运行时间)
      - name: Restore Kivy-iOS Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kivy-ios
            build
            dist
          key: ${{ runner.os }}-kivy-ios-v2-${{ hashFiles('**/requirements.txt', '**/main.py') }}
          restore-keys: |
            ${{ runner.os }}-kivy-ios-v2-

      # 2. 编译 Python 基础运行环境及核心 C 拓展 (包含 TLS/SSL 拓展)
      - name: Build Kivy-iOS Recipes
        run: |
          toolchain build python3 kivy openssl certifi

      # 3. 为 iOS 环境安装 Python 异步网络依赖库 (支持 aiohttp/TLS 测速)
      - name: Install Python Package Dependencies
        run: |
          toolchain pip install aiohttp certifi multidict yarl frozenlist aiosignal async-timeout

      # 4. 生成 Xcode 工程
      - name: Create Xcode Project
        run: |
          toolchain create "CloudFlareScan" .

      # 5. 使用 xcodebuild 无证书编译项目
      - name: Build Xcode Project
        run: |
          cd cloudflarescan-ios
          xcodebuild -project CloudFlareScan.xcodeproj \
            -scheme CloudFlareScan \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      # 6. 打包 IPA 并使用 ldid 进行 TrollStore 专属伪签名
      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          # 复制生成的 App 目录到 Payload 结构中
          cp -R cloudflarescan-ios/build/Release-iphoneos/CloudFlareScan.app Payload/
          
          # 给 App 注入伪签名 (TrollStore 正常运行的关键步骤)
          ldid -S Payload/CloudFlareScan.app/CloudFlareScan
          
          # 压缩为标准的 IPA 包
          zip -r CloudFlareScan-iOS-TrollStore.ipa Payload

      # 7. 上传 IPA 构建产物到 GitHub Actions Artifacts
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-iOS-TrollStore
          path: CloudFlareScan-iOS-TrollStore.ipa
          retention-days: 7
