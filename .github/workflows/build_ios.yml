name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Create Web App
        run: |
          mkdir -p CloudFlareScan

          cat > CloudFlareScan/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>优选IP筛选工具</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
                  body {
                      background: #0a0e1a;
                      color: #e8edf5;
                      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
                      padding: 12px 14px 30px;
                      min-height: 100vh;
                  }
                  .header {
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                      padding: 6px 0 12px;
                      border-bottom: 1px solid #1a2a4a;
                  }
                  .header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #4fc3f7, #7c4dff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
                  .header .isp { font-size: 12px; color: #4fc3f7; background: #0d1a2a; padding: 4px 12px; border-radius: 20px; border: 1px solid #1a3a5a; }
                  .card {
                      background: #111b2e;
                      border-radius: 14px;
                      padding: 16px;
                      margin-top: 12px;
                      border: 1px solid #1a2a4a;
                      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                  }
                  .card-title { font-size: 15px; font-weight: 600; color: #4fc3f7; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
                  .stats {
                      display: grid;
                      grid-template-columns: repeat(4, 1fr);
                      gap: 6px;
                      text-align: center;
                  }
                  .stats .item { background: #0a0e1a; border-radius: 8px; padding: 8px 4px; }
                  .stats .num { font-size: 18px; font-weight: 700; color: #4fc3f7; display: block; }
                  .stats .label { font-size: 11px; color: #6a7a8a; }
                  textarea {
                      width: 100%;
                      height: 90px;
                      background: #0a0e1a;
                      color: #c8d8e8;
                      border: 1px solid #1a2a4a;
                      border-radius: 8px;
                      padding: 10px 12px;
                      font-size: 13px;
                      font-family: "SF Mono", "Menlo", monospace;
                      resize: vertical;
                      outline: none;
                      line-height: 1.6;
                  }
                  textarea:focus { border-color: #4fc3f7; }
                  .btn-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
                  .btn {
                      padding: 8px 16px;
                      border: none;
                      border-radius: 8px;
                      font-size: 13px;
                      font-weight: 600;
                      cursor: pointer;
                      transition: all 0.2s;
                      flex: 1;
                      min-width: 60px;
                      text-align: center;
                  }
                  .btn:active { transform: scale(0.96); }
                  .btn-primary { background: #1976d2; color: #fff; }
                  .btn-primary:active { background: #1565c0; }
                  .btn-success { background: #2e7d32; color: #fff; }
                  .btn-success:active { background: #1b5e20; }
                  .btn-danger { background: #c62828; color: #fff; }
                  .btn-danger:active { background: #b71c1c; }
                  .btn-secondary { background: #37474f; color: #fff; }
                  .btn-secondary:active { background: #263238; }
                  .btn-purple { background: #6a1b9a; color: #fff; }
                  .btn-purple:active { background: #4a148c; }
                  .btn-teal { background: #00695c; color: #fff; }
                  .btn-teal:active { background: #004d40; }
                  .ip-list { max-height: 220px; overflow-y: auto; }
                  .ip-item {
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                      padding: 8px 12px;
                      background: #0a0e1a;
                      border-radius: 6px;
                      margin-bottom: 4px;
                      font-size: 12px;
                      border-left: 3px solid #1a3a5a;
                  }
                  .ip-item .ip { font-family: monospace; color: #e8edf5; }
                  .ip-item .delay { font-weight: 600; }
                  .ip-item .info { color: #6a7a8a; font-size: 11px; }
                  .delay-fast { color: #66bb6a; }
                  .delay-mid { color: #ffa726; }
                  .delay-slow { color: #ef5350; }
                  .status-bar {
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                      padding: 6px 0;
                      font-size: 13px;
                      color: #6a7a8a;
                  }
                  .status-bar .status { color: #4fc3f7; }
                  .status-bar .scanning { animation: pulse 1s infinite; }
                  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
                  .empty { text-align: center; color: #4a5a6a; padding: 30px 0; font-size: 14px; }
                  .output-box {
                      width: 100%;
                      height: 70px;
                      background: #0a0e1a;
                      color: #a0b0c0;
                      border: 1px solid #1a2a4a;
                      border-radius: 8px;
                      padding: 10px 12px;
                      font-size: 12px;
                      font-family: "SF Mono", "Menlo", monospace;
                      resize: none;
                      outline: none;
                      line-height: 1.5;
                  }
                  .filter-row {
                      display: flex;
                      gap: 10px;
                      margin-top: 8px;
                      align-items: center;
                  }
                  .filter-row input {
                      flex: 1;
                      background: #0a0e1a;
                      border: 1px solid #1a2a4a;
                      border-radius: 6px;
                      padding: 6px 10px;
                      color: #e8edf5;
                      font-size: 12px;
                      outline: none;
                      min-width: 0;
                  }
                  .filter-row input:focus { border-color: #4fc3f7; }
                  .filter-row label { color: #6a7a8a; font-size: 12px; white-space: nowrap; }
                  .count-badge {
                      background: #0d1a2a;
                      padding: 2px 10px;
                      border-radius: 12px;
                      font-size: 12px;
                      color: #4fc3f7;
                      border: 1px solid #1a3a5a;
                  }
                  @media (max-width: 400px) {
                      body { padding: 8px 10px 20px; }
                      .header h1 { font-size: 17px; }
                      .stats { grid-template-columns: repeat(2, 1fr); }
                      .btn { font-size: 12px; padding: 7px 10px; min-width: 50px; }
                  }
              </style>
          </head>
          <body>

          <!-- ===== 标题栏 ===== -->
          <div class="header">
              <h1>🚀 优选IP筛选</h1>
              <span class="isp" id="ispDisplay">📍 检测中...</span>
          </div>

          <!-- ===== 统计栏 ===== -->
          <div class="card">
              <div class="stats">
                  <div class="item"><span class="num" id="totalCount">0</span><span class="label">总数</span></div>
                  <div class="item"><span class="num" id="availableCount" style="color:#66bb6a;">0</span><span class="label">可用</span></div>
                  <div class="item"><span class="num" id="bestDelay" style="color:#ffa726;">--</span><span class="label">最佳</span></div>
                  <div class="item"><span class="num" id="avgDelay" style="color:#4fc3f7;">--</span><span class="label">平均</span></div>
              </div>
              <div class="status-bar">
                  <span class="status" id="statusText">就绪</span>
                  <span id="scanStatus"></span>
              </div>
          </div>

          <!-- ===== 导入IP ===== -->
          <div class="card">
              <div class="card-title">📂 导入IP</div>
              <textarea id="ipInput" placeholder="每行一个IP，支持 1.1.1.1 或 1.1.1.1:443">1.1.1.1
          8.8.8.8
          9.9.9.9
          104.16.0.0
          104.16.1.0
          104.16.2.0</textarea>
              <div class="btn-group">
                  <button class="btn btn-primary" onclick="importIPs()">📥 导入</button>
                  <button class="btn btn-success" onclick="startScan()">▶ 开始扫描</button>
                  <button class="btn btn-danger" onclick="stopScan()">⏹ 停止</button>
                  <button class="btn btn-secondary" onclick="clearAll()">🗑 清空</button>
              </div>
          </div>

          <!-- ===== 筛选 ===== -->
          <div class="card">
              <div class="card-title">🔍 筛选</div>
              <div class="filter-row">
                  <label>地区</label>
                  <input id="filterCountry" placeholder="输入地区" oninput="applyFilter()">
                  <label>端口</label>
                  <input id="filterPort" placeholder="端口" oninput="applyFilter()" style="max-width:70px;">
                  <span class="count-badge" id="filterCount">显示 0 个</span>
              </div>
          </div>

          <!-- ===== 可用IP列表 ===== -->
          <div class="card">
              <div class="card-title">📋 可用IP <span style="font-size:12px;color:#6a7a8a;font-weight:400;" id="ipCountLabel"></span></div>
              <div class="ip-list" id="ipList">
                  <div class="empty">暂无数据，请导入IP并开始扫描</div>
              </div>
          </div>

          <!-- ===== 输出文本 ===== -->
          <div class="card">
              <div class="card-title">📝 输出文本</div>
              <textarea class="output-box" id="outputText" readonly placeholder="等待扫描..."></textarea>
              <div class="btn-group">
                  <button class="btn btn-secondary" onclick="copyOutput()">📋 复制输出</button>
                  <button class="btn btn-teal" onclick="exportIPs()">📤 导出IP</button>
                  <button class="btn btn-purple" onclick="copyDetails()">📄 复制详情</button>
              </div>
          </div>

          <script>
              // ===== 数据 =====
              let ipList = [];
              let results = [];
              let filteredResults = [];
              let isScanning = false;
              let abortController = null;
              let detectedISP = '检测中...';

              // ===== 自动检测运营商 =====
              function detectISP() {
                  fetch('http://ip-api.com/json/?fields=isp')
                      .then(r => r.json())
                      .then(data => {
                          if (data.isp) {
                              detectedISP = data.isp;
                              document.getElementById('ispDisplay').textContent = '📍 ' + data.isp;
                          }
                      })
                      .catch(() => {});
              }

              // ===== 导入IP =====
              function importIPs() {
                  const text = document.getElementById('ipInput').value;
                  const lines = text.split('\n').filter(l => l.trim());
                  ipList = [];
                  for (const line of lines) {
                      const trimmed = line.trim();
                      if (!trimmed) continue;
                      const parts = trimmed.split(':');
                      const ip = parts[0];
                      const port = parts.length > 1 ? parseInt(parts[1]) || 443 : 443;
                      if (ip && (ip.includes('.') || ip.includes(':'))) {
                          ipList.push({ ip: ip, port: port });
                      }
                  }
                  results = [];
                  filteredResults = [];
                  updateStats();
                  renderIPs();
                  document.getElementById('statusText').textContent = '已导入 ' + ipList.length + ' 个IP';
              }

              // ===== 开始扫描 =====
              async function startScan() {
                  if (ipList.length === 0) {
                      document.getElementById('statusText').textContent = '⚠️ 请先导入IP';
                      return;
                  }

                  isScanning = true;
                  results = [];
                  filteredResults = [];
                  document.getElementById('statusText').textContent = '⏳ 扫描中...';
                  document.getElementById('scanStatus').textContent = '🔄';
                  document.getElementById('scanStatus').className = 'scanning';

                  let found = 0;
                  let totalDelays = 0;
                  const allResults = [];

                  const port = 443;
                  const batchSize = 50;

                  for (let i = 0; i < ipList.length; i += batchSize) {
                      if (!isScanning) break;
                      const batch = ipList.slice(i, i + batchSize);
                      const promises = batch.map(ip => checkIP(ip.ip, ip.port || 443));
                      const batchResults = await Promise.all(promises);

                      for (const result of batchResults) {
                          if (result) {
                              allResults.push(result);
                              found++;
                              totalDelays += result.delay;
                          }
                      }

                      results = allResults;
                      filteredResults = [...results];
                      applyFilter();
                      updateStats();
                      renderIPs();
                      document.getElementById('statusText').textContent = '⏳ 扫描中... ' + found + ' 个可用';
                  }

                  isScanning = false;
                  document.getElementById('scanStatus').textContent = '';
                  document.getElementById('scanStatus').className = '';
                  results = allResults;
                  filteredResults = [...results];
                  applyFilter();
                  updateStats();
                  renderIPs();
                  updateOutput();
                  document.getElementById('statusText').textContent = '✅ 完成！共 ' + results.length + ' 个可用IP';
              }

              // ===== 检查单个IP =====
              function checkIP(ip, port) {
                  return new Promise((resolve) => {
                      const url = 'https://' + ip + ':' + port + '/cdn-cgi/trace';
                      const start = Date.now();

                      fetch(url, { mode: 'cors', signal: AbortSignal.timeout(3000) })
                          .then(res => {
                              if (res.ok) {
                                  const delay = Date.now() - start;
                                  res.text().then(text => {
                                      let colo = '';
                                      text.split('\n').forEach(line => {
                                          if (line.startsWith('colo=')) colo = line.substring(5);
                                      });
                                      fetch('http://ip-api.com/json/' + ip + '?fields=country')
                                          .then(r => r.json())
                                          .then(data => {
                                              resolve({
                                                  ip: ip,
                                                  port: port,
                                                  delay: delay,
                                                  country: data.country || '',
                                                  colo: colo
                                              });
                                          })
                                          .catch(() => resolve(null));
                                  });
                              } else {
                                  resolve(null);
                              }
                          })
                          .catch(() => resolve(null));
                  });
              }

              // ===== 停止扫描 =====
              function stopScan() {
                  isScanning = false;
                  document.getElementById('scanStatus').textContent = '';
                  document.getElementById('scanStatus').className = '';
                  document.getElementById('statusText').textContent = '⏹ 已停止';
              }

              // ===== 清空 =====
              function clearAll() {
                  results = [];
                  filteredResults = [];
                  ipList = [];
                  document.getElementById('ipInput').value = '';
                  updateStats();
                  renderIPs();
                  document.getElementById('outputText').value = '';
                  document.getElementById('statusText').textContent = '已清空';
              }

              // ===== 筛选 =====
              function applyFilter() {
                  const countryFilter = document.getElementById('filterCountry').value.trim().toLowerCase();
                  const portFilter = document.getElementById('filterPort').value.trim();

                  if (!countryFilter && !portFilter) {
                      filteredResults = [...results];
                  } else {
                      filteredResults = results.filter(r => {
                          let match = true;
                          if (countryFilter && !r.country.toLowerCase().includes(countryFilter)) match = false;
                          if (portFilter && r.port !== parseInt(portFilter)) match = false;
                          return match;
                      });
                  }

                  document.getElementById('filterCount').textContent = '显示 ' + filteredResults.length + ' 个';
                  renderIPs();
              }

              // ===== 更新统计 =====
              function updateStats() {
                  document.getElementById('totalCount').textContent = ipList.length || 0;
                  document.getElementById('availableCount').textContent = results.length || 0;

                  if (results.length === 0) {
                      document.getElementById('bestDelay').textContent = '--';
                      document.getElementById('avgDelay').textContent = '--';
                      return;
                  }

                  const delays = results.map(r => r.delay);
                  const best = Math.min(...delays);
                  const avg = delays.reduce((a, b) => a + b, 0) / delays.length;
                  document.getElementById('bestDelay').textContent = best.toFixed(0) + 'ms';
                  document.getElementById('avgDelay').textContent = avg.toFixed(0) + 'ms';
              }

              // ===== 渲染IP列表 =====
              function renderIPs() {
                  const container = document.getElementById('ipList');
                  const list = filteredResults.length > 0 ? filteredResults : results;

                  if (list.length === 0) {
                      container.innerHTML = '<div class="empty">' + (results.length > 0 ? '没有匹配的IP' : '暂无数据，请导入IP并开始扫描') + '</div>';
                      document.getElementById('ipCountLabel').textContent = '';
                      return;
                  }

                  document.getElementById('ipCountLabel').textContent = '(' + list.length + ' 个)';

                  container.innerHTML = list.map((r, i) => {
                      let delayClass = 'delay-fast';
                      if (r.delay >= 100) delayClass = 'delay-slow';
                      else if (r.delay >= 50) delayClass = 'delay-mid';

                      const country = r.country || '未知';
                      const colo = r.colo ? '🏢' + r.colo : '';

                      return '<div class="ip-item">' +
                          '<span class="ip">' + r.ip + ':' + r.port + '</span>' +
                          '<span class="delay ' + delayClass + '">' + r.delay.toFixed(0) + 'ms</span>' +
                          '<span class="info">' + country + ' ' + colo + '</span>' +
                          '</div>';
                  }).join('');
              }

              // ===== 更新输出 =====
              function updateOutput() {
                  const text = results.map(r => r.ip + ':' + r.port + '  [' + r.delay.toFixed(0) + 'ms]  ' + r.country + '  ' + r.colo).join('\n');
                  document.getElementById('outputText').value = text || '暂无数据';
              }

              // ===== 复制输出 =====
              function copyOutput() {
                  const text = document.getElementById('outputText').value;
                  if (text) {
                      navigator.clipboard.writeText(text).then(() => {
                          document.getElementById('statusText').textContent = '✅ 已复制输出';
                      });
                  }
              }

              // ===== 导出IP =====
              function exportIPs() {
                  const list = filteredResults.length > 0 ? filteredResults : results;
                  const text = list.map(r => r.ip + ':' + r.port).join('\n');
                  if (text) {
                      document.getElementById('outputText').value = text;
                      navigator.clipboard.writeText(text).then(() => {
                          document.getElementById('statusText').textContent = '✅ 已导出 ' + list.length + ' 个IP';
                      });
                  }
              }

              // ===== 复制详情 =====
              function copyDetails() {
                  const list = filteredResults.length > 0 ? filteredResults : results;
                  const text = list.map(r => r.ip + ':' + r.port + '  [' + r.delay.toFixed(0) + 'ms]  ' + r.country + '  ' + r.colo).join('\n');
                  if (text) {
                      navigator.clipboard.writeText(text).then(() => {
                          document.getElementById('statusText').textContent = '✅ 已复制详情';
                      });
                  }
              }

              // ===== 初始化 =====
              detectISP();
              setTimeout(importIPs, 200);

              // 监听输入变化自动导入
              document.getElementById('ipInput').addEventListener('change', importIPs);
          </script>

          </body>
          </html>
          EOF

      - name: Package as Web App
        run: |
          mkdir -p Payload/CloudFlareScan.app
          cp CloudFlareScan/index.html Payload/CloudFlareScan.app/

          cat > Payload/CloudFlareScan.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>index.html</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP筛选</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
          retention-days: 30
