name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install macOS System Dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config cmake ldid

      - name: Install Kivy-iOS and Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0.0"
          pip install kivy-ios

      - name: Restore Kivy-iOS Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kivy-ios
            dist
          key: ${{ runner.os }}-kivy-ios-v11-${{ hashFiles('**/main.py') }}
          restore-keys: |
            ${{ runner.os }}-kivy-ios-v11-

      - name: Build Kivy-iOS Recipes
        run: |
          toolchain build python3 kivy openssl

      - name: Prepare Clean Source & Create Xcode Project
        run: |
          # 独立导出 app_src，彻底切断 rsync 的死循环与打包超大垃圾文件
          rm -rf app_src cloudflarescan-ios
          mkdir -p app_src
          cp main.py app_src/

          toolchain create "cloudflarescan" "$PWD/app_src"

      - name: Build Xcode Project
        run: |
          cd cloudflarescan-ios
          xcodebuild -project cloudflarescan.xcodeproj \
            -scheme cloudflarescan \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -R cloudflarescan-ios/build/Release-iphoneos/*.app Payload/
          APP_NAME=$(ls Payload/)
          ldid -S "Payload/$APP_NAME/cloudflarescan" || ldid -S "Payload/$APP_NAME/${APP_NAME%.app}"
          zip -r CloudflareScan-iOS-TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudflareScan-iOS-TrollStore
          path: CloudflareScan-iOS-TrollStore.ipa
          retention-days: 7
