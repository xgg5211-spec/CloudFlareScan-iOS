// MARK: - 控制区
struct ControlView: View {
    let isScanning: Bool
    @Binding var selectedPort: Int
    @Binding var selectedDelayType: DelayType
    let ports: [Int]
    let onStart: () -> Void
    let onStop: () -> Void
    let onCopy: () -> Void
    let onCopyDelay: () -> Void
    let onCopyConfig: () -> Void
    let onCopyAll: () -> Void
    let onExportCSV: () -> Void
    @Binding var customIPInput: String
    let totalIPs: Int
    
    var body: some View {
        VStack(spacing: 6) {
            HStack(spacing: 6) {
                // 端口选择
                Picker("端口", selection: $selectedPort) {
                    ForEach(ports, id: \.self) { port in
                        Text("\(port)").tag(port)
                    }
                }
                .pickerStyle(MenuPickerStyle())
                .frame(width: 60)
                .disabled(isScanning)
                
                // 延迟类型选择
                Picker("延迟", selection: $selectedDelayType) {
                    ForEach(DelayType.allCases, id: \.self) { type in
                        Label(type.rawValue, systemImage: type.icon).tag(type)
                    }
                }
                .pickerStyle(MenuPickerStyle())
                .frame(width: 80)
                .disabled(isScanning)
                
                if isScanning {
                    Button(action: onStop) {
                        Image(systemName: "stop.fill")
                            .frame(maxWidth: .infinity)
                    }
                    .buttonStyle(.borderedProminent)
                    .tint(.red)
                } else {
                    Button(action: onStart) {
                        Image(systemName: "play.fill")
                            .frame(maxWidth: .infinity)
                    }
                    .buttonStyle(.borderedProminent)
                    .tint(.blue)
                }
                
                // 复制菜单
                Menu {
                    Button(action: onCopy) {
                        Label("复制前10个IP", systemImage: "list.bullet")
                    }
                    Button(action: onCopyDelay) {
                        Label("复制IP+延迟", systemImage: "clock")
                    }
                    Button(action: onCopyConfig) {
                        Label("复制配置信息", systemImage: "doc.text")
                    }
                    Button(action: onCopyAll) {
                        Label("复制全部IP", systemImage: "doc.on.doc.fill")
                    }
                    Button(action: onExportCSV) {
                        Label("导出CSV", systemImage: "tablecells")
                    }
                } label: {
                    Image(systemName: "doc.on.doc")
                        .font(.title3)
                }
                .disabled(isScanning)
            }
            
            // 自定义IP输入
            VStack(alignment: .leading, spacing: 2) {
                HStack {
                    Image(systemName: "plus.circle")
                        .foregroundColor(.blue)
                        .font(.caption)
                    Text("自定义IP（每行一个）")
                        .font(.caption2)
                        .foregroundColor(.secondary)
                    Spacer()
                    let count = customIPInput.split(separator: "\n").count
                    if count > 0 {
                        Text("\(count)个")
                            .font(.caption2)
                            .foregroundColor(.blue)
                    }
                    if !customIPInput.isEmpty {
                        Button("清空") {
                            customIPInput = ""
                        }
                        .font(.caption2)
                        .foregroundColor(.red)
                    }
                }
                
                TextEditor(text: $customIPInput)
                    .frame(minHeight: 30, maxHeight: 60)
                    .font(.system(.caption2, design: .monospaced))
                    .background(Color(.systemGray6))
                    .cornerRadius(4)
                    .disabled(isScanning)
                    .overlay(
                        RoundedRectangle(cornerRadius: 4)
                            .stroke(Color.gray.opacity(0.2), lineWidth: 0.5)
                    )
            }
        }
        .padding(.horizontal, 8)
        .padding(.vertical, 6)
        .background(Color(.systemBackground))
    }
}

// MARK: - 结果列表
struct ResultListView: View {
    let ipList: [IPDetailInfo]
    let totalCount: Int
    let currentPage: Int
    let pageSize: Int
    let onLoadMore: () -> Void
    let onRefresh: () -> Void
    
    var body: some View {
        List {
            if ipList.isEmpty && totalCount == 0 {
                HStack {
                    Spacer()
                    VStack(spacing: 6) {
                        Image(systemName: "wifi.slash")
                            .font(.largeTitle)
                            .foregroundColor(.gray)
                        Text("暂无数据，开始扫描")
                            .font(.caption)
                            .foregroundColor(.gray)
                        Text("支持上万IP不卡顿")
                            .font(.caption2)
                            .foregroundColor(.gray)
                        Text("支持ICMP/TCP/TLS/HTTP多延迟检测")
                            .font(.caption2)
                            .foregroundColor(.gray)
                    }
                    .padding(.vertical, 30)
                    Spacer()
                }
            } else {
                ForEach(Array(ipList.enumerated()), id: \.element.id) { index, ip in
                    IPRowView(ip: ip, index: index + currentPage * pageSize + 1)
                }
                
                if ipList.count < totalCount {
                    HStack {
                        Spacer()
                        Button("加载更多 (\(ipList.count)/\(totalCount))") {
