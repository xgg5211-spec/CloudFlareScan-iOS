name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create iOS Project
        run: |
          # 创建项目目录
          mkdir -p CloudFlareScan
          mkdir -p CloudFlareScan.xcodeproj
          mkdir -p CloudFlareScan/Assets.xcassets/AppIcon.appiconset
          mkdir -p CloudFlareScan/Assets.xcassets/AccentColor.colorset

          # Info.plist
          cat > CloudFlareScan/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP筛选</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          # Assets
          cat > CloudFlareScan/Assets.xcassets/Contents.json << 'EOF'
          {"info":{"author":"xcode","version":1}}
          EOF
          cat > CloudFlareScan/Assets.xcassets/AppIcon.appiconset/Contents.json << 'EOF'
          {
            "images": [
              {
                "size": "20x20",
                "idiom": "iphone",
                "scale": "2x",
                "filename": "icon.png"
              },
              {
                "size": "20x20",
                "idiom": "iphone",
                "scale": "3x",
                "filename": "icon.png"
              },
              {
                "size": "29x29",
                "idiom": "iphone",
                "scale": "2x",
                "filename": "icon.png"
              },
              {
                "size": "29x29",
                "idiom": "iphone",
                "scale": "3x",
                "filename": "icon.png"
              },
              {
                "size": "40x40",
                "idiom": "iphone",
                "scale": "2x",
                "filename": "icon.png"
              },
              {
                "size": "40x40",
                "idiom": "iphone",
                "scale": "3x",
                "filename": "icon.png"
              },
              {
                "size": "60x60",
                "idiom": "iphone",
                "scale": "2x",
                "filename": "icon.png"
              },
              {
                "size": "60x60",
                "idiom": "iphone",
                "scale": "3x",
                "filename": "icon.png"
              },
              {
                "size": "1024x1024",
                "idiom": "ios-marketing",
                "scale": "1x",
                "filename": "icon.png"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

          # 生成一个简单的图标（1x1像素PNG）
          cat > CloudFlareScan/Assets.xcassets/AppIcon.appiconset/icon.png << 'EOF'
          iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
          EOF
          # base64解码为PNG
          base64 -d > CloudFlareScan/Assets.xcassets/AppIcon.appiconset/icon.png << 'EOF'
          iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
          EOF

          cat > CloudFlareScan/Assets.xcassets/AccentColor.colorset/Contents.json << 'EOF'
          {
            "colors": [
              {
                "idiom": "universal"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

      - name: Create Source Files
        run: |
          # AppDelegate.swift
          cat > CloudFlareScan/AppDelegate.swift << 'EOF'
          import UIKit
          import SwiftUI

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = UIHostingController(rootView: ContentView())
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # ContentView.swift - 最简可用版本
          cat > CloudFlareScan/ContentView.swift << 'EOF'
          import SwiftUI

          struct IPItem: Identifiable {
              let id = UUID()
              var ip: String
              var port: Int
              var delay: Double
              var country: String
              var colo: String
          }

          class ScanManager: ObservableObject {
              @Published var ipList: [IPItem] = []
              @Published var results: [IPItem] = []
              @Published var isScanning = false
              @Published var statusText = "就绪"
              @Published var availableCount = 0
              @Published var bestDelay: Double = 0
              @Published var detectedISP: String = "检测中..."
              @Published var inputText: String = ""

              func detectISP() {
                  guard let url = URL(string: "http://ip-api.com/json/?fields=isp") else { return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data else { return }
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         let isp = json["isp"] as? String {
                          DispatchQueue.main.async {
                              self.detectedISP = isp
                          }
                      }
                  }.resume()
              }

              func importIPs() {
                  let lines = inputText.split(separator: "\n").map { String($0).trimmingCharacters(in: .whitespaces) }
                  var list: [IPItem] = []
                  for line in lines {
                      if line.isEmpty { continue }
                      let parts = line.split(separator: ":")
                      let ip = String(parts[0])
                      let port = parts.count > 1 ? Int(parts[1]) ?? 443 : 443
                      if ip.contains(".") {
                          list.append(IPItem(ip: ip, port: port, delay: 0, country: "", colo: ""))
                      }
                  }
                  self.ipList = list
                  self.results = []
                  self.statusText = "已导入 \(list.count) 个IP"
              }

              func startScan() {
                  guard !ipList.isEmpty else {
                      statusText = "请先导入IP"
                      return
                  }

                  isScanning = true
                  statusText = "扫描中..."
                  results = []
                  availableCount = 0
                  bestDelay = 0

                  let ips = ipList
                  var allResults: [IPItem] = []
                  let lock = NSLock()
                  let group = DispatchGroup()
                  let semaphore = DispatchSemaphore(value: 50)

                  for ip in ips {
                      group.enter()
                      semaphore.wait()
                      DispatchQueue.global().async {
                          self.checkIP(ip: ip, completion: { result in
                              lock.lock()
                              if let r = result {
                                  allResults.append(r)
                              }
                              lock.unlock()
                              semaphore.signal()
                              group.leave()

                              DispatchQueue.main.async {
                                  self.results = allResults
                                  self.availableCount = allResults.count
                                  if !allResults.isEmpty {
                                      self.bestDelay = allResults.map { $0.delay }.min() ?? 0
                                  }
                                  self.statusText = "已找到 \(allResults.count) 个"
                              }
                          })
                      }
                  }

                  group.notify(queue: .main) {
                      self.isScanning = false
                      self.statusText = "✅ 完成！共 \(allResults.count) 个可用IP"
                  }
              }

              func checkIP(ip: IPItem, completion: @escaping (IPItem?) -> Void) {
                  let urlString = "https://\(ip.ip):443/cdn-cgi/trace"
                  guard let url = URL(string: urlString) else {
                      completion(nil)
                      return
                  }

                  let start = Date()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = 3
                  let session = URLSession(configuration: config)

                  session.dataTask(with: url) { data, response, _ in
                      guard let data = data, let http = response as? HTTPURLResponse, http.statusCode == 200 else {
                          completion(nil)
                          return
                      }

                      let delay = Date().timeIntervalSince(start) * 1000
                      let text = String(data: data, encoding: .utf8) ?? ""
                      var colo = ""
                      for line in text.split(separator: "\n") {
                          if line.hasPrefix("colo=") {
                              colo = String(line.dropFirst(5))
                              break
                          }
                      }

                      var result = ip
                      result.delay = delay
                      result.colo = colo

                      // 获取地区
                      let locationURL = URL(string: "http://ip-api.com/json/\(ip.ip)?fields=country")!
                      URLSession.shared.dataTask(with: locationURL) { locData, _, _ in
                          if let locData = locData,
                             let json = try? JSONSerialization.jsonObject(with: locData) as? [String: Any],
                             let country = json["country"] as? String {
                              result.country = country
                          }
                          completion(result)
                      }.resume()
                  }.resume()
              }

              func copyResults() {
                  let text = results.map { "\($0.ip):443" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }

              func copyDetails() {
                  let text = results.map { "\($0.ip):443  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }
          }

          struct ContentView: View {
              @StateObject private var manager = ScanManager()
              @State private var alertMsg = ""

              var body: some View {
                  ZStack {
                      Color(red: 0.06, green: 0.08, blue: 0.15).ignoresSafeArea()

                      VStack(spacing: 0) {
                          // 标题
                          HStack {
                              Text("🚀 优选IP筛选")
                                  .font(.title2)
                                  .fontWeight(.bold)
                                  .foregroundColor(.white)
                              Spacer()
                              Text(manager.detectedISP)
                                  .font(.caption)
                                  .foregroundColor(.blue)
                          }
                          .padding()

                          // 状态
                          HStack {
                              Text("总数: \(manager.ipList.count)")
                                  .foregroundColor(.gray)
                              Text("可用: \(manager.availableCount)")
                                  .foregroundColor(.green)
                              Text("最佳: \(manager.bestDelay > 0 ? String(format: "%.0fms", manager.bestDelay) : "--")")
                                  .foregroundColor(.orange)
                              Spacer()
                              Text(manager.statusText)
                                  .font(.caption)
                                  .foregroundColor(.gray)
                          }
                          .padding(.horizontal)
                          .padding(.bottom, 8)

                          // 输入
                          TextEditor(text: $manager.inputText)
                              .font(.system(.caption, design: .monospaced))
                              .foregroundColor(.white)
                              .frame(height: 80)
                              .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                              .cornerRadius(8)
                              .padding(.horizontal)
                              .overlay(
                                  RoundedRectangle(cornerRadius: 8)
                                      .stroke(Color.gray.opacity(0.3), lineWidth: 0.5)
                                      .padding(.horizontal)
                              )

                          HStack {
                              Button("📥 导入") {
                                  manager.importIPs()
                              }
                              .buttonStyle(.bordered)
                              .font(.caption)

                              Button("▶ 开始") {
                                  manager.startScan()
                              }
                              .buttonStyle(.borderedProminent)
                              .font(.caption)
                              .disabled(manager.isScanning)

                              Button("⏹ 停止") {
                                  manager.isScanning = false
                                  manager.statusText = "已停止"
                              }
                              .buttonStyle(.bordered)
                              .font(.caption)
                              .disabled(!manager.isScanning)

                              Spacer()

                              Button("📋 复制") {
                                  manager.copyResults()
                                  alertMsg = "已复制"
                              }
                              .buttonStyle(.bordered)
                              .font(.caption)

                              Button("📄 详情") {
                                  manager.copyDetails()
                                  alertMsg = "已复制详情"
                              }
                              .buttonStyle(.bordered)
                              .font(.caption)
                          }
                          .padding(.horizontal)
                          .padding(.vertical, 8)

                          // 结果列表
                          List(manager.results) { ip in
                              HStack {
                                  Text(ip.ip)
                                      .font(.system(.caption, design: .monospaced))
                                      .foregroundColor(.white)
                                  Spacer()
                                  Text("\(String(format: "%.0f", ip.delay))ms")
                                      .font(.caption)
                                      .foregroundColor(ip.delay < 50 ? .green : .orange)
                                  Text(ip.country)
                                      .font(.caption2)
                                      .foregroundColor(.gray)
                                  Text(ip.colo)
                                      .font(.caption2)
                                      .foregroundColor(.blue)
                              }
                          }
                          .listStyle(.plain)
                          .scrollContentBackground(.hidden)
                      }
                  }
                  .alert(alertMsg, isPresented: .constant(!alertMsg.isEmpty)) {
                      Button("确定") { alertMsg = "" }
                  }
                  .onAppear {
                      manager.detectISP()
                      manager.inputText = "1.1.1.1\n8.8.8.8\n9.9.9.9"
                  }
              }
          }
          EOF

      - name: Create Xcode Project
        run: |
          cat > CloudFlareScan.xcodeproj/project.pbxproj << 'EOF'
          // !$*UTF8*$!
          {
              archiveVersion = 1;
              classes = {};
              objectVersion = 56;
              objects = {
                  H100000001 /* AppDelegate.swift in Sources */ = {isa = PBXBuildFile; fileRef = H100000002 /* AppDelegate.swift */; };
                  H100000003 /* ContentView.swift in Sources */ = {isa = PBXBuildFile; fileRef = H100000004 /* ContentView.swift */; };
                  H100000005 /* Assets.xcassets in Resources */ = {isa = PBXBuildFile; fileRef = H100000006 /* Assets.xcassets */; };
                  H100000002 /* AppDelegate.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = AppDelegate.swift; sourceTree = "<group>"; };
                  H100000004 /* ContentView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ContentView.swift; sourceTree = "<group>"; };
                  H100000006 /* Assets.xcassets */ = {isa = PBXFileReference; lastKnownFileType = folder.assetcatalog; path = Assets.xcassets; sourceTree = "<group>"; };
                  H100000007 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
                  H100000008 /* CloudFlareScan.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = CloudFlareScan.app; sourceTree = BUILT_PRODUCTS_DIR; };
                  H100000009 = {isa = PBXGroup; children = (H100000010, H100000011,); sourceTree = "<group>"; };
                  H100000010 /* CloudFlareScan */ = {isa = PBXGroup; children = (H100000002, H100000004, H100000006, H100000007,); path = CloudFlareScan; sourceTree = "<group>"; };
                  H100000011 /* Products */ = {isa = PBXGroup; children = (H100000008,); name = Products; sourceTree = "<group>"; };
                  H100000012 /* CloudFlareScan */ = {isa = PBXNativeTarget; buildConfigurationList = H100000013; buildPhases = (H100000014, H100000015,); buildRules = (); dependencies = (); name = CloudFlareScan; productName = CloudFlareScan; productReference = H100000008; productType = "com.apple.product-type.application"; };
                  H100000016 /* Project object */ = {isa = PBXProject; attributes = {LastSwiftUpdateCheck = 1500; LastUpgradeCheck = 1500; TargetAttributes = {H100000012 = {CreatedOnToolsVersion = 15.0;};};}; buildConfigurationList = H100000017; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base,); mainGroup = H100000009; productRefGroup = H100000011; projectDirPath = ""; projectRoot = ""; targets = (H100000012,); };
                  H100000015 /* Resources */ = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (H100000005,); runOnlyForDeploymentPostprocessing = 0; };
                  H100000014 /* Sources */ = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (H100000001, H100000003,); runOnlyForDeploymentPostprocessing = 0; };
                  H100000018 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 15.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Debug; };
                  H100000019 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 15.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Release; };
                  H100000020 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGN_STYLE = Manual; CURRENT_PROJECT_VERSION = 1; DEVELOPMENT_TEAM = ""; INFOPLIST_FILE = CloudFlareScan/Info.plist; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.cloudflarescan.ios; PRODUCT_NAME = CloudFlareScan; SWIFT_VERSION = 5.0; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Debug; };
                  H100000021 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGN_STYLE = Manual; CURRENT_PROJECT_VERSION = 1; DEVELOPMENT_TEAM = ""; INFOPLIST_FILE = CloudFlareScan/Info.plist; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.cloudflarescan.ios; PRODUCT_NAME = CloudFlareScan; SWIFT_VERSION = 5.0; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Release; };
                  H100000013 = {isa = XCConfigurationList; buildConfigurations = (H100000020, H100000021,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
                  H100000017 = {isa = XCConfigurationList; buildConfigurations = (H100000018, H100000019,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
              };
              rootObject = H100000016;
          }
          EOF

      - name: Build App
        run: |
          xcodebuild -project CloudFlareScan.xcodeproj \
            -scheme CloudFlareScan \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -quiet

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到 .app 文件"
            ls -la build/
            exit 1
          fi

          echo "✅ 找到: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa
          ls -la *.ipa *.tipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
          retention-days: 30
