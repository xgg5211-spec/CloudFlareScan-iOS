// MARK: - 延迟类型枚举
enum DelayType: String, Codable, CaseIterable {
    case icmp = "ICMP Ping"
    case tcp = "TCP连接"
    case tls = "TLS握手"
    case http = "HTTP响应"
    case full = "完整请求"
    
    var icon: String {
        switch self {
        case .icmp: return "network"
        case .tcp: return "arrow.triangle.2.circlepath"
        case .tls: return "lock.shield"
        case .http: return "globe"
        case .full: return "checkmark.circle"
        }
    }
    
    var description: String {
        switch self {
        case .icmp: return "ICMP Echo"
        case .tcp: return "TCP 三次握手"
        case .tls: return "TLS 1.3 握手"
        case .http: return "HTTP 请求"
        case .full: return "完整链路"
        }
    }
}

// MARK: - IP详细信息模型
struct IPDetailInfo: Identifiable, Codable, Sendable {
    let id = UUID()
    var ip: String
    var port: Int
    var location: String
    var isp: String
    var colo: String
    var city: String
    var country: String
    var region: String
    var timezone: String
    var org: String
    var asn: String
    
    // 各种延迟（毫秒）
    var icmpDelay: Double = -1
    var tcpDelay: Double = -1
    var tlsDelay: Double = -1
    var httpDelay: Double = -1
    var fullDelay: Double = -1
    
    var isAvailable: Bool {
        return fullDelay > 0 || httpDelay > 0 || tlsDelay > 0 || tcpDelay > 0
    }
    
    var bestDelay: Double {
        let delays = [fullDelay, httpDelay, tlsDelay, tcpDelay, icmpDelay].filter { $0 > 0 }
        return delays.min() ?? -1
    }
    
    var delayType: DelayType {
        if fullDelay > 0 { return .full }
        if httpDelay > 0 { return .http }
        if tlsDelay > 0 { return .tls }
        if tcpDelay > 0 { return .tcp }
        if icmpDelay > 0 { return .icmp }
        return .icmp
    }
    
    var quality: String {
        let delay = bestDelay
        switch delay {
        case ..<50: return "🏆 优秀"
        case ..<100: return "👍 良好"
        case ..<200: return "📶 一般"
        case ..<500: return "🐢 较差"
        default: return "❌ 不可用"
        }
    }
    
    var qualityColor: Color {
        let delay = bestDelay
        switch delay {
        case ..<50: return .green
        case ..<100: return .blue
        case ..<200: return .orange
        case ..<500: return .red
        default: return .gray
        }
    }
}

// MARK: - 高性能网络管理器
class NetworkManager: ObservableObject {
    @Published var ipList: [IPDetailInfo] = []
    @Published var filteredIPs: [IPDetailInfo] = []
    @Published var isScanning = false
    @Published var progress = 0.0
    @Published var currentIP = ""
    @Published var scanLog = ""
    @Published var totalIPs = 0
    @Published var availableCount = 0
    @Published var selectedDelayType: DelayType = .full
    
    // 统计信息
    @Published var avgDelay: Double = 0
    @Published var minDelay: Double = 0
    @Published var maxDelay: Double = 0
    @Published var scanSpeed: Double = 0 // IP/秒
    
    // 分页相关
