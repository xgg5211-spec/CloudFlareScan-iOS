name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
    inputs:
      custom_ips:
        description: '自定义IP列表（每行一个，留空则自动生成）'
        required: false
        default: ''
        type: string
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create Xcode Project
        run: |
          mkdir -p CloudFlareScan
          mkdir -p CloudFlareScan.xcodeproj
          mkdir -p CloudFlareScan/Assets.xcassets/AppIcon.appiconset

          # ========== Info.plist ==========
          cat > CloudFlareScan/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP筛选</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          # ========== AppDelegate.swift ==========
          cat > CloudFlareScan/AppDelegate.swift << 'EOF'
          import UIKit
          import SwiftUI

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = UIHostingController(rootView: ContentView())
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # ========== ContentView.swift（简化稳定版，功能完整） ==========
          cat > CloudFlareScan/ContentView.swift << 'EOF'
          import SwiftUI
          import UniformTypeIdentifiers
          import Network

          // MARK: - 颜色主题
          struct TechColors {
              static let background = Color(red: 0.06, green: 0.08, blue: 0.15)
              static let cardBackground = Color(red: 0.10, green: 0.13, blue: 0.22)
              static let accent = Color(red: 0.0, green: 0.78, blue: 0.98)
              static let text = Color(red: 0.92, green: 0.95, blue: 1.0)
              static let textSecondary = Color(red: 0.5, green: 0.6, blue: 0.8)
              static let border = Color(red: 0.15, green: 0.25, blue: 0.4)
              static let success = Color(red: 0.0, green: 0.9, blue: 0.5)
              static let warning = Color(red: 1.0, green: 0.7, blue: 0.0)
              static let danger = Color(red: 1.0, green: 0.3, blue: 0.3)
          }

          // MARK: - IP信息模型
          struct IPInfo: Identifiable {
              let id = UUID()
              var ip: String
              var port: Int
              var delay: Double = -1
              var country: String = ""
              var city: String = ""
              var isp: String = ""
              var colo: String = ""
              var region: String = ""
              var isAvailable: Bool = false

              var quality: String {
                  let d = delay
                  switch d {
                  case ..<30: return "🏆极速"
                  case ..<60: return "⭐优秀"
                  case ..<100: return "👍良好"
                  case ..<200: return "📶一般"
                  default: return "🐢较慢"
                  }
              }

              var qualityColor: Color {
                  let d = delay
                  switch d {
                  case ..<30: return .purple
                  case ..<60: return TechColors.success
                  case ..<100: return .blue
                  case ..<200: return TechColors.warning
                  default: return TechColors.danger
                  }
              }

              var displayText: String {
                  "\(ip):\(port)  [\(String(format: "%.0f", delay))ms] \(country) \(colo)"
              }
          }

          // MARK: - 地区列表
          let allRegions = ["全部地区", "东亚", "东南亚", "欧洲", "北美", "南美", "非洲", "大洋洲", "中国", "美国", "日本", "韩国", "新加坡", "德国", "英国", "法国", "荷兰"]

          // MARK: - 运营商列表
          let ispList = ["自动识别", "联通", "电信", "移动", "广电", "其他"]

          // MARK: - 主视图
          struct ContentView: View {
              @StateObject private var viewModel = ScanViewModel()

              var body: some View {
                  ZStack {
                      TechColors.background.ignoresSafeArea()

                      ScrollView {
                          VStack(spacing: 14) {
                              // 顶部标题
                              HStack {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("🚀 优选IP筛选工具")
                                          .font(.title3)
                                          .fontWeight(.bold)
                                          .foregroundColor(TechColors.text)
                                      Text("CloudFlare 智能优选 · 极速扫描")
                                          .font(.caption2)
                                          .foregroundColor(TechColors.textSecondary)
                                  }
                                  Spacer()
                                  if viewModel.isScanning {
                                      ProgressView().scaleEffect(0.7)
                                  }
                              }
                              .padding(.horizontal, 14)
                              .padding(.top, 8)

                              // 状态概览
                              HStack(spacing: 8) {
                                  StatusItem(label: "总数", value: "\(viewModel.ipList.count)")
                                  StatusItem(label: "可用", value: "\(viewModel.availableCount)", color: TechColors.success)
                                  StatusItem(label: "最佳", value: viewModel.minDelay > 0 ? String(format: "%.0fms", viewModel.minDelay) : "--", color: TechColors.warning)
                                  StatusItem(label: "平均", value: viewModel.avgDelay > 0 ? String(format: "%.0fms", viewModel.avgDelay) : "--", color: .blue)
                              }
                              .padding(10)
                              .background(TechColors.cardBackground)
                              .cornerRadius(10)

                              // 1. 选择文件
                              VStack(alignment: .leading, spacing: 8) {
                                  Text("📂 选择文件")
                                      .font(.headline)
                                      .foregroundColor(TechColors.text)

                                  HStack(spacing: 10) {
                                      Button {
                                          viewModel.showingFileImporter = true
                                      } label: {
                                          Label("文件夹导入", systemImage: "folder")
                                              .font(.caption)
                                              .padding(.horizontal, 12)
                                              .padding(.vertical, 6)
                                              .background(TechColors.accent.opacity(0.15))
                                              .foregroundColor(TechColors.accent)
                                              .cornerRadius(6)
                                      }
                                      .fileImporter(
                                          isPresented: $viewModel.showingFileImporter,
                                          allowedContentTypes: [.plainText, .text]
                                      ) { result in
                                          viewModel.importFile(result: result)
                                      }

                                      Button {
                                          viewModel.showingPasteSheet = true
                                      } label: {
                                          Label("粘贴导入", systemImage: "doc.on.clipboard")
                                              .font(.caption)
                                              .padding(.horizontal, 12)
                                              .padding(.vertical, 6)
                                              .background(TechColors.success.opacity(0.15))
                                              .foregroundColor(TechColors.success)
                                              .cornerRadius(6)
                                      }
                                      .sheet(isPresented: $viewModel.showingPasteSheet) {
                                          PasteImportView(viewModel: viewModel)
                                      }

                                      Spacer()

                                      Text(viewModel.ipSourceText.isEmpty ? "尚未导入文件" : viewModel.ipSourceText)
                                          .font(.caption)
                                          .foregroundColor(viewModel.ipSourceText.isEmpty ? TechColors.textSecondary : TechColors.success)
                                  }
                              }
                              .padding(12)
                              .background(TechColors.cardBackground)
                              .cornerRadius(10)

                              // 2. 扫描设置
                              VStack(alignment: .leading, spacing: 8) {
                                  Text("⚙️ 扫描设置")
                                      .font(.headline)
                                      .foregroundColor(TechColors.text)

                                  VStack(spacing: 6) {
                                      HStack {
                                          Text("扫描数量")
                                              .font(.caption)
                                              .foregroundColor(TechColors.textSecondary)
                                          TextField("留空=全部", text: $viewModel.scanCount)
                                              .textFieldStyle(PlainTextFieldStyle())
                                              .font(.caption)
                                              .foregroundColor(TechColors.text)
                                              .frame(width: 80)
                                              .padding(.horizontal, 6)
                                              .padding(.vertical, 3)
                                              .background(TechColors.background)
                                              .cornerRadius(4)

                                          Spacer()

                                          Text("端口筛选")
                                              .font(.caption)
                                              .foregroundColor(TechColors.textSecondary)
                                          TextField("443,2053,8443", text: $viewModel.portsInput)
                                              .textFieldStyle(PlainTextFieldStyle())
                                              .font(.caption)
                                              .foregroundColor(TechColors.text)
                                              .frame(width: 110)
                                              .padding(.horizontal, 6)
                                              .padding(.vertical, 3)
                                              .background(TechColors.background)
                                              .cornerRadius(4)
                                      }

                                      HStack {
                                          Text("线程数")
                                              .font(.caption)
                                              .foregroundColor(TechColors.textSecondary)
                                          TextField("200", value: $viewModel.threadCount, format: .number)
                                              .textFieldStyle(PlainTextFieldStyle())
                                              .font(.caption)
                                              .foregroundColor(TechColors.text)
                                              .frame(width: 50)
                                              .padding(.horizontal, 6)
                                              .padding(.vertical, 3)
                                              .background(TechColors.background)
                                              .cornerRadius(4)

                                          Spacer()

                                          Text("超时(秒)")
                                              .font(.caption)
                                              .foregroundColor(TechColors.textSecondary)
                                          TextField("3", value: $viewModel.timeout, format: .number)
                                              .textFieldStyle(PlainTextFieldStyle())
                                              .font(.caption)
                                              .foregroundColor(TechColors.text)
                                              .frame(width: 40)
                                              .padding(.horizontal, 6)
                                              .padding(.vertical, 3)
                                              .background(TechColors.background)
                                              .cornerRadius(4)

                                          Spacer()

                                          Text("SNI域名")
                                              .font(.caption)
                                              .foregroundColor(TechColors.textSecondary)
                                          TextField("speed.cloudflare.com", text: $viewModel.sniDomain)
                                              .textFieldStyle(PlainTextFieldStyle())
                                              .font(.caption)
                                              .foregroundColor(TechColors.text)
                                              .frame(width: 130)
                                              .padding(.horizontal, 6)
                                              .padding(.vertical, 3)
                                              .background(TechColors.background)
                                              .cornerRadius(4)
                                      }

                                      HStack {
                                          Text("运营商")
                                              .font(.caption)
                                              .foregroundColor(TechColors.textSecondary)

                                          Picker("", selection: $viewModel.selectedISP) {
                                              ForEach(ispList, id: \.self) { isp in
                                                  Text(isp).tag(isp)
                                              }
                                          }
                                          .pickerStyle(MenuPickerStyle())
                                          .frame(width: 100)
                                          .tint(TechColors.accent)

                                          if viewModel.selectedISP == "自动识别" {
                                              Text("📍 \(viewModel.detectedISP)")
                                                  .font(.caption)
                                                  .foregroundColor(TechColors.accent)
                                          }

                                          Spacer()

                                          Text("当前: \(viewModel.currentISP)")
                                              .font(.caption)
                                              .foregroundColor(TechColors.success)
                                      }
                                  }
                              }
                              .padding(12)
                              .background(TechColors.cardBackground)
                              .cornerRadius(10)

                              // 3. 严格模式 + 地区
                              VStack(alignment: .leading, spacing: 8) {
                                  HStack {
                                      Text("🔒 严格模式 (TLS握手)")
                                          .font(.headline)
                                          .foregroundColor(TechColors.text)
                                      Spacer()
                                      Toggle("", isOn: $viewModel.strictMode)
                                          .labelsHidden()
                                          .tint(TechColors.accent)
                                  }

                                  Text("只扫描指定地区：")
                                      .font(.caption)
                                      .foregroundColor(TechColors.textSecondary)

                                  Text("不勾选任何地区 = 扫描全部地区")
                                      .font(.caption2)
                                      .foregroundColor(TechColors.warning)

                                  ScrollView(.horizontal, showsIndicators: false) {
                                      HStack(spacing: 6) {
                                          ForEach(allRegions, id: \.self) { region in
                                              Button {
                                                  viewModel.toggleRegion(region)
                                              } label: {
                                                  Text(region)
                                                      .font(.caption)
                                                      .padding(.horizontal, 10)
                                                      .padding(.vertical, 4)
                                                      .background(viewModel.selectedRegions.contains(region) ? TechColors.accent : TechColors.background)
                                                      .foregroundColor(viewModel.selectedRegions.contains(region) ? .white : TechColors.textSecondary)
                                                      .cornerRadius(12)
                                              }
                                          }
                                      }
                                  }

                                  HStack {
                                      Button {
                                          viewModel.startScan()
                                      } label: {
                                          Label(viewModel.isScanning ? "扫描中..." : "开始扫描", systemImage: "play.fill")
                                              .font(.caption)
                                              .padding(.horizontal, 16)
                                              .padding(.vertical, 6)
                                              .background(TechColors.accent)
                                              .foregroundColor(.white)
                                              .cornerRadius(6)
                                      }
                                      .disabled(viewModel.isScanning || viewModel.ipList.isEmpty)

                                      Button {
                                          viewModel.stopScan()
                                      } label: {
                                          Label("停止", systemImage: "stop.fill")
                                              .font(.caption)
                                              .padding(.horizontal, 16)
                                              .padding(.vertical, 6)
                                              .background(Color.red)
                                              .foregroundColor(.white)
                                              .cornerRadius(6)
                                      }
                                      .disabled(!viewModel.isScanning)

                                      Spacer()

                                      HStack(spacing: 4) {
                                          Circle()
                                              .fill(viewModel.isScanning ? TechColors.success : Color.gray)
                                              .frame(width: 6, height: 6)
                                          Text(viewModel.statusText)
                                              .font(.caption)
                                              .foregroundColor(TechColors.textSecondary)
                                      }
                                  }
                              }
                              .padding(12)
                              .background(TechColors.cardBackground)
                              .cornerRadius(10)

                              // 4. 可用IP列表
                              VStack(alignment: .leading, spacing: 8) {
                                  Text("📋 可用IP（仅显示可连接的IP）")
                                      .font(.headline)
                                      .foregroundColor(TechColors.text)

                                  HStack {
                                      Text("地区筛选")
                                          .font(.caption)
                                          .foregroundColor(TechColors.textSecondary)
                                      TextField("输入地区", text: $viewModel.regionFilter)
                                          .textFieldStyle(PlainTextFieldStyle())
                                          .font(.caption)
                                          .foregroundColor(TechColors.text)
                                          .frame(width: 100)
                                          .padding(.horizontal, 6)
                                          .padding(.vertical, 3)
                                          .background(TechColors.background)
                                          .cornerRadius(4)
                                          .onChange(of: viewModel.regionFilter) { _ in viewModel.updateFilter() }

                                      Spacer()

                                      Text("端口筛选")
                                          .font(.caption)
                                          .foregroundColor(TechColors.textSecondary)
                                      TextField("输入端口", text: $viewModel.portFilter)
                                          .textFieldStyle(PlainTextFieldStyle())
                                          .font(.caption)
                                          .foregroundColor(TechColors.text)
                                          .frame(width: 70)
                                          .padding(.horizontal, 6)
                                          .padding(.vertical, 3)
                                          .background(TechColors.background)
                                          .cornerRadius(4)
                                          .onChange(of: viewModel.portFilter) { _ in viewModel.updateFilter() }

                                      Spacer()

                                      Text("共 \(viewModel.filteredIPs.count) 个")
                                          .font(.caption)
                                          .foregroundColor(TechColors.accent)
                                  }

                                  if viewModel.filteredIPs.isEmpty {
                                      Text(viewModel.isScanning ? "扫描中，请稍候..." : "暂无数据")
                                          .font(.caption)
                                          .foregroundColor(TechColors.textSecondary)
                                          .frame(maxWidth: .infinity, alignment: .center)
                                          .padding(.vertical, 16)
                                  } else {
                                      ScrollView {
                                          LazyVStack(alignment: .leading, spacing: 3) {
                                              ForEach(viewModel.filteredIPs) { ip in
                                                  HStack {
                                                      Text(ip.ip)
                                                          .font(.system(.caption, design: .monospaced))
                                                          .foregroundColor(TechColors.text)
                                                      Text(":\(ip.port)")
                                                          .font(.caption2)
                                                          .foregroundColor(TechColors.textSecondary)
                                                      Spacer()
                                                      Text("\(String(format: "%.0f", ip.delay))ms")
                                                          .font(.caption)
                                                          .fontWeight(.bold)
                                                          .foregroundColor(ip.qualityColor)
                                                      Text(ip.quality)
                                                          .font(.caption2)
                                                      if !ip.colo.isEmpty {
                                                          Text("🏢\(ip.colo)")
                                                              .font(.caption2)
                                                              .foregroundColor(TechColors.textSecondary)
                                                      }
                                                      Text("📍\(ip.country)")
                                                          .font(.caption2)
                                                          .foregroundColor(TechColors.textSecondary)
                                                  }
                                                  .padding(.vertical, 2)
                                                  .padding(.horizontal, 6)
                                                  .background(TechColors.background.opacity(0.5))
                                                  .cornerRadius(4)
                                              }
                                          }
                                      }
                                      .frame(maxHeight: 150)
                                  }
                              }
                              .padding(12)
                              .background(TechColors.cardBackground)
                              .cornerRadius(10)

                              // 5. 输出文本
                              VStack(alignment: .leading, spacing: 8) {
                                  Text("📝 输出文本（可编辑/可复制）")
                                      .font(.headline)
                                      .foregroundColor(TechColors.text)

                                  TextEditor(text: $viewModel.outputText)
                                      .font(.system(.caption, design: .monospaced))
                                      .foregroundColor(TechColors.text)
                                      .frame(height: 80)
                                      .background(TechColors.background)
                                      .cornerRadius(6)

                                  HStack {
                                      Button {
                                          UIPasteboard.general.string = viewModel.outputText
                                          viewModel.alertMessage = "✅ 已复制到剪贴板"
                                          viewModel.showingAlert = true
                                      } label: {
                                          Label("复制", systemImage: "doc.on.doc")
                                              .font(.caption)
                                              .padding(.horizontal, 12)
                                              .padding(.vertical, 4)
                                              .background(Color.blue.opacity(0.15))
                                              .foregroundColor(.blue)
                                              .cornerRadius(6)
                                      }
                                      .disabled(viewModel.outputText.isEmpty)

                                      Button {
                                          viewModel.exportIPs()
                                      } label: {
                                          Label("导出可用IP", systemImage: "square.and.arrow.up")
                                              .font(.caption)
                                              .padding(.horizontal, 12)
                                              .padding(.vertical, 4)
                                              .background(TechColors.success.opacity(0.15))
                                              .foregroundColor(TechColors.success)
                                              .cornerRadius(6)
                                      }
                                      .disabled(viewModel.filteredIPs.isEmpty)

                                      Spacer()

                                      if !viewModel.outputText.isEmpty {
                                          Text("\(viewModel.outputText.split(separator: "\n").count) 行")
                                              .font(.caption2)
                                              .foregroundColor(TechColors.textSecondary)
                                      }
                                  }
                              }
                              .padding(12)
                              .background(TechColors.cardBackground)
                              .cornerRadius(10)
                          }
                          .padding(.horizontal, 12)
                          .padding(.bottom, 20)
                      }
                  }
                  .alert("提示", isPresented: $viewModel.showingAlert) {
                      Button("确定") {}
                  } message: {
                      Text(viewModel.alertMessage)
                  }
                  .onAppear {
                      viewModel.detectISP()
                  }
              }
          }

          // MARK: - 状态项
          struct StatusItem: View {
              let label: String
              let value: String
              var color: Color = .blue

              var body: some View {
                  VStack(spacing: 1) {
                      Text(label)
                          .font(.caption2)
                          .foregroundColor(TechColors.textSecondary)
                      Text(value)
                          .font(.subheadline)
                          .fontWeight(.semibold)
                          .foregroundColor(color)
                  }
                  .frame(maxWidth: .infinity)
              }
          }

          // MARK: - 粘贴导入视图
          struct PasteImportView: View {
              @ObservedObject var viewModel: ScanViewModel
              @Environment(\.dismiss) var dismiss
              @State private var pasteText = ""

              var body: some View {
                  ZStack {
                      TechColors.background.ignoresSafeArea()

                      VStack {
                          Text("📋 粘贴导入")
                              .font(.headline)
                              .foregroundColor(TechColors.text)
                              .padding(.top, 20)

                          Text("每行一个IP，支持格式: 1.1.1.1 或 1.1.1.1:443")
                              .font(.caption)
                              .foregroundColor(TechColors.textSecondary)

                          TextEditor(text: $pasteText)
                              .font(.system(.body, design: .monospaced))
                              .foregroundColor(TechColors.text)
                              .background(TechColors.cardBackground)
                              .cornerRadius(8)
                              .padding()
                              .frame(maxHeight: .infinity)

                          HStack(spacing: 16) {
                              Button("取消") {
                                  dismiss()
                              }
                              .buttonStyle(.bordered)

                              Button("导入") {
                                  viewModel.importFromPaste(text: pasteText)
                                  dismiss()
                              }
                              .buttonStyle(.borderedProminent)
                              .disabled(pasteText.isEmpty)
                          }
                          .padding(.bottom, 20)
                      }
                      .padding()
                  }
                  .presentationDetents([.large])
              }
          }

          // MARK: - ViewModel
          class ScanViewModel: ObservableObject {
              @Published var ipList: [IPInfo] = []
              @Published var filteredIPs: [IPInfo] = []
              @Published var isScanning = false
              @Published var statusText = "就绪"
              @Published var outputText = ""
              @Published var availableCount = 0
              @Published var avgDelay: Double = 0
              @Published var minDelay: Double = 0

              @Published var ipSourceText = ""
              @Published var showingFileImporter = false
              @Published var showingPasteSheet = false

              @Published var scanCount = ""
              @Published var portsInput = "443,2053,8443"
              @Published var threadCount = 200
              @Published var timeout = 3
              @Published var sniDomain = "speed.cloudflare.com"
              @Published var selectedISP = "自动识别"

              @Published var detectedISP: String = "检测中..."
              @Published var currentISP: String = "检测中..."

              @Published var strictMode = false
              @Published var selectedRegions: [String] = []

              @Published var regionFilter = ""
              @Published var portFilter = ""

              @Published var showingAlert = false
              @Published var alertMessage = ""

              private var scanTask: Task<Void, Never>?
              private var allIPs: [String] = []

              // MARK: - 自动检测运营商
              func detectISP() {
                  guard let url = URL(string: "http://ip-api.com/json/?fields=isp") else { return }

                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data else { return }
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         let isp = json["isp"] as? String {
                          DispatchQueue.main.async {
                              self.detectedISP = isp
                              self.currentISP = isp
                          }
                      }
                  }.resume()
              }

              // MARK: - 导入文件
              func importFile(result: Result<URL, Error>) {
                  switch result {
                  case .success(let url):
                      guard url.startAccessingSecurityScopedResource() else { return }
                      defer { url.stopAccessingSecurityScopedResource() }

                      do {
                          let text = try String(contentsOf: url, encoding: .utf8)
                          importFromPaste(text: text)
                      } catch {
                          alertMessage = "❌ 导入失败: \(error.localizedDescription)"
                          showingAlert = true
                      }
                  case .failure(let error):
                      alertMessage = "❌ 选择文件失败: \(error.localizedDescription)"
                      showingAlert = true
                  }
              }

              // MARK: - 粘贴导入
              func importFromPaste(text: String) {
                  let lines = text.split(separator: "\n").map { String($0).trimmingCharacters(in: .whitespaces) }
                  var ips: [IPInfo] = []

                  for line in lines {
                      if line.isEmpty { continue }
                      let parts = line.split(separator: ":")
                      let ip = String(parts[0])
                      let port = parts.count > 1 ? Int(parts[1]) ?? 443 : 443

                      if ip.contains(".") || ip.contains(":") {
                          ips.append(IPInfo(ip: ip, port: port))
                      }
                  }

                  ipList = ips
                  filteredIPs = ips
                  ipSourceText = "已导入 \(ips.count) 个IP"
                  outputText = ""
                  alertMessage = "✅ 成功导入 \(ips.count) 个IP"
                  showingAlert = true
              }

              // MARK: - 切换地区
              func toggleRegion(_ region: String) {
                  if region == "全部地区" {
                      selectedRegions = []
                      return
                  }

                  if selectedRegions.contains(region) {
                      selectedRegions.removeAll { $0 == region }
                  } else {
                      selectedRegions.append(region)
                  }
              }

              // MARK: - 开始扫描
              func startScan() {
                  guard !ipList.isEmpty else {
                      alertMessage = "❌ 请先导入IP列表"
                      showingAlert = true
                      return
                  }

                  currentISP = selectedISP == "自动识别" ? detectedISP : selectedISP

                  isScanning = true
                  statusText = "扫描中..."
                  filteredIPs = []
                  outputText = ""
                  availableCount = 0
                  avgDelay = 0
                  minDelay = 0

                  let ips = ipList
                  let ports = parsePorts(portsInput)
                  var results: [IPInfo] = []
                  let lock = NSLock()
                  var processed = 0
                  let total = ips.count * ports.count
                  let currentISPValue = currentISP
                  let selectedRegionsValue = selectedRegions
                  let timeoutValue = timeout

                  scanTask = Task.detached(priority: .high) { [weak self] in
                      guard let self = self else { return }

                      let semaphore = DispatchSemaphore(value: self.threadCount)

                      await withTaskGroup(of: [IPInfo].self) { group in
                          for ip in ips {
                              if Task.isCancelled { break }
                              for port in ports {
                                  if Task.isCancelled { break }
                                  group.addTask {
                                      semaphore.wait()
                                      defer { semaphore.signal() }
                                      return await self.scanIP(ip: ip, port: port, currentISP: currentISPValue, selectedRegions: selectedRegionsValue, timeout: timeoutValue)
                                  }
                              }
                          }

                          for await batch in group {
                              lock.lock()
                              results.append(contentsOf: batch)
                              processed += 1
                              lock.unlock()

                              await MainActor.run {
                                  let available = results.filter { $0.isAvailable }
                                  self.filteredIPs = available
                                  self.availableCount = available.count
                                  self.statusText = "扫描中... \(self.availableCount) 个可用"

                                  let delays = available.map { $0.delay }.filter { $0 > 0 }
                                  if !delays.isEmpty {
                                      self.avgDelay = delays.reduce(0, +) / Double(delays.count)
                                      self.minDelay = delays.min() ?? 0
                                  }
                              }
                          }
                      }

                      await MainActor.run {
                          self.isScanning = false
                          self.ipList = results
                          self.filteredIPs = results.filter { $0.isAvailable }
                          self.availableCount = self.filteredIPs.count
                          self.statusText = "扫描完成 - 共 \(self.availableCount) 个可用IP"
                          self.outputText = self.filteredIPs.map { $0.displayText }.joined(separator: "\n")
                          self.alertMessage = "✅ 扫描完成！找到 \(self.availableCount) 个可用IP"
                          self.showingAlert = true
                      }
                  }
              }

              // MARK: - 扫描单个IP
              private func scanIP(ip: IPInfo, port: Int, currentISP: String, selectedRegions: [String], timeout: Int) async -> [IPInfo] {
                  var result = ip
                  result.port = port

                  let delay = await testHTTP(ip: ip.ip, port: port, timeout: timeout)
                  result.delay = delay.delay
                  result.colo = delay.colo ?? ""
                  result.isAvailable = delay.delay > 0

                  if result.isAvailable {
                      let loc = await getLocation(ip: ip.ip)
                      result.country = loc.country
                      result.city = loc.city
                      result.isp = loc.isp
                      result.region = loc.region

                      // 地区过滤
                      if !selectedRegions.isEmpty && !selectedRegions.contains(loc.region) {
                          return []
                      }

                      // 运营商过滤
                      if currentISP != "检测中..." && currentISP != "检测失败" && !currentISP.isEmpty {
                          let ispMatch = loc.isp.localizedCaseInsensitiveContains(currentISP) ||
                                         currentISP.localizedCaseInsensitiveContains(loc.isp)
                          if !ispMatch && !loc.isp.isEmpty {
                              return []
                          }
                      }
                  }

                  return result.isAvailable ? [result] : []
              }

              // MARK: - HTTP测试
              private func testHTTP(ip: String, port: Int, timeout: Int) async -> (delay: Double, colo: String?) {
                  let urlString = "https://\(ip):\(port)/cdn-cgi/trace"
                  guard let url = URL(string: urlString) else { return (-1, nil) }

                  let start = Date()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = TimeInterval(timeout)
                  config.timeoutIntervalForResource = TimeInterval(timeout)
                  let session = URLSession(configuration: config)

                  do {
                      let (data, response) = try await session.data(from: url)
                      if let httpResponse = response as? HTTPURLResponse, httpResponse.statusCode == 200 {
                          let delay = Date().timeIntervalSince(start) * 1000
                          let text = String(data: data, encoding: .utf8) ?? ""
                          var colo: String?
                          for line in text.split(separator: "\n") {
                              if line.hasPrefix("colo=") {
                                  colo = String(line.dropFirst(5))
                                  break
                              }
                          }
                          return (delay, colo)
                      }
                  } catch {
                      return (-1, nil)
                  }
                  return (-1, nil)
              }

              // MARK: - 获取位置
              private func getLocation(ip: String) async -> (country: String, city: String, isp: String, region: String) {
                  let urlString = "http://ip-api.com/json/\(ip)?fields=status,country,city,isp,regionName"
                  guard let url = URL(string: urlString) else { return ("", "", "", "") }

                  do {
                      let (data, _) = try await URLSession.shared.data(from: url)
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         json["status"] as? String == "success" {
                          return (
                              json["country"] as? String ?? "",
                              json["city"] as? String ?? "",
                              json["isp"] as? String ?? "",
                              json["regionName"] as? String ?? ""
                          )
                      }
                  } catch {
                      return ("", "", "", "")
                  }
                  return ("", "", "", "")
              }

              // MARK: - 停止扫描
              func stopScan() {
                  scanTask?.cancel()
                  isScanning = false
                  statusText = "已停止"
              }

              // MARK: - 解析端口
              private func parsePorts(_ input: String) -> [Int] {
                  let parts = input.split(separator: ",").map { String($0).trimmingCharacters(in: .whitespaces) }
                  return parts.compactMap { Int($0) }.filter { $0 > 0 && $0 < 65536 }
              }

              // MARK: - 导出IP
              func exportIPs() {
                  let text = filteredIPs.map { $0.displayText }.joined(separator: "\n")
                  outputText = text
                  UIPasteboard.general.string = text
                  alertMessage = "✅ 已导出 \(filteredIPs.count) 个IP到剪贴板"
                  showingAlert = true
              }

              // MARK: - 筛选更新
              func updateFilter() {
                  var filtered = ipList.filter { $0.isAvailable }

                  if !regionFilter.isEmpty {
                      filtered = filtered.filter {
                          $0.country.localizedCaseInsensitiveContains(regionFilter) ||
                          $0.region.localizedCaseInsensitiveContains(regionFilter)
                      }
                  }

                  if !portFilter.isEmpty, let port = Int(portFilter) {
                      filtered = filtered.filter { $0.port == port }
                  }

                  filteredIPs = filtered
                  outputText = filtered.map { $0.displayText }.joined(separator: "\n")
              }
          }
