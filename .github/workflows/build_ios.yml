name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
    inputs:
      custom_ips:
        description: '自定义IP列表（每行一个，留空则自动生成）'
        required: false
        default: ''
        type: string
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create Complete Xcode Project
        run: |
          mkdir -p CloudFlareScan
          mkdir -p CloudFlareScan.xcodeproj
          mkdir -p CloudFlareScan/Assets.xcassets/AppIcon.appiconset
          mkdir -p CloudFlareScan/Assets.xcassets/AccentColor.colorset

          # ========== Info.plist ==========
          cat > CloudFlareScan/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP筛选</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          # ========== AppDelegate.swift ==========
          cat > CloudFlareScan/AppDelegate.swift << 'EOF'
          import UIKit
          import SwiftUI

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = UIHostingController(rootView: ContentView())
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # ========== ContentView.swift（完整科技风版本） ==========
          cat > CloudFlareScan/ContentView.swift << 'EOF'
          import SwiftUI
          import UniformTypeIdentifiers
          import Network

          // MARK: - 颜色主题
          struct TechColors {
              static let background = Color(red: 0.06, green: 0.08, blue: 0.15)
              static let cardBackground = Color(red: 0.10, green: 0.13, blue: 0.22)
              static let accent = Color(red: 0.0, green: 0.78, blue: 0.98)
              static let accentGlow = Color(red: 0.0, green: 0.78, blue: 0.98).opacity(0.3)
              static let text = Color(red: 0.92, green: 0.95, blue: 1.0)
              static let textSecondary = Color(red: 0.5, green: 0.6, blue: 0.8)
              static let border = Color(red: 0.15, green: 0.25, blue: 0.4)
              static let success = Color(red: 0.0, green: 0.9, blue: 0.5)
              static let warning = Color(red: 1.0, green: 0.7, blue: 0.0)
              static let danger = Color(red: 1.0, green: 0.3, blue: 0.3)
              static let gradientStart = Color(red: 0.0, green: 0.5, blue: 0.9)
              static let gradientEnd = Color(red: 0.4, green: 0.0, blue: 0.9)
          }

          // MARK: - 数据模型
          struct IPInfo: Identifiable, Codable {
              let id = UUID()
              var ip: String
              var port: Int
              var tcpDelay: Double = -1
              var tlsDelay: Double = -1
              var httpDelay: Double = -1
              var fullDelay: Double = -1
              var country: String = ""
              var city: String = ""
              var isp: String = ""
              var colo: String = ""
              var region: String = ""
              var ipVersion: String = "IPv4"
              var isAvailable: Bool = false

              var bestDelay: Double {
                  [fullDelay, httpDelay, tlsDelay, tcpDelay].filter { $0 > 0 }.min() ?? -1
              }

              var delayType: String {
                  if fullDelay > 0 { return "完整链路" }
                  if httpDelay > 0 { return "HTTP" }
                  if tlsDelay > 0 { return "TLS握手" }
                  if tcpDelay > 0 { return "TCP连接" }
                  return "无"
              }

              var quality: String {
                  let d = bestDelay
                  switch d {
                  case ..<30: return "🏆 极速"
                  case ..<60: return "⭐ 优秀"
                  case ..<100: return "👍 良好"
                  case ..<200: return "📶 一般"
                  default: return "🐢 较慢"
                  }
              }

              var qualityColor: Color {
                  let d = bestDelay
                  switch d {
                  case ..<30: return .purple
                  case ..<60: return TechColors.success
                  case ..<100: return .blue
                  case ..<200: return TechColors.warning
                  default: return TechColors.danger
                  }
              }

              var displayText: String {
                  "\(ip):\(port)  [\(String(format: "%.0f", bestDelay))ms] \(country) \(colo)"
              }
          }

          // MARK: - 地区数据
          let allRegions = ["全部地区", "东亚", "东南亚", "南亚", "西亚", "欧洲", "北美", "南美", "非洲", "大洋洲", "中国", "美国", "日本", "韩国", "新加坡", "德国", "英国", "法国", "荷兰", "加拿大", "澳大利亚", "印度", "巴西", "俄罗斯"]

          // MARK: - 运营商列表
          let ispList = ["自动识别", "联通", "电信", "移动", "广电", "其他"]

          // MARK: - 主视图
          struct ContentView: View {
              @StateObject private var viewModel = ScanViewModel()
              @State private var selectedTab = 0

              var body: some View {
                  ZStack {
                      TechColors.background.ignoresSafeArea()

                      ScrollView {
                          VStack(spacing: 16) {
                              // 顶部标题
                              HStack {
                                  VStack(alignment: .leading, spacing: 4) {
                                      Text("🚀 优选IP筛选工具")
                                          .font(.title2)
                                          .fontWeight(.bold)
                                          .foregroundColor(TechColors.text)
                                      Text("CloudFlare 智能优选 · 极速扫描")
                                          .font(.caption)
                                          .foregroundColor(TechColors.textSecondary)
                                  }
                                  Spacer()
                                  if viewModel.isScanning {
                                      TechPulseView()
                                  }
                              }
                              .padding(.horizontal, 16)
                              .padding(.top, 12)

                              // 状态概览
                              StatusOverviewView(viewModel: viewModel)

                              // 1. 选择文件
                              FileImportView(viewModel: viewModel)

                              // 2. 扫描设置
                              ScanSettingsView(viewModel: viewModel)

                              // 3. 严格模式 + 地区
                              StrictModeView(viewModel: viewModel)

                              // 4. 可用IP列表
                              AvailableIPListView(viewModel: viewModel)

                              // 5. 输出文本
                              OutputTextView(viewModel: viewModel)
                          }
                          .padding(.horizontal, 12)
                          .padding(.bottom, 30)
                      }
                  }
                  .alert("提示", isPresented: $viewModel.showingAlert) {
                      Button("确定") {}
                  } message: {
                      Text(viewModel.alertMessage)
                  }
                  .onAppear {
                      viewModel.detectISP()
                      viewModel.detectLocation()
                  }
              }
          }

          // MARK: - 脉冲动画
          struct TechPulseView: View {
              @State private var isPulsing = false

              var body: some View {
                  Circle()
                      .fill(TechColors.accent)
                      .frame(width: 12, height: 12)
                      .scaleEffect(isPulsing ? 1.6 : 1.0)
                      .opacity(isPulsing ? 0 : 1)
                      .animation(.easeInOut(duration: 0.8).repeatForever(autoreverses: true), value: isPulsing)
                      .onAppear { isPulsing = true }
              }
          }

          // MARK: - 状态概览
          struct StatusOverviewView: View {
              @ObservedObject var viewModel: ScanViewModel

              var body: some View {
                  HStack(spacing: 12) {
                      StatusItem(label: "IP总数", value: "\(viewModel.ipList.count)", icon: "network", color: .blue)
                      StatusItem(label: "可用IP", value: "\(viewModel.availableCount)", icon: "checkmark.circle", color: TechColors.success)
                      StatusItem(label: "最佳延迟", value: viewModel.minDelay > 0 ? String(format: "%.0fms", viewModel.minDelay) : "--", icon: "gauge.medium", color: TechColors.warning)
                      StatusItem(label: "平均延迟", value: viewModel.avgDelay > 0 ? String(format: "%.0fms", viewModel.avgDelay) : "--", icon: "chart.bar", color: .blue)
                  }
                  .padding(12)
                  .background(TechColors.cardBackground)
                  .cornerRadius(12)
                  .overlay(RoundedRectangle(cornerRadius: 12).stroke(TechColors.border, lineWidth: 0.5))
              }
          }

          struct StatusItem: View {
              let label: String
              let value: String
              let icon: String
              let color: Color

              var body: some View {
                  VStack(spacing: 2) {
                      HStack(spacing: 4) {
                          Image(systemName: icon)
                              .font(.caption)
                              .foregroundColor(color)
                          Text(label)
                              .font(.caption2)
                              .foregroundColor(TechColors.textSecondary)
                      }
                      Text(value)
                          .font(.subheadline)
                          .fontWeight(.semibold)
                          .foregroundColor(TechColors.text)
                  }
                  .frame(maxWidth: .infinity)
              }
          }

          // MARK: - 1. 文件导入视图
          struct FileImportView: View {
              @ObservedObject var viewModel: ScanViewModel

              var body: some View {
                  TechCard(title: "📂 选择文件", icon: "folder") {
                      HStack(spacing: 12) {
                          TechButton(title: "App文件夹导入", icon: "folder") {
                              viewModel.showingFileImporter = true
                          }
                          .fileImporter(
                              isPresented: $viewModel.showingFileImporter,
                              allowedContentTypes: [.plainText, .text, .json]
                          ) { result in
                              viewModel.importFile(result: result)
                          }

                          TechButton(title: "粘贴导入", icon: "doc.on.clipboard", color: TechColors.success) {
                              viewModel.showingPasteSheet = true
                          }
                          .sheet(isPresented: $viewModel.showingPasteSheet) {
                              PasteImportView(viewModel: viewModel)
                          }

                          Spacer()

                          if !viewModel.ipSourceText.isEmpty {
                              HStack(spacing: 4) {
                                  Image(systemName: "checkmark.circle.fill")
                                      .foregroundColor(TechColors.success)
                                      .font(.caption)
                                  Text(viewModel.ipSourceText)
                                      .font(.caption)
                                      .foregroundColor(TechColors.textSecondary)
                              }
                          } else {
                              Text("尚未导入文件")
                                  .font(.caption)
                                  .foregroundColor(TechColors.textSecondary)
                          }
                      }
                  }
              }
          }

          // MARK: - 粘贴导入视图
          struct PasteImportView: View {
              @ObservedObject var viewModel: ScanViewModel
              @Environment(\.dismiss) var dismiss
              @State private var pasteText = ""

              var body: some View {
                  ZStack {
                      TechColors.background.ignoresSafeArea()

                      VStack {
                          Text("📋 粘贴导入")
                              .font(.headline)
                              .foregroundColor(TechColors.text)
                              .padding(.top, 20)

                          Text("每行一个IP，支持格式: 1.1.1.1 或 1.1.1.1:443")
                              .font(.caption)
                              .foregroundColor(TechColors.textSecondary)

                          TextEditor(text: $pasteText)
                              .font(.system(.body, design: .monospaced))
                              .foregroundColor(TechColors.text)
                              .background(TechColors.cardBackground)
                              .cornerRadius(8)
                              .padding()
                              .overlay(RoundedRectangle(cornerRadius: 8).stroke(TechColors.border, lineWidth: 1))
                              .frame(maxHeight: .infinity)

                          HStack(spacing: 16) {
                              TechButton(title: "取消", icon: "xmark", color: .gray) {
                                  dismiss()
                              }

                              TechButton(title: "导入", icon: "checkmark", color: TechColors.accent) {
                                  viewModel.importFromPaste(text: pasteText)
                                  dismiss()
                              }
                              .disabled(pasteText.isEmpty)
                          }
                          .padding(.bottom, 20)
                      }
                      .padding()
                  }
                  .presentationDetents([.large])
              }
          }

          // MARK: - 2. 扫描设置视图
          struct ScanSettingsView: View {
              @ObservedObject var viewModel: ScanViewModel

              var body: some View {
                  TechCard(title: "⚙️ 扫描设置", icon: "slider.horizontal.3") {
                      VStack(spacing: 10) {
                          HStack {
                              TechLabel(text: "扫描数量", icon: "number")
                              TechTextField(text: $viewModel.scanCount, placeholder: "留空=全部", width: 80)

                              Spacer()

                              TechLabel(text: "端口筛选", icon: "network")
                              TechTextField(text: $viewModel.portsInput, placeholder: "443,2053,8443", width: 120)
                          }

                          HStack {
                              TechLabel(text: "线程数", icon: "cpu")
                              TechNumberField(value: $viewModel.threadCount, width: 60)

                              Spacer()

                              TechLabel(text: "超时(秒)", icon: "timer")
                              TechNumberField(value: $viewModel.timeout, width: 50)

                              Spacer()

                              TechLabel(text: "SNI域名", icon: "globe")
                              TechTextField(text: $viewModel.sniDomain, placeholder: "speed.cloudflare.com", width: 140)
                          }

                          HStack {
                              TechLabel(text: "运营商", icon: "antenna.radiowaves.left.and.right")

                              Picker("", selection: $viewModel.selectedISP) {
                                  ForEach(ispList, id: \.self) { isp in
                                      Text(isp).tag(isp)
                                  }
                              }
                              .pickerStyle(MenuPickerStyle())
                              .frame(width: 110)
                              .tint(TechColors.accent)

                              Spacer()

                              if viewModel.selectedISP == "自动识别" {
                                  HStack(spacing: 4) {
                                      Text("📍 识别结果:")
                                          .font(.caption2)
                                          .foregroundColor(TechColors.textSecondary)
                                      Text(viewModel.detectedISP)
                                          .font(.caption)
                                          .foregroundColor(TechColors.accent)
                                          .fontWeight(.medium)
                                      if viewModel.detectedISP == "检测中..." {
                                          ProgressView().scaleEffect(0.6)
                                      }
                                  }
                              }

                              Text("当前: ")
                                  .font(.caption2)
                                  .foregroundColor(TechColors.textSecondary)
                              Text(viewModel.currentISP)
                                  .font(.caption)
                                  .foregroundColor(TechColors.success)
                                  .fontWeight(.medium)
                          }
                      }
                  }
              }
          }

          // MARK: - 3. 严格模式 + 地区
          struct StrictModeView: View {
              @ObservedObject var viewModel: ScanViewModel

              var body: some View {
                  TechCard(title: "🔒 严格模式 (TLS握手)", icon: "lock.shield") {
                      VStack(alignment: .leading, spacing: 8) {
                          HStack {
                              Text("只扫描指定地区：")
                                  .font(.caption)
                                  .foregroundColor(TechColors.textSecondary)
                              Spacer()
                              Toggle("", isOn: $viewModel.strictMode)
                                  .labelsHidden()
                                  .tint(TechColors.accent)
                          }

                          Text("不勾选任何地区 = 扫描全部地区")
                              .font(.caption2)
                              .foregroundColor(TechColors.warning)

                          ScrollView(.horizontal, showsIndicators: false) {
                              HStack(spacing: 6) {
                                  ForEach(allRegions, id: \.self) { region in
                                      Button {
                                          viewModel.toggleRegion(region)
                                      } label: {
                                          Text(region)
                                              .font(.caption)
                                              .padding(.horizontal, 12)
                                              .padding(.vertical, 6)
                                              .background(viewModel.selectedRegions.contains(region) ? TechColors.accent : TechColors.cardBackground)
                                              .foregroundColor(viewModel.selectedRegions.contains(region) ? .white : TechColors.textSecondary)
                                              .cornerRadius(16)
                                              .overlay(
                                                  RoundedRectangle(cornerRadius: 16)
                                                      .stroke(viewModel.selectedRegions.contains(region) ? TechColors.accent : TechColors.border, lineWidth: 0.5)
                                              )
                                      }
                                  }
                              }
                          }

                          HStack {
                              TechButton(title: viewModel.isScanning ? "扫描中..." : "开始扫描", icon: "play.fill", color: TechColors.accent) {
                                  viewModel.startScan()
                              }
                              .disabled(viewModel.isScanning || viewModel.ipList.isEmpty)

                              TechButton(title: "停止", icon: "stop.fill", color: .red) {
                                  viewModel.stopScan()
                              }
                              .disabled(!viewModel.isScanning)

                              Spacer()

                              HStack(spacing: 4) {
                                  Circle()
                                      .fill(viewModel.isScanning ? TechColors.success : .gray)
                                      .frame(width: 6, height: 6)
                                  Text(viewModel.statusText)
                                      .font(.caption)
                                      .foregroundColor(TechColors.textSecondary)
                              }
                          }
                      }
                  }
              }
          }

          // MARK: - 4. 可用IP列表
          struct AvailableIPListView: View {
              @ObservedObject var viewModel: ScanViewModel

              var body: some View {
                  TechCard(title: "📋 可用IP（仅显示可连接的IP）", icon: "list.bullet.rectangle") {
                      VStack(alignment: .leading, spacing: 8) {
                          HStack {
                              TechLabel(text: "地区筛选", icon: "location")
                              TechTextField(text: $viewModel.regionFilter, placeholder: "输入地区", width: 120)
                                  .onChange(of: viewModel.regionFilter) { _ in viewModel.updateFilter() }

                              Spacer()

                              TechLabel(text: "端口筛选", icon: "number.circle")
                              TechTextField(text: $viewModel.portFilter, placeholder: "输入端口", width: 80)
                                  .onChange(of: viewModel.portFilter) { _ in viewModel.updateFilter() }

                              Spacer()

                              Text("共 \(viewModel.filteredIPs.count) 个")
                                  .font(.caption)
                                  .foregroundColor(TechColors.accent)
                          }

                          if viewModel.filteredIPs.isEmpty && !viewModel.isScanning {
                              VStack(spacing: 8) {
                                  Image(systemName: "doc.text.magnifyingglass")
                                      .font(.largeTitle)
                                      .foregroundColor(TechColors.textSecondary)
                                  Text("暂无数据，请导入IP并开始扫描")
                                      .font(.caption)
                                      .foregroundColor(TechColors.textSecondary)
                              }
                              .frame(maxWidth: .infinity)
                              .padding(.vertical, 20)
                          } else if viewModel.filteredIPs.isEmpty && viewModel.isScanning {
                              VStack(spacing: 8) {
                                  ProgressView()
                                  Text("扫描中，请稍候...")
                                      .font(.caption)
                                      .foregroundColor(TechColors.textSecondary)
                              }
                              .frame(maxWidth: .infinity)
                              .padding(.vertical, 20)
                          } else {
                              ScrollView {
                                  LazyVStack(alignment: .leading, spacing: 4) {
                                      ForEach(viewModel.filteredIPs) { ip in
                                          IPRowView(ip: ip)
                                      }
                                  }
                              }
                              .frame(maxHeight: 180)
                          }
                      }
                  }
              }
          }

          // MARK: - IP行视图
          struct IPRowView: View {
              let ip: IPInfo

              var body: some View {
                  HStack {
                      Text(ip.ip)
                          .font(.system(.caption, design: .monospaced))
                          .foregroundColor(TechColors.text)

                      Text(":\(ip.port)")
                          .font(.caption2)
                          .foregroundColor(TechColors.textSecondary)

                      Spacer()

                      Text(ip.delayType)
                          .font(.caption2)
                          .foregroundColor(TechColors.textSecondary)
                          .padding(.horizontal, 6)
                          .padding(.vertical, 1)
                          .background(TechColors.cardBackground)
                          .cornerRadius(3)

                      Text("\(String(format: "%.0f", ip.bestDelay))ms")
                          .font(.caption)
                          .fontWeight(.bold)
                          .foregroundColor(ip.qualityColor)

                      Text(ip.quality)
                          .font(.caption2)

                      if !ip.colo.isEmpty {
                          Text("🏢\(ip.colo)")
                              .font(.caption2)
                              .foregroundColor(TechColors.textSecondary)
                      }

                      Text("📍\(ip.country)")
                          .font(.caption2)
                          .foregroundColor(TechColors.textSecondary)
                  }
                  .padding(.vertical, 3)
                  .padding(.horizontal, 8)
                  .background(TechColors.cardBackground.opacity(0.5))
                  .cornerRadius(6)
              }
          }

          // MARK: - 5. 输出文本
          struct OutputTextView: View {
              @ObservedObject var viewModel: ScanViewModel

              var body: some View {
                  TechCard(title: "📝 输出文本（可编辑/可复制）", icon: "doc.text") {
                      VStack(alignment: .leading, spacing: 8) {
                          TextEditor(text: $viewModel.outputText)
                              .font(.system(.caption, design: .monospaced))
                              .foregroundColor(TechColors.text)
                              .frame(height: 100)
                              .background(TechColors.cardBackground)
                              .cornerRadius(8)
                              .overlay(RoundedRectangle(cornerRadius: 8).stroke(TechColors.border, lineWidth: 0.5))

                          HStack {
                              TechButton(title: "复制", icon: "doc.on.doc", color: .blue) {
                                  UIPasteboard.general.string = viewModel.outputText
                                  viewModel.alertMessage = "✅ 已复制到剪贴板"
                                  viewModel.showingAlert = true
                              }
                              .disabled(viewModel.outputText.isEmpty)

                              TechButton(title: "导出可用IP", icon: "square.and.arrow.up", color: TechColors.success) {
                                  viewModel.exportIPs()
                              }
                              .disabled(viewModel.filteredIPs.isEmpty)

                              TechButton(title: "清空", icon: "trash", color: .red) {
                                  viewModel.outputText = ""
                              }
                              .disabled(viewModel.outputText.isEmpty)

                              Spacer()

                              if !viewModel.outputText.isEmpty {
                                  Text("\(viewModel.outputText.split(separator: "\n").count) 行")
                                      .font(.caption2)
                                      .foregroundColor(TechColors.textSecondary)
                              }
                          }
                      }
                  }
              }
          }

          // MARK: - 通用组件
          struct TechCard<Content: View>: View {
              let title: String
              let icon: String
              let content: Content

              init(title: String, icon: String, @ViewBuilder content: () -> Content) {
                  self.title = title
                  self.icon = icon
                  self.content = content()
              }

              var body: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      HStack {
                          Image(systemName: icon)
                              .foregroundColor(TechColors.accent)
                          Text(title)
                              .font(.headline)
                              .foregroundColor(TechColors.text)
                          Spacer()
                      }
                      content
                  }
                  .padding(14)
                  .background(TechColors.cardBackground)
                  .cornerRadius(12)
                  .overlay(RoundedRectangle(cornerRadius: 12).stroke(TechColors.border, lineWidth: 0.5))
              }
          }

          struct TechButton: View {
              let title: String
              let icon: String
              var color: Color = TechColors.accent
              let action: () -> Void

              var body: some View {
                  Button(action: action) {
                      HStack(spacing: 4) {
                          Image(systemName: icon)
                              .font(.caption)
                          Text(title)
                              .font(.caption)
                      }
