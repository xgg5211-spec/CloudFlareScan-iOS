name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create Project
        run: |
          mkdir -p CloudFlareScan
          mkdir -p CloudFlareScan.xcodeproj

      - name: Create Source Files
        run: |
          # AppDelegate.swift
          cat > CloudFlareScan/AppDelegate.swift << 'EOF'
          import UIKit
          import SwiftUI

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = UIHostingController(rootView: ContentView())
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # ContentView.swift
          cat > CloudFlareScan/ContentView.swift << 'EOF'
          import SwiftUI

          struct IPItem: Identifiable {
              let id = UUID()
              var ip: String
              var port: Int
              var delay: Double
              var country: String
              var colo: String
              var isp: String
          }

          class ScanManager: ObservableObject {
              @Published var ipList: [IPItem] = []
              @Published var results: [IPItem] = []
              @Published var isScanning = false
              @Published var statusText = "就绪"
              @Published var availableCount = 0
              @Published var bestDelay: Double = 0
              @Published var avgDelay: Double = 0
              @Published var detectedISP: String = "检测中..."
              @Published var inputText: String = ""

              func detectISP() {
                  guard let url = URL(string: "http://ip-api.com/json/?fields=isp") else { return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data else { return }
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         let isp = json["isp"] as? String {
                          DispatchQueue.main.async {
                              self.detectedISP = isp
                          }
                      }
                  }.resume()
              }

              func importIPs() {
                  let lines = inputText.split(separator: "\n").map { String($0).trimmingCharacters(in: .whitespaces) }
                  var list: [IPItem] = []
                  for line in lines {
                      if line.isEmpty { continue }
                      let parts = line.split(separator: ":")
                      let ip = String(parts[0])
                      let port = parts.count > 1 ? Int(parts[1]) ?? 443 : 443
                      if ip.contains(".") || ip.contains(":") {
                          list.append(IPItem(ip: ip, port: port, delay: 0, country: "", colo: "", isp: ""))
                      }
                  }
                  self.ipList = list
                  self.results = []
                  self.availableCount = 0
                  self.bestDelay = 0
                  self.avgDelay = 0
                  self.statusText = "已导入 \(list.count) 个IP"
              }

              func startScan() {
                  guard !ipList.isEmpty else {
                      statusText = "请先导入IP"
                      return
                  }

                  isScanning = true
                  statusText = "扫描中..."
                  results = []
                  availableCount = 0
                  bestDelay = 0
                  avgDelay = 0

                  let ips = ipList
                  var allResults: [IPItem] = []
                  let lock = NSLock()
                  let group = DispatchGroup()
                  let semaphore = DispatchSemaphore(value: 100)

                  for ip in ips {
                      group.enter()
                      semaphore.wait()
                      DispatchQueue.global().async {
                          self.checkIP(ip: ip, completion: { result in
                              lock.lock()
                              if let r = result {
                                  allResults.append(r)
                              }
                              lock.unlock()
                              semaphore.signal()
                              group.leave()

                              DispatchQueue.main.async {
                                  let available = allResults.filter { $0.delay > 0 }
                                  self.results = available
                                  self.availableCount = available.count
                                  let delays = available.map { $0.delay }
                                  if !delays.isEmpty {
                                      self.bestDelay = delays.min() ?? 0
                                      self.avgDelay = delays.reduce(0, +) / Double(delays.count)
                                  }
                                  self.statusText = "扫描中... \(available.count) 个可用"
                              }
                          })
                      }
                  }

                  group.notify(queue: .main) {
                      self.isScanning = false
                      let available = allResults.filter { $0.delay > 0 }
                      self.results = available
                      self.availableCount = available.count
                      self.statusText = "✅ 完成！共 \(available.count) 个可用IP"
                  }
              }

              func checkIP(ip: IPItem, completion: @escaping (IPItem?) -> Void) {
                  let port = ip.port > 0 ? ip.port : 443
                  let urlString = "https://\(ip.ip):\(port)/cdn-cgi/trace"
                  guard let url = URL(string: urlString) else {
                      completion(nil)
                      return
                  }

                  let start = Date()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = 3
                  config.timeoutIntervalForResource = 3
                  let session = URLSession(configuration: config)

                  session.dataTask(with: url) { data, response, _ in
                      guard let data = data, let http = response as? HTTPURLResponse, http.statusCode == 200 else {
                          completion(nil)
                          return
                      }

                      let delay = Date().timeIntervalSince(start) * 1000
                      let text = String(data: data, encoding: .utf8) ?? ""
                      var colo = ""
                      for line in text.split(separator: "\n") {
                          if line.hasPrefix("colo=") {
                              colo = String(line.dropFirst(5))
                              break
                          }
                      }

                      var result = ip
                      result.port = port
                      result.delay = delay
                      result.colo = colo

                      let locationURL = URL(string: "http://ip-api.com/json/\(ip.ip)?fields=country,isp")!
                      URLSession.shared.dataTask(with: locationURL) { locData, _, _ in
                          if let locData = locData,
                             let json = try? JSONSerialization.jsonObject(with: locData) as? [String: Any] {
                              result.country = json["country"] as? String ?? ""
                              result.isp = json["isp"] as? String ?? ""
                          }
                          completion(result)
                      }.resume()
                  }.resume()
              }

              func stopScan() {
                  isScanning = false
                  statusText = "已停止"
              }

              func copyResults() {
                  let text = results.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }

              func copyDetails() {
                  let text = results.map { "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }

              func copyAll() {
                  var text = "# 优选IP列表\n"
                  text += "# 运营商: \(detectedISP)\n"
                  text += "# 可用: \(availableCount) 个\n"
                  text += "# 最佳: \(String(format: "%.0f", bestDelay))ms\n\n"
                  text += results.map { "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }

              func exportIPs() {
                  let text = results.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }
          }

          struct ContentView: View {
              @StateObject private var manager = ScanManager()
              @State private var alertMsg = ""

              var body: some View {
                  ZStack {
                      Color(red: 0.06, green: 0.08, blue: 0.15).ignoresSafeArea()

                      VStack(spacing: 0) {
                          HStack {
                              Text("🚀 优选IP筛选")
                                  .font(.title2)
                                  .fontWeight(.bold)
                                  .foregroundColor(.white)
                              Spacer()
                              Text("📍 \(manager.detectedISP)")
                                  .font(.caption)
                                  .foregroundColor(.blue)
                          }
                          .padding(.horizontal)
                          .padding(.top, 12)

                          HStack(spacing: 12) {
                              VStack { Text("总数").font(.caption2).foregroundColor(.gray); Text("\(manager.ipList.count)").foregroundColor(.white) }
                              VStack { Text("可用").font(.caption2).foregroundColor(.gray); Text("\(manager.availableCount)").foregroundColor(.green) }
                              VStack { Text("最佳").font(.caption2).foregroundColor(.gray); Text(manager.bestDelay > 0 ? String(format: "%.0fms", manager.bestDelay) : "--").foregroundColor(.orange) }
                              VStack { Text("平均").font(.caption2).foregroundColor(.gray); Text(manager.avgDelay > 0 ? String(format: "%.0fms", manager.avgDelay) : "--").foregroundColor(.blue) }
                              Spacer()
                              Text(manager.statusText).font(.caption2).foregroundColor(.gray)
                          }
                          .padding(.horizontal)
                          .padding(.vertical, 8)
                          .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                          .cornerRadius(8)
                          .padding(.horizontal)

                          VStack(alignment: .leading, spacing: 4) {
                              Text("📂 导入IP (每行一个)").font(.caption).foregroundColor(.gray)
                              TextEditor(text: $manager.inputText)
                                  .font(.system(.caption, design: .monospaced))
                                  .foregroundColor(.white)
                                  .frame(height: 70)
                                  .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                  .cornerRadius(6)
                          }
                          .padding(.horizontal)
                          .padding(.top, 8)

                          HStack(spacing: 8) {
                              Button("📥 导入") {
                                  manager.importIPs()
                                  alertMsg = "已导入 \(manager.ipList.count) 个IP"
                              }
                              .buttonStyle(.bordered)
                              .font(.caption)
                              .controlSize(.small)

                              Button("▶ 开始") {
                                  manager.startScan()
                              }
                              .buttonStyle(.borderedProminent)
                              .font(.caption)
                              .controlSize(.small)
                              .disabled(manager.isScanning || manager.ipList.isEmpty)

                              Button("⏹ 停止") {
                                  manager.stopScan()
                              }
                              .buttonStyle(.bordered)
                              .font(.caption)
                              .controlSize(.small)
                              .disabled(!manager.isScanning)

                              Menu {
                                  Button("复制IP") { manager.copyResults(); alertMsg = "已复制IP" }
                                  Button("复制详情") { manager.copyDetails(); alertMsg = "已复制详情" }
                                  Button("复制完整报告") { manager.copyAll(); alertMsg = "已复制报告" }
                                  Button("导出IP") { manager.exportIPs(); alertMsg = "已导出" }
                              } label: {
                                  Label("📋", systemImage: "doc.on.doc")
                                      .font(.caption)
                                      .padding(.horizontal, 8)
                                      .padding(.vertical, 4)
                                      .background(Color.blue.opacity(0.2))
                                      .cornerRadius(6)
                              }
                              .disabled(manager.results.isEmpty)
                          }
                          .padding(.horizontal)
                          .padding(.vertical, 6)

                          HStack {
                              Text("🔍 地区")
                                  .font(.caption2)
                                  .foregroundColor(.gray)
                              TextField("过滤地区", text: .constant(""))
                                  .textFieldStyle(.roundedBorder)
                                  .font(.caption)
                                  .frame(width: 100)
                              Spacer()
                              Text("端口")
                                  .font(.caption2)
                                  .foregroundColor(.gray)
                              TextField("过滤端口", text: .constant(""))
                                  .textFieldStyle(.roundedBorder)
                                  .font(.caption)
                                  .frame(width: 60)
                              Spacer()
                              Text("显示 \(manager.results.count) 个")
                                  .font(.caption2)
                                  .foregroundColor(.blue)
                          }
                          .padding(.horizontal)
                          .padding(.vertical, 4)

                          List(manager.results) { ip in
                              HStack {
                                  Text(ip.ip)
                                      .font(.system(.caption, design: .monospaced))
                                      .foregroundColor(.white)
                                  Text(":\(ip.port)")
                                      .font(.caption2)
                                      .foregroundColor(.gray)
                                  Spacer()
                                  Text("\(String(format: "%.0f", ip.delay))ms")
                                      .font(.caption)
                                      .fontWeight(.bold)
                                      .foregroundColor(ip.delay < 50 ? .green : ip.delay < 100 ? .orange : .red)
                                  if !ip.colo.isEmpty {
                                      Text("🏢\(ip.colo)")
                                          .font(.caption2)
                                          .foregroundColor(.blue)
                                  }
                                  Text("📍\(ip.country)")
                                      .font(.caption2)
                                      .foregroundColor(.gray)
                              }
                              .padding(.vertical, 2)
                          }
                          .listStyle(.plain)
                          .scrollContentBackground(.hidden)

                          VStack(alignment: .leading, spacing: 4) {
                              Text("📝 输出").font(.caption).foregroundColor(.gray)
                              let outputText = manager.results.map { "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)" }.joined(separator: "\n")
                              TextEditor(text: .constant(outputText))
                                  .font(.system(.caption, design: .monospaced))
                                  .foregroundColor(.white)
                                  .frame(height: 60)
                                  .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                  .cornerRadius(6)
                          }
                          .padding(.horizontal)
                          .padding(.bottom, 8)
                      }
                  }
                  .alert(alertMsg, isPresented: .constant(!alertMsg.isEmpty)) {
                      Button("确定") { alertMsg = "" }
                  }
                  .onAppear {
                      manager.detectISP()
                      manager.inputText = "1.1.1.1\n8.8.8.8\n9.9.9.9\n104.16.0.0"
                  }
              }
          }
          EOF

      - name: Create Xcode Project
        run: |
          cat > CloudFlareScan.xcodeproj/project.pbxproj << 'EOF'
          // !$*UTF8*$!
          {
              archiveVersion = 1;
              classes = {};
              objectVersion = 56;
              objects = {
                  J100000001 /* AppDelegate.swift in Sources */ = {isa = PBXBuildFile; fileRef = J100000002 /* AppDelegate.swift */; };
                  J100000003 /* ContentView.swift in Sources */ = {isa = PBXBuildFile; fileRef = J100000004 /* ContentView.swift */; };
                  J100000002 /* AppDelegate.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = AppDelegate.swift; sourceTree = "<group>"; };
                  J100000004 /* ContentView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ContentView.swift; sourceTree = "<group>"; };
                  J100000005 /* CloudFlareScan.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = CloudFlareScan.app; sourceTree = BUILT_PRODUCTS_DIR; };
                  J100000006 = {isa = PBXGroup; children = (J100000007, J100000008,); sourceTree = "<group>"; };
                  J100000007 /* CloudFlareScan */ = {isa = PBXGroup; children = (J100000002, J100000004,); path = CloudFlareScan; sourceTree = "<group>"; };
                  J100000008 /* Products */ = {isa = PBXGroup; children = (J100000005,); name = Products; sourceTree = "<group>"; };
                  J100000009 /* CloudFlareScan */ = {isa = PBXNativeTarget; buildConfigurationList = J100000010; buildPhases = (J100000011, J100000012,); buildRules = (); dependencies = (); name = CloudFlareScan; productName = CloudFlareScan; productReference = J100000005; productType = "com.apple.product-type.application"; };
                  J100000013 /* Project object */ = {isa = PBXProject; attributes = {LastSwiftUpdateCheck = 1500; LastUpgradeCheck = 1500; TargetAttributes = {J100000009 = {CreatedOnToolsVersion = 15.0;};};}; buildConfigurationList = J100000014; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base,); mainGroup = J100000006; productRefGroup = J100000008; projectDirPath = ""; projectRoot = ""; targets = (J100000009,); };
                  J100000012 /* Resources */ = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
                  J100000011 /* Sources */ = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (J100000001, J100000003,); runOnlyForDeploymentPostprocessing = 0; };
                  J100000015 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 15.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Debug; };
                  J100000016 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 15.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Release; };
                  J100000017 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGN_STYLE = Manual; CURRENT_PROJECT_VERSION = 1; DEVELOPMENT_TEAM = ""; GENERATE_INFOPLIST_FILE = YES; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.cloudflarescan.ios; PRODUCT_NAME = CloudFlareScan; SWIFT_VERSION = 5.0; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Debug; };
                  J100000018 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGN_STYLE = Manual; CURRENT_PROJECT_VERSION = 1; DEVELOPMENT_TEAM = ""; GENERATE_INFOPLIST_FILE = YES; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.cloudflarescan.ios; PRODUCT_NAME = CloudFlareScan; SWIFT_VERSION = 5.0; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Release; };
                  J100000010 = {isa = XCConfigurationList; buildConfigurations = (J100000017, J100000018,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
                  J100000014 = {isa = XCConfigurationList; buildConfigurations = (J100000015, J100000016,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
              };
              rootObject = J100000013;
          }
          EOF

      - name: Build App
        run: |
          xcodebuild -project CloudFlareScan.xcodeproj \
            -scheme CloudFlareScan \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到 .app 文件"
            ls -la build/
            exit 1
          fi

          echo "✅ 找到: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa
          ls -la *.ipa *.tipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
          retention-days: 30
