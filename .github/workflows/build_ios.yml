name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build-ipa:
    runs-on: macos-14 # Apple Silicon (M系列) 节点

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 缓存 Kivy-iOS 编译依赖
      - name: Cache Kivy-iOS Toolchain
        uses: actions/cache@v4
        with:
          path: ~/.kivy-ios
          key: ${{ runner.os }}-kivy-ios-v1
          restore-keys: |
            ${{ runner.os }}-kivy-ios-

      - name: Install dependencies & kivy-ios
        run: |
          brew install autoconf automake libtool pkg-config
          pip install kivy-ios cython

      - name: Build Kivy iOS Toolchain
        run: |
          toolchain build python3 kivy
          toolchain create cloudflarescan .

      - name: Compile Xcode & Package IPA
        run: |
          cd cloudflarescan-ios
          xcodebuild -project cloudflarescan.xcodeproj \
                     -scheme cloudflarescan \
                     -configuration Release \
                     -sdk iphoneos \
                     CONFIGURATION_BUILD_DIR=build/Release-iphoneos \
                     IPHONEOS_DEPLOYMENT_TARGET=13.0 \
                     ENABLE_USER_SCRIPT_SANDBOXING=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
          
          # 打包为 TrollStore 可用的非签名 IPA
          mkdir -p Payload
          cp -r build/Release-iphoneos/cloudflarescan.app Payload/
          zip -r CloudFlareScan.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: cloudflarescan-ios/CloudFlareScan.ipa
