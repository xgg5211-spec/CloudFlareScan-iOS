name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
    inputs:
      custom_ips:
        description: '自定义IP列表（每行一个，留空则自动生成）'
        required: false
        default: ''
        type: string
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create Xcode Project
        run: |
          mkdir -p CloudFlareScan
          mkdir -p CloudFlareScan.xcodeproj
          mkdir -p CloudFlareScan/Assets.xcassets/AppIcon.appiconset
          mkdir -p CloudFlareScan/Assets.xcassets/AccentColor.colorset

          cat > CloudFlareScan/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>$(DEVELOPMENT_LANGUAGE)</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>$(PRODUCT_BUNDLE_PACKAGE_TYPE)</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
                  <key>UISceneConfigurations</key>
                  <dict>
                      <key>UIWindowSceneSessionRoleApplication</key>
                      <array>
                          <dict>
                              <key>UISceneConfigurationName</key>
                              <string>Default Configuration</string>
                              <key>UISceneDelegateClassName</key>
                              <string>$(PRODUCT_MODULE_NAME).SceneDelegate</string>
                          </dict>
                      </array>
                  </dict>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Create Swift Source Files
        run: |
          cat > CloudFlareScan/AppDelegate.swift << 'EOF'
          import UIKit
          import SwiftUI

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = UIHostingController(rootView: ContentView())
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }

              func application(_ application: UIApplication, configurationForConnecting connectingSceneSession: UISceneSession, options: UIScene.ConnectionOptions) -> UISceneConfiguration {
                  return UISceneConfiguration(name: "Default Configuration", sessionRole: connectingSceneSession.role)
              }
          }
          EOF

          cat > CloudFlareScan/SceneDelegate.swift << 'EOF'
          import UIKit
          import SwiftUI

          class SceneDelegate: UIResponder, UIWindowSceneDelegate {
              var window: UIWindow?

              func scene(_ scene: UIScene, willConnectTo session: UISceneSession, options connectionOptions: UIScene.ConnectionOptions) {
                  let contentView = ContentView()
                  if let windowScene = scene as? UIWindowScene {
                      let window = UIWindow(windowScene: windowScene)
                      window.rootViewController = UIHostingController(rootView: contentView)
                      self.window = window
                      window.makeKeyAndVisible()
                  }
              }
          }
          EOF

          cat > CloudFlareScan/ContentView.swift << 'EOF'
          import SwiftUI

          struct IPInfo: Identifiable {
              let id = UUID()
              var ip: String
              var port: Int
              var delay: Double
              var location: String
              var isp: String
              var isAvailable: Bool
              var colo: String
          }

          class NetworkManager: ObservableObject {
              @Published var ipList: [IPInfo] = []
              @Published var isScanning = false
              @Published var progress = 0.0
              @Published var scanLog = ""
              @Published var availableCount = 0

              private let cfRanges = [
                  "173.245.48.0/20", "103.21.244.0/22", "103.22.200.0/22",
                  "103.31.4.0/22", "141.101.64.0/18", "108.162.192.0/18",
                  "190.93.240.0/20", "188.114.96.0/20", "197.234.240.0/22",
                  "198.41.128.0/17", "162.158.0.0/15", "104.16.0.0/13",
                  "104.24.0.0/14", "172.64.0.0/14", "131.0.72.0/22"
              ]

              func startScan(customIPs: [String] = [], port: Int = 443) {
                  isScanning = true
                  ipList = []
                  availableCount = 0
                  scanLog = ""
                  scanLog += "📡 开始扫描...\n"

                  let ips = customIPs.isEmpty ? generateIPs() : customIPs
                  let total = ips.count
                  scanLog += "📊 待测IP: \(total) 个\n"

                  DispatchQueue.global(qos: .userInitiated).async {
                      var results: [IPInfo] = []
                      let group = DispatchGroup()
                      let semaphore = DispatchSemaphore(value: 100)
                      let lock = NSLock()

                      for ip in ips {
                          group.enter()
                          semaphore.wait()
                          DispatchQueue.global().async {
                              let result = self.testIP(ip, port: port)
                              if let (delay, colo) = result {
                                  lock.lock()
                                  results.append(IPInfo(
                                      ip: ip,
                                      port: port,
                                      delay: delay,
                                      location: "Unknown",
                                      isp: "Unknown",
                                      isAvailable: true,
                                      colo: colo
                                  ))
                                  lock.unlock()
                              }
                              semaphore.signal()
                              group.leave()
                          }
                      }

                      group.wait()

                      DispatchQueue.main.async {
                          self.ipList = results.sorted { $0.delay < $1.delay }
                          self.availableCount = results.count
                          self.isScanning = false
                          self.progress = 1.0
                          self.scanLog += "✅ 扫描完成！找到 \(results.count) 个可用IP\n"
                      }
                  }
              }

              private func generateIPs() -> [String] {
                  var ips: [String] = []
                  for cidr in cfRanges {
                      let parts = cidr.split(separator: "/")
                      guard parts.count == 2, let prefix = Int(parts[1]) else { continue }
                      let ipParts = parts[0].split(separator: ".")
                      guard ipParts.count == 4 else { continue }
                      let base = (UInt32(ipParts[0])! << 24) | (UInt32(ipParts[1])! << 16) | (UInt32(ipParts[2])! << 8) | UInt32(ipParts[3])!
                      let count = 1 << (32 - prefix)
                      for i in 1...min(count, 200) {
                          let addr = base + UInt32(i)
                          let ip = "\((addr >> 24) & 255).\((addr >> 16) & 255).\((addr >> 8) & 255).\(addr & 255)"
                          ips.append(ip)
                      }
                  }
                  return ips
              }

              private func testIP(_ ip: String, port: Int) -> (Double, String)? {
                  let urlString = "https://\(ip):\(port)/cdn-cgi/trace"
                  guard let url = URL(string: urlString) else { return nil }
                  let start = Date()
                  let semaphore = DispatchSemaphore(value: 0)
                  var result: (Double, String)?

                  let task = URLSession.shared.dataTask(with: url) { data, response, _ in
                      if let httpResponse = response as? HTTPURLResponse, httpResponse.statusCode == 200 {
                          let delay = Date().timeIntervalSince(start) * 1000
                          var colo = ""
                          if let data = data, let text = String(data: data, encoding: .utf8) {
                              for line in text.split(separator: "\n") {
                                  if line.hasPrefix("colo=") {
                                      colo = String(line.dropFirst(5))
                                      break
                                  }
                              }
                          }
                          result = (delay, colo)
                      }
                      semaphore.signal()
                  }
                  task.resume()
                  _ = semaphore.wait(timeout: .now() + 3)
                  task.cancel()
                  return result
              }

              func copyBestIPs(_ count: Int = 10) {
                  let bestIPs = ipList.filter { $0.isAvailable }.prefix(count)
                  let text = bestIPs.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }

              func copyWithColo() {
                  let bestIPs = ipList.filter { $0.isAvailable }.prefix(20)
                  let text = bestIPs.map { "\($0.ip):\($0.port)  \(String(format: "%.0f", $0.delay))ms  \($0.colo)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }

              func copyAll() {
                  let text = ipList.filter { $0.isAvailable }.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
              }
          }

          struct ContentView: View {
              @StateObject private var networkManager = NetworkManager()
              @State private var selectedPort = 443
              @State private var customIPInput = ""
              @State private var showingAlert = false
              @State private var alertMessage = ""

              let ports = [443, 2053, 2083, 2087, 2096, 8443]

              var body: some View {
                  NavigationView {
                      VStack(spacing: 0) {
                          HStack {
                              Circle()
                                  .fill(networkManager.isScanning ? Color.green : Color.gray)
                                  .frame(width: 10, height: 10)
                              Text(networkManager.isScanning ? "扫描中..." : "就绪")
                                  .font(.caption)
                              Spacer()
                              if networkManager.isScanning {
                                  ProgressView(value: networkManager.progress)
                                      .frame(width: 80)
                              }
                              Text("\(networkManager.ipList.count) 个")
                                  .font(.caption)
                              if networkManager.availableCount > 0 {
                                  Text("✅\(networkManager.availableCount)")
                                  .font(.caption)
                                  .foregroundColor(.green)
                              }
                          }
                          .padding(.horizontal)
                          .padding(.vertical, 8)
                          .background(Color(.systemBackground))

                          VStack(spacing: 10) {
                              HStack(spacing: 10) {
                                  Picker("端口", selection: $selectedPort) {
                                      ForEach(ports, id: \.self) { port in
                                          Text("\(port)").tag(port)
                                      }
                                  }
                                  .pickerStyle(MenuPickerStyle())
                                  .frame(width: 80)
                                  .disabled(networkManager.isScanning)

                                  if networkManager.isScanning {
                                      Button("停止") {
                                          networkManager.isScanning = false
                                      }
                                      .buttonStyle(.borderedProminent)
                                      .tint(.red)
                                  } else {
                                      Button("开始扫描") {
                                          let customIPs = customIPInput.split(separator: "\n").map { String($0).trimmingCharacters(in: .whitespaces) }
                                          networkManager.startScan(customIPs: customIPs, port: selectedPort)
                                      }
                                      .buttonStyle(.borderedProminent)
                                      .tint(.blue)
                                  }

                                  Menu {
                                      Button("复制前10个") {
                                          if networkManager.ipList.isEmpty {
                                              alertMessage = "请先扫描"
                                              showingAlert = true
                                              return
                                          }
                                          networkManager.copyBestIPs()
                                          alertMessage = "✅ 已复制到剪贴板"
                                          showingAlert = true
                                      }
                                      Button("复制带数据中心") {
                                          if networkManager.ipList.isEmpty {
                                              alertMessage = "请先扫描"
                                              showingAlert = true
                                              return
                                          }
                                          networkManager.copyWithColo()
                                          alertMessage = "✅ 已复制到剪贴板"
                                          showingAlert = true
                                      }
                                      Button("复制全部") {
                                          if networkManager.ipList.isEmpty {
                                              alertMessage = "请先扫描"
                                              showingAlert = true
                                              return
                                          }
                                          networkManager.copyAll()
                                          alertMessage = "✅ 已复制全部IP"
                                          showingAlert = true
                                      }
                                  } label: {
                                      Image(systemName: "doc.on.doc")
                                          .font(.title2)
                                  }
                                  .disabled(networkManager.isScanning)
                              }

                              VStack(alignment: .leading, spacing: 2) {
                                  HStack {
                                      Image(systemName: "plus.circle")
                                          .foregroundColor(.blue)
                                      Text("自定义IP（每行一个）")
                                          .font(.caption)
                                          .foregroundColor(.secondary)
                                      Spacer()
                                      let count = customIPInput.split(separator: "\n").count
                                      if count > 0 {
                                          Text("\(count)个")
                                              .font(.caption)
                                              .foregroundColor(.blue)
                                      }
                                      if !customIPInput.isEmpty {
                                          Button("清空") {
                                              customIPInput = ""
                                          }
                                          .font(.caption)
                                          .foregroundColor(.red)
                                      }
                                  }
                                  TextEditor(text: $customIPInput)
                                      .frame(minHeight: 40, maxHeight: 60)
                                      .font(.system(.caption, design: .monospaced))
                                      .background(Color(.systemGray6))
                                      .cornerRadius(6)
                                      .disabled(networkManager.isScanning)
                              }
                          }
                          .padding(.horizontal)
                          .padding(.vertical, 8)

                          List(networkManager.ipList.filter { $0.isAvailable }) { ip in
                              HStack {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(ip.ip)
                                          .font(.system(.body, design: .monospaced))
                                      HStack(spacing: 8) {
                                          Text("端口: \(ip.port)")
                                              .font(.caption)
                                              .foregroundColor(.secondary)
                                          if !ip.colo.isEmpty {
                                              Text("🏢 \(ip.colo)")
                                                  .font(.caption)
                                                  .foregroundColor(.blue)
                                          }
                                      }
                                  }
                                  Spacer()
                                  Text("\(String(format: "%.0f", ip.delay))ms")
                                      .foregroundColor(ip.delay < 50 ? .green : ip.delay < 100 ? .orange : .red)
                                      .fontWeight(.bold)
                              }
                              .padding(.vertical, 2)
                          }

                          ScrollView {
                              Text(networkManager.scanLog)
                                  .font(.system(.caption2, design: .monospaced))
                                  .foregroundColor(.gray)
                                  .frame(maxWidth: .infinity, alignment: .leading)
                                  .padding(.horizontal)
                                  .padding(.vertical, 4)
                          }
                          .frame(height: 70)
                          .background(Color(.systemGray6))
                      }
                      .navigationTitle("🌐 CF优选扫描")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  networkManager.scanLog = ""
                              } label: {
                                  Image(systemName: "trash")
                              }
                              .disabled(networkManager.scanLog.isEmpty)
                          }
                      }
                      .alert("提示", isPresented: $showingAlert) {
                          Button("确定") {}
                      } message: {
                          Text(alertMessage)
                      }
                  }
              }
          }
          EOF

      - name: Create Assets
        run: |
          cat > CloudFlareScan/Assets.xcassets/Contents.json << 'EOF'
          {"info":{"author":"xcode","version":1}}
          EOF
          cat > CloudFlareScan/Assets.xcassets/AppIcon.appiconset/Contents.json << 'EOF'
          {"images":[{"idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          EOF
          cat > CloudFlareScan/Assets.xcassets/AccentColor.colorset/Contents.json << 'EOF'
          {"colors":[{"idiom":"universal"}],"info":{"author":"xcode","version":1}}
          EOF

      - name: Create Xcode Project File
        run: |
          cat > CloudFlareScan.xcodeproj/project.pbxproj << 'EOF'
