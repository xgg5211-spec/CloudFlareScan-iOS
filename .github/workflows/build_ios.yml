name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 保持与 kivy-ios 内部 hostpython 版本一致

      - name: Install macOS System Dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config cmake ldid

      - name: Install Kivy-iOS and Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0.0"
          pip install kivy-ios

      - name: Restore Kivy-iOS Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kivy-ios
            build
            dist
          key: ${{ runner.os }}-kivy-ios-v5-${{ hashFiles('**/requirements.txt', '**/main.py') }}
          restore-keys: |
            ${{ runner.os }}-kivy-ios-v5-

      - name: Build Kivy-iOS Recipes
        run: |
          toolchain build python3 kivy openssl

      # 关键修复：加入 NO_EXTENSIONS 环境变量，强制使用纯 Python 模式安装网络库，防止打包脚本崩溃
      - name: Install Python Package Dependencies
        run: |
          export AIOHTTP_NO_EXTENSIONS=1
          export YARL_NO_EXTENSIONS=1
          export MULTIDICT_NO_EXTENSIONS=1
          export FROZENLIST_NO_EXTENSIONS=1
          toolchain pip install certifi multidict yarl frozenlist aiosignal async-timeout aiohttp

      - name: Create Xcode Project
        run: |
          toolchain create "cloudflarescan" .

      - name: Build Xcode Project
        run: |
          cd cloudflarescan-ios
          xcodebuild -project cloudflarescan.xcodeproj \
            -scheme cloudflarescan \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -R cloudflarescan-ios/build/Release-iphoneos/*.app Payload/
          APP_NAME=$(ls Payload/)
          ldid -S "Payload/$APP_NAME/cloudflarescan" || ldid -S "Payload/$APP_NAME/${APP_NAME%.app}"
          zip -r CloudflareScan-iOS-TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-iOS-TrollStore
          path: CloudflareScan-iOS-TrollStore.ipa
          retention-days: 7
