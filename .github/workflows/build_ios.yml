name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install macOS System Dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config cmake ldid

      - name: Install Kivy-iOS and Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0.0"
          pip install kivy-ios

      - name: Restore Kivy-iOS Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kivy-ios
            build
            dist
          key: ${{ runner.os }}-kivy-ios-v3-${{ hashFiles('**/requirements.txt', '**/main.py') }}
          restore-keys: |
            ${{ runner.os }}-kivy-ios-v3-

      # 修正：去除了 certifi Recipe（仅保留需底层 C 编译的库）
      - name: Build Kivy-iOS Recipes
        run: |
          toolchain build python3 kivy openssl

      # 修正：将 certifi 统一通过 toolchain pip 安装
      - name: Install Python Package Dependencies
        run: |
          toolchain pip install certifi aiohttp multidict yarl frozenlist aiosignal async-timeout

      - name: Create Xcode Project
        run: |
          toolchain create "CloudflareScan" .

      - name: Build Xcode Project
        run: |
          cd cloudflarescan-ios
          xcodebuild -project CloudflareScan.xcodeproj \
            -scheme CloudflareScan \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -R cloudflarescan-ios/build/Release-iphoneos/CloudflareScan.app Payload/
          ldid -S Payload/CloudflareScan.app/CloudflareScan
          zip -r CloudflareScan-iOS-TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-iOS-TrollStore
          path: CloudflareScan-iOS-TrollStore.ipa
          retention-days: 7
